name: Package a MODFLOW program
description: >
  Zip everything in bin/ as <ostag>.zip (linux, macarm or win64), with the
  files at the archive root, and on Linux also zip the source as
  <name>_source.zip. The archives are made the same way on every platform,
  with modflow_devtools/release/package.py. Outputs the directory holding
  the archives, and optionally uploads them as artifact dist-<ostag> for the
  release-finish action.
inputs:
  path:
    description: Directory of the program repo checkout
    default: .
  name:
    description: Program name, used for the source archive
    required: true
  source-paths:
    description: >
      Space-separated paths to put in the source archive, or `none` to skip
      it; by default meson.build, meson.options (if present) and src
    default: ""
  upload:
    description: >
      Upload the archives as artifact dist-<ostag>; do this from one job per
      platform in a release build
    default: "false"
outputs:
  ostag:
    description: The platform tag
    value: ${{ steps.package.outputs.ostag }}
  dist:
    description: Directory holding the archives
    value: ${{ steps.package.outputs.dist }}
runs:
  using: composite
  steps:
    - name: Setup Python
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        update-environment: false

    - name: Zip archives
      id: package
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        PYTHONPATH: ${{ github.action_path }}/../..
        NAME: ${{ inputs.name }}
        SOURCE_PATHS: ${{ inputs.source-paths }}
      run: |
        dist="$RUNNER_TEMP/dist"
        args=(--name "$NAME" --dist "$dist")
        if [[ "$SOURCE_PATHS" == "none" ]]; then
          args+=(--source-paths)
        elif [[ -n "$SOURCE_PATHS" ]]; then
          read -ra paths <<< "$SOURCE_PATHS"
          args+=(--source-paths "${paths[@]}")
        fi
        ostag=$("$PYTHON" -P -m modflow_devtools.release.package "${args[@]}")
        ls -l "$dist"
        echo "ostag=$ostag" >> "$GITHUB_OUTPUT"
        echo "dist=$dist" >> "$GITHUB_OUTPUT"

    - name: Upload archives
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ steps.package.outputs.ostag }}
        path: ${{ steps.package.outputs.dist }}/*.zip
        if-no-files-found: error
