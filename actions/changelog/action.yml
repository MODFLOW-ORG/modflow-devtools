name: Changelog
description: >
  Prepend a release's features, fixes and performance changes to
  CHANGELOG.md with git-cliff and the shared template (command `update`;
  needs full git history), or write a release's section of CHANGELOG.md to a
  notes file (command `notes`).
inputs:
  path:
    description: Directory of the program repo checkout
    default: .
  command:
    description: update or notes
    required: true
  version:
    description: Release version, X.Y.Z
    required: true
  long-name:
    description: Program long name, e.g. MODFLOW-USG; used in the changelog header and the notes title
    required: true
outputs:
  notes-file:
    description: Path of the notes file (command `notes`)
    value: ${{ steps.notes.outputs.file }}
runs:
  using: composite
  steps:
    - name: Setup Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        update-environment: false

    - name: Update CHANGELOG.md
      if: inputs.command == 'update'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        PYTHONPATH: ${{ github.action_path }}/../..
        VERSION: ${{ inputs.version }}
        LONG_NAME: ${{ inputs.long-name }}
        REPOSITORY: ${{ github.repository }}
      run: |
        "$PYTHON" -P -m modflow_devtools.release.changelog update --version "$VERSION" \
          --repository "$REPOSITORY" --long-name "$LONG_NAME"

    - name: Write release notes
      id: notes
      if: inputs.command == 'notes'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        PYTHONPATH: ${{ github.action_path }}/../..
        VERSION: ${{ inputs.version }}
        LONG_NAME: ${{ inputs.long-name }}
      run: |
        file="$RUNNER_TEMP/notes.md"
        "$PYTHON" -P -m modflow_devtools.release.changelog notes --version "$VERSION" \
          --long-name "$LONG_NAME" > "$file"
        cat "$file"
        echo "file=$file" >> "$GITHUB_OUTPUT"
