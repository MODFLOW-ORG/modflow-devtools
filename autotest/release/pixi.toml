[workspace]
name = "hello"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
version = "0.1.0.dev0"

[dependencies]
meson = ">=1.7.0"
ninja = "*"

[tasks]
setup = "meson setup --prefix=$PIXI_PROJECT_ROOT --bindir=bin"
build = "meson install -C"
test = "meson test --verbose --no-rebuild -C builddir"
