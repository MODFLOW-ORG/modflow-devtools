name: gwe-uze
schema_version: 2.0.0.dev1
advanced: true
multi: true
ftype: UZE
blocks:
  options:
    flow_package_name:
      block: options
      description: keyword to specify the name of the corresponding flow package.  If not specified, then
        the corresponding flow package must have the same name as this advanced transport package (the
        name associated with this package in the GWE name file).
      reader: urword
      optional: true
      mf6internal: flow_pkg_name
      longname: keyword to specify name of corresponding flow package
      type: string
    auxiliary:
      shape: (naux)
      block: options
      description: defines an array of one or more auxiliary variable names.  There is no limit on the
        number of auxiliary variables that can be provided on this line; however, lists of information
        provided in subsequent blocks must have a column of data for each auxiliary variable name defined
        here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
        cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
        variables may not be used by the package, but they will be available for use by other parts of
        the program.  The program will terminate with an error if auxiliary variables are specified on
        more than one line in the options block.
      reader: urword
      optional: true
      longname: keyword to specify aux variables
      type: string
    flow_package_auxiliary_name:
      block: options
      description: keyword to specify the name of an auxiliary variable in the corresponding flow package.  If
        specified, then the simulated temperatures from this advanced transport package will be copied
        into the auxiliary variable specified with this name.  Note that the flow package must have an
        auxiliary variable with this name or the program will terminate with an error.  If the flows for
        this advanced transport package are read from a file, then this option will have no effect.
      reader: urword
      optional: true
      mf6internal: fp_aux_name
      longname: keyword to specify name of concentration auxiliary variable in flow package
      type: string
    boundnames:
      block: options
      description: keyword to indicate that boundary names may be provided with the list of unsaturated
        zone flow cells.
      reader: urword
      optional: true
      type: keyword
    print_input:
      block: options
      description: keyword to indicate that the list of unsaturated zone flow information will be written
        to the listing file immediately after it is read.
      reader: urword
      optional: true
      mf6internal: iprpak
      longname: print input to listing file
      type: keyword
    print_temperature:
      block: options
      description: keyword to indicate that the list of UZF cell {#2} will be printed to the listing file
        for every stress period in which 'TEMPERATURE PRINT' is specified in Output Control.  If there
        is no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last time
        step of each stress period.
      reader: urword
      optional: true
      mf6internal: iprconc
      longname: print calculated temperatures to listing file
      type: keyword
    print_flows:
      block: options
      description: keyword to indicate that the list of unsaturated zone flow rates will be printed to
        the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output
        Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates
        are printed for the last time step of each stress period.
      reader: urword
      optional: true
      mf6internal: iprflow
      longname: print calculated flows to listing file
      type: keyword
    save_flows:
      block: options
      description: keyword to indicate that unsaturated zone flow terms will be written to the file specified
        with 'BUDGET FILEOUT' in Output Control.
      reader: urword
      optional: true
      mf6internal: ipakcb
      longname: save UZE cell flows to budget file
      type: keyword
    temperature_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: temp_filerec
      type: record
      children:
        temperature:
          block: options
          description: keyword to specify that record corresponds to temperature.
          reader: urword
          optional: false
          longname: stage keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        tempfile:
          block: options
          description: name of the binary output file to write temperature information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budget_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: budfilerec
      type: record
      children:
        budget:
          block: options
          description: keyword to specify that record corresponds to the budget.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetfile:
          block: options
          description: name of the binary output file to write budget information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budgetcsv_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: budcsvfilerec
      type: record
      children:
        budgetcsv:
          block: options
          description: keyword to specify that record corresponds to the budget CSV.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetcsvfile:
          block: options
          description: name of the comma-separated value (CSV) output file to write budget summary information.  A
            budget summary record will be written to this file for each time step of the simulation.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    ts_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        ts6:
          block: options
          description: keyword to specify that record corresponds to a time-series file.
          reader: urword
          optional: false
          longname: head keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        ts6_filename:
          block: options
          description: defines a time-series file defining time series that can be used to assign time-varying
            values. See the 'Time-Variable Input' section for instructions on using the time-series capability.
          reader: urword
          optional: false
          longname: file name of time series information
          type: string
    obs_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        obs6:
          block: options
          description: keyword to specify that record corresponds to an observations file.
          reader: urword
          optional: false
          longname: obs keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        obs6_filename:
          block: options
          description: name of input file to define observations for the UZE package. See the 'Observation
            utility' section for instructions for preparing observation input files. Table {#2} lists
            observation type(s) supported by the UZE package.
          reader: urword
          optional: false
          longname: obs6 input filename
          type: string
    dev_nonexpanding_matrix:
      block: options
      description: keyword that solves the feature temperature with a general mixing equation and adds
        the result to the right-hand side of the GWE equations, instead of adding a row to the solution
        matrix for each feature.  This development option is not supported.
      reader: urword
      optional: true
      mf6internal: dev_nonexpanding
      longname: do not add rows to the solution matrix
      type: keyword
  packagedata:
    packagedata:
      shape: (nuzfcells)
      block: packagedata
      reader: urword
      type: list
      children:
        packagedata:
          shape: (nuzfcells)
          block: packagedata
          reader: urword
          type: record
          children:
            uzfno:
              block: packagedata
              description: integer value that defines the UZF cell number associated with the specified
                PACKAGEDATA data on the line. UZFNO must be greater than zero and less than or equal to
                NUZFCELLS. Unsaturated zone flow information must be specified for every UZF cell or the
                program will terminate with an error.  The program also will terminate with an error if
                information for a UZF cell is specified more than once.
              reader: urword
              longname: UZF cell number for this entry
              numeric_index: true
              mf6internal: packagedata_ifno
              type: integer
            strt:
              block: packagedata
              description: real value that defines the starting temperature for the unsaturated zone flow
                cell.
              reader: urword
              longname: starting UZF cell temperature
              type: double
            aux:
              shape: (naux)
              block: packagedata
              description: represents the values of the auxiliary variables for each unsaturated zone
                flow. The values of auxiliary variables must be present for each unsaturated zone flow.
                The values must be specified in the order of the auxiliary variables specified in the
                OPTIONS block.  If the package supports time series and the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              optional: true
              longname: auxiliary variables
              type: double
            boundname:
              block: packagedata
              description: name of the unsaturated zone flow cell.  BOUNDNAME is an ASCII character variable
                that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the
                entire name must be enclosed within single quotes.
              reader: urword
              optional: true
              longname: UZF cell name
              type: string
  period:
    uzfno:
      shape: (nper)
      block: period
      description: integer value that defines the UZF cell number associated with the specified PERIOD
        data on the line. UZFNO must be greater than zero and less than or equal to NUZFCELLS.
      mf6internal: ifno
      reader: urword
      longname: unsaturated zone flow cell number for this entry
      numeric_index: true
      type: integer
    uzesetting:
      shape: (nper)
      block: period
      description: 'line of information that is parsed into a keyword and values.  Keyword values that
        can be used to start the UZESETTING string include: STATUS, TEMPERATURE, INFILTRATION, UZET, and
        AUXILIARY.  These settings are used to assign the temperature associated with the corresponding
        flow terms.  Temperatures cannot be specified for all flow terms.'
      reader: urword
      type: union
      children:
        temperature:
          block: period
          description: real or character value that defines the temperature for the unsaturated zone flow
            cell. The specified TEMPERATURE is only applied if the unsaturated zone flow cell is a constant
            temperature cell. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          time_series: true
          reader: urword
          longname: unsaturated zone flow cell temperature
          type: double
        status:
          block: period
          description: keyword option to define UZF cell status.  STATUS can be ACTIVE, INACTIVE, or CONSTANT.
            By default, STATUS is ACTIVE, which means that temperature will be calculated for the UZF
            cell.  If a UZF cell is inactive, then there will be no energy fluxes into or out of the UZF
            cell and the inactive value will be written for the UZF cell temperature.  If a UZF cell is
            constant, then the temperature for the UZF cell will be fixed at the user specified value.
          reader: urword
          longname: unsaturated zone flow cell temperature status
          type: string
        infiltration:
          block: period
          description: real or character value that defines the temperature of the infiltration $(e.g.,:^{circ}C:or:^{circ}F)$
            for the UZF cell. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          reader: urword
          time_series: true
          longname: infiltration temperature
          type: double
        uzet:
          block: period
          description: real or character value that states what fraction of the simulated unsaturated
            zone evapotranspiration is associated with evaporation.  The evaporative losses from the unsaturated
            zone moisture content will have an evaporative cooling effect on the GWE cell from which the
            evaporation originated. If this value is larger than 1, then it will be reset to 1.  If the
            Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values
            can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          reader: urword
          time_series: true
          longname: unsaturated zone et temperature
          type: double
        auxiliaryrecord:
          block: period
          reader: urword
          type: record
          children:
            auxiliary:
              block: period
              description: keyword for specifying auxiliary variable.
              reader: urword
              mf6internal: period_auxiliary
              type: keyword
            auxname:
              block: period
              description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match
                one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does not
                match one of the auxiliary variable names defined in the OPTIONS block the data are ignored.
              reader: urword
              type: string
            auxval:
              block: period
              description: value for the auxiliary variable. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              longname: auxiliary variable value
              type: double
