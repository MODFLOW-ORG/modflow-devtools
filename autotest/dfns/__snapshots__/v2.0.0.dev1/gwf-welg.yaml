name: gwf-welg
schema_version: 2.0.0.dev1
advanced: false
multi: true
ftype: WELG
blocks:
  options:
    readarraygrid:
      block: options
      description: indicates that array-based grid input will be used for the well boundary package.  This
        keyword must be specified to use array-based grid input.  When READARRAYGRID is specified, values
        must be provided for every cell within a model grid, even those cells that have an IDOMAIN value
        less than one.  Values assigned to cells with IDOMAIN values less than one are not used and have
        no effect on simulation results. No data cells should contain the value DNODATA (3.0E+30).
      default: true
      reader: urword
      optional: false
      developmode: false
      longname: use array-based grid input
      type: keyword
    auxiliary:
      shape: (naux)
      block: options
      description: defines an array of one or more auxiliary variable names.  There is no limit on the
        number of auxiliary variables that can be provided on this line; however, lists of information
        provided in subsequent blocks must have a column of data for each auxiliary variable name defined
        here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
        cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
        variables may not be used by the package, but they will be available for use by other parts of
        the program.  The program will terminate with an error if auxiliary variables are specified on
        more than one line in the options block.
      reader: urword
      optional: true
      longname: keyword to specify aux variables
      type: string
    auxmultname:
      block: options
      description: name of auxiliary variable to be used as multiplier of well flow rate.
      reader: urword
      optional: true
      longname: name of auxiliary variable for multiplier
      type: string
    print_input:
      block: options
      description: keyword to indicate that the list of well information will be written to the listing
        file immediately after it is read.
      reader: urword
      optional: true
      longname: print input to listing file
      mf6internal: iprpak
      type: keyword
    print_flows:
      block: options
      description: keyword to indicate that the list of well flow rates will be printed to the listing
        file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If
        there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed
        for the last time step of each stress period.
      reader: urword
      optional: true
      longname: print calculated flows to listing file
      mf6internal: iprflow
      type: keyword
    save_flows:
      block: options
      description: keyword to indicate that well flow terms will be written to the file specified with
        'BUDGET FILEOUT' in Output Control.
      reader: urword
      optional: true
      longname: save well flows to budget file
      mf6internal: ipakcb
      type: keyword
    auto_flow_reduce:
      block: options
      description: keyword and real value that defines the fraction of the cell thickness used as an interval
        for smoothly adjusting negative pumping rates to 0 in cells with head values less than or equal
        to the bottom of the cell. Negative pumping rates are adjusted to 0 or a smaller negative value
        when the head in the cell is equal to or less than the calculated interval above the cell bottom.
        AUTO_FLOW_REDUCE is set to 0.1 if the specified value is less than or equal to zero. By default,
        negative pumping rates are not reduced during a simulation.  This AUTO_FLOW_REDUCE option only
        applies to wells in model cells that are marked as 'convertible' (ICELLTYPE /= 0) in the Node
        Property Flow (NPF) input file. Reduction in flow will not occur for wells in cells marked as
        confined (ICELLTYPE = 0).
      reader: urword
      optional: true
      longname: cell fractional thickness for reduced pumping
      mf6internal: flowred
      type: double
    afrcsv_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: afrcsv_rec
      type: record
      children:
        auto_flow_reduce_csv:
          block: options
          description: keyword to specify that record corresponds to the AUTO_FLOW_REDUCE output option
            in which a new record is written for each well and for each time step in which the user-requested
            extraction rate is reduced by the program.
          reader: urword
          optional: false
          longname: budget keyword
          mf6internal: afrcsv
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        afrcsvfile:
          block: options
          description: name of the comma-separated value (CSV) output file to write information about
            well extraction rates that have been reduced by the program.  Entries are only written if
            the extraction rates are reduced.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    flow_reduction_length:
      block: options
      description: keyword that indicates the AUTO_FLOW_REDUCE value is a length instead of a fraction
        of the cell thickness. A warning will be issued if the FLOW_REDUCTION_LENGTH option is specified
        but the AUTO_FLOW_REDUCE option is not specified in the options block. The program will terminate
        with an error if the FLOW_REDUCTION_LENGTH option is specified and the AUTO_FLOW_REDUCE value
        specified in the options block is less than or equal to zero.
      reader: urword
      optional: true
      longname: flow reduction length keyword
      mf6internal: iflowredlen
      type: keyword
    obs_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        obs6:
          block: options
          description: keyword to specify that record corresponds to an observations file.
          reader: urword
          optional: false
          longname: obs keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        obs6_filename:
          block: options
          description: name of input file to define observations for the WEL package. See the 'Observation
            utility' section for instructions for preparing observation input files. Table {#2} lists
            observation type(s) supported by the WEL package.
          reader: urword
          optional: false
          longname: obs6 input filename
          type: string
    mover:
      block: options
      description: keyword to indicate that this instance of the Well Package can be used with the Water
        Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within
        the package to store the available, provided, and received water.
      reader: urword
      optional: true
      type: keyword
    export_array_netcdf:
      block: options
      description: keyword that specifies input gridded arrays should be written to the model output NetCDF
        file with attributes that support using the generated file as a MODFLOW 6 simulation input.  This
        option only has an effect when an output model NetCDF file is configured and the simulation is
        run in VALIDATE mode, otherwise it is ignored.
      reader: urword
      optional: true
      mf6internal: export_nc
      longname: export array variables to netcdf output files.
      extended: true
      type: keyword
  dimensions:
    maxbound:
      block: dimensions
      description: integer value specifying the maximum number of wells cells that will be specified for
        use during any stress period.
      reader: urword
      optional: true
      longname: maximum number of wells in any stress period
      type: integer
  period:
    q:
      shape: (nper, nodes)
      block: period
      description: is the volumetric well rate. A positive value indicates recharge (injection) and a
        negative value indicates discharge (extraction).
      default: 3.e30
      reader: readarray
      layered: true
      netcdf: true
      longname: well rate
      type: double
    aux:
      shape: (nper, nodes)
      block: period
      description: is an array of values for auxiliary variable aux(iaux), where iaux is a value from
        1 to naux, and aux(iaux) must be listed as part of the auxiliary variables.  A separate array
        can be specified for each auxiliary variable.  If an array is not specified for an auxiliary variable,
        then it will retain its value from the most recently specified period block.  If an auxiliary
        variable array has never been specified, its value is zero.  If the value specified here for the
        auxiliary variable is the same as auxmultname, then the well rate array will be multiplied by
        this array.
      reader: readarray
      layered: true
      netcdf: true
      optional: true
      longname: well auxiliary variable iaux
      mf6internal: auxvar
      type: double
