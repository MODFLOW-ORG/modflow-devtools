name: chf-oc
schema_version: 2.0.0.dev1
advanced: false
multi: false
ftype: OC
blocks:
  options:
    budget_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: budfilerec
      type: record
      children:
        budget:
          block: options
          description: keyword to specify that record corresponds to the budget.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetfile:
          block: options
          description: name of the output file to write budget information. Data are written to this file
            only for time steps in which SAVE BUDGET is specified in a PERIOD block. If SAVE BUDGET is
            specified in a PERIOD block and this file is not specified, MODFLOW 6 will terminate with
            an error.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budgetcsv_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: budcsvfilerec
      type: record
      children:
        budgetcsv:
          block: options
          description: keyword to specify that record corresponds to the budget CSV.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetcsvfile:
          block: options
          description: name of the comma-separated value (CSV) output file to write budget summary information.
            If specified, a budget summary record will be written to this file for every time step of
            the simulation.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    qoutflow_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: qoutfilerec
      type: record
      children:
        qoutflow:
          block: options
          description: keyword to specify that record corresponds to qoutflow.
          reader: urword
          optional: false
          longname: qoutflow keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        qoutflowfile:
          block: options
          description: name of the output file to write conc information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    stage_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: stagefilerec
      type: record
      children:
        stage:
          block: options
          description: keyword to specify that record corresponds to stage.
          reader: urword
          optional: false
          longname: stage keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        stagefile:
          block: options
          description: name of the output file to write stage information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    qoutflowprintrecord:
      block: options
      reader: urword
      optional: true
      mf6internal: qoutprintrec
      type: record
      children:
        qoutflow:
          block: options
          description: keyword to specify that record corresponds to qoutflow.
          reader: urword
          optional: false
          longname: qoutflow keyword
          type: keyword
        print_format:
          block: options
          description: keyword to specify format for printing to the listing file.
          reader: urword
          optional: false
          longname: keyword to indicate that a print format follows
          type: keyword
  period:
    saverecord:
      shape: (nper)
      block: period
      reader: urword
      optional: true
      type: record
      children:
        save:
          block: period
          description: keyword to indicate that information will be saved this stress period.
          reader: urword
          optional: false
          longname: keyword to save
          type: keyword
        rtype:
          block: period
          description: type of information to save or print.  Can be BUDGET.
          reader: urword
          optional: false
          longname: record type
          type: string
        ocsetting:
          block: period
          description: specifies the steps for which the data will be saved.
          reader: urword
          type: union
          children:
            all:
              block: period
              description: keyword to indicate save for all time steps in period.
              reader: urword
              type: keyword
            first:
              block: period
              description: keyword to indicate save for first step in period. This keyword may be used
                in conjunction with other keywords to print or save results for multiple time steps.
              reader: urword
              type: keyword
            last:
              block: period
              description: keyword to indicate save for last step in period. This keyword may be used
                in conjunction with other keywords to print or save results for multiple time steps.
              reader: urword
              type: keyword
            frequency:
              block: period
              description: save at the specified time step frequency. This keyword may be used in conjunction
                with other keywords to print or save results for multiple time steps.
              reader: urword
              type: integer
            steps:
              shape: (<nstp)
              block: period
              description: save for each step specified in STEPS. This keyword may be used in conjunction
                with other keywords to print or save results for multiple time steps.
              reader: urword
              type: integer
    printrecord:
      shape: (nper)
      block: period
      reader: urword
      optional: true
      type: record
      children:
        print:
          block: period
          description: keyword to indicate that information will be printed this stress period.
          reader: urword
          optional: false
          longname: keyword to save
          type: keyword
        rtype:
          block: period
          description: type of information to save or print.  Can be BUDGET.
          reader: urword
          optional: false
          longname: record type
          type: string
        ocsetting:
          block: period
          description: specifies the steps for which the data will be saved.
          reader: urword
          type: union
          children:
            all:
              block: period
              description: keyword to indicate save for all time steps in period.
              reader: urword
              type: keyword
            first:
              block: period
              description: keyword to indicate save for first step in period. This keyword may be used
                in conjunction with other keywords to print or save results for multiple time steps.
              reader: urword
              type: keyword
            last:
              block: period
              description: keyword to indicate save for last step in period. This keyword may be used
                in conjunction with other keywords to print or save results for multiple time steps.
              reader: urword
              type: keyword
            frequency:
              block: period
              description: save at the specified time step frequency. This keyword may be used in conjunction
                with other keywords to print or save results for multiple time steps.
              reader: urword
              type: integer
            steps:
              shape: (<nstp)
              block: period
              description: save for each step specified in STEPS. This keyword may be used in conjunction
                with other keywords to print or save results for multiple time steps.
              reader: urword
              type: integer
