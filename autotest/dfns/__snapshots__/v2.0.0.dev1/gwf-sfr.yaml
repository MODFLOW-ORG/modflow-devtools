name: gwf-sfr
schema_version: 2.0.0.dev1
advanced: true
multi: true
ftype: SFR
subcomponents:
  - utl-sfrtab
blocks:
  options:
    storage:
      block: options
      description: keyword that activates storage contributions to the stream-flow routing package continuity
        equation.
      reader: urword
      optional: true
      longname: activate reach storage
      type: keyword
    ats_courant:
      block: options
      description: real number value that defines the target Courant number submitted by the SFR Package
        to the adaptive time stepping (ATS) package.  If ATS_COURANT is specified and the ATS Package
        is active, the SFR Package will compute the time step that achieves the target Courant number
        for the most constraining reach (the reach with the highest wave celerity-to-length ratio) and
        submit that time step to the ATS Package.  The STORAGE option must be active when ATS_COURANT
        is specified.  ATS_COURANT must be greater than zero.  A recommended baseline value is 1.0, which
        targets unit Courant number; values between 0.5 and 2.0 are generally acceptable for kinematic
        wave routing.
      reader: urword
      optional: true
      longname: target Courant number for adaptive time stepping
      type: double
    auxiliary:
      shape: (naux)
      block: options
      description: defines an array of one or more auxiliary variable names.  There is no limit on the
        number of auxiliary variables that can be provided on this line; however, lists of information
        provided in subsequent blocks must have a column of data for each auxiliary variable name defined
        here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
        cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
        variables may not be used by the package, but they will be available for use by other parts of
        the program.  The program will terminate with an error if auxiliary variables are specified on
        more than one line in the options block.
      reader: urword
      optional: true
      longname: keyword to specify aux variables
      type: string
    boundnames:
      block: options
      description: keyword to indicate that boundary names may be provided with the list of stream reach
        cells.
      reader: urword
      optional: true
      type: keyword
    print_input:
      block: options
      description: keyword to indicate that the list of stream reach information will be written to the
        listing file immediately after it is read.
      reader: urword
      optional: true
      longname: print input to listing file
      mf6internal: iprpak
      type: keyword
    print_stage:
      block: options
      description: keyword to indicate that the list of stream reach {#2} will be printed to the listing
        file for every stress period in which 'HEAD PRINT' is specified in Output Control.  If there is
        no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last time
        step of each stress period.
      reader: urword
      optional: true
      longname: print calculated stages to listing file
      type: keyword
    print_flows:
      block: options
      description: keyword to indicate that the list of stream reach flow rates will be printed to the
        listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output
        Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates
        are printed for the last time step of each stress period.
      reader: urword
      optional: true
      longname: print calculated flows to listing file
      mf6internal: iprflow
      type: keyword
    save_flows:
      block: options
      description: keyword to indicate that stream reach flow terms will be written to the file specified
        with 'BUDGET FILEOUT' in Output Control.
      reader: urword
      optional: true
      longname: save stream reach flows to budget file
      mf6internal: ipakcb
      type: keyword
    stage_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        stage:
          block: options
          description: keyword to specify that record corresponds to stage.
          mf6internal: options_stage
          reader: urword
          optional: false
          longname: stage keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        stagefile:
          block: options
          description: name of the binary output file to write stage information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budget_filerecord:
      block: options
      mf6internal: budfilerec
      reader: urword
      optional: true
      type: record
      children:
        budget:
          block: options
          description: keyword to specify that record corresponds to the budget.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetfile:
          block: options
          description: name of the binary output file to write budget information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budgetcsv_filerecord:
      block: options
      mf6internal: budcsvfilerec
      reader: urword
      optional: true
      type: record
      children:
        budgetcsv:
          block: options
          description: keyword to specify that record corresponds to the budget CSV.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetcsvfile:
          block: options
          description: name of the comma-separated value (CSV) output file to write budget summary information.  A
            budget summary record will be written to this file for each time step of the simulation.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    package_convergence_filerecord:
      block: options
      mf6internal: pkgconvfilerec
      reader: urword
      optional: true
      type: record
      children:
        package_convergence:
          block: options
          description: keyword to specify that record corresponds to the package convergence comma spaced
            values file.
          mf6internal: pkgconv
          reader: urword
          optional: false
          longname: package_convergence keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        package_convergence_filename:
          block: options
          description: name of the comma spaced values output file to write package convergence information.
          mf6internal: pkgconvfname
          reader: urword
          optional: false
          longname: file keyword
          type: string
    ts_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        ts6:
          block: options
          description: keyword to specify that record corresponds to a time-series file.
          reader: urword
          optional: false
          longname: head keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          mf6internal: options_filein
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        ts6_filename:
          block: options
          description: defines a time-series file defining time series that can be used to assign time-varying
            values. See the 'Time-Variable Input' section for instructions on using the time-series capability.
          reader: urword
          optional: false
          longname: file name of time series information
          type: string
    obs_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        obs6:
          block: options
          description: keyword to specify that record corresponds to an observations file.
          reader: urword
          optional: false
          longname: obs keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          mf6internal: options_filein
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        obs6_filename:
          block: options
          description: name of input file to define observations for the SFR package. See the 'Observation
            utility' section for instructions for preparing observation input files. Table {#2} lists
            observation type(s) supported by the SFR package.
          reader: urword
          optional: false
          longname: obs6 input filename
          type: string
    mover:
      block: options
      description: keyword to indicate that this instance of the SFR Package can be used with the Water
        Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within
        the package to store the available, provided, and received water.
      reader: urword
      optional: true
      type: keyword
    maximum_picard_iterations:
      block: options
      description: integer value that defines the maximum number of Streamflow Routing picard iterations
        allowed when solving for reach stages and flows as part of the GWF formulate step. Picard iterations
        are used to minimize differences in SFR package results between subsequent GWF picard (non-linear)
        iterations as a result of non-optimal reach numbering. If reaches are numbered in order, from
        upstream to downstream, MAXIMUM_PICARD_ITERATIONS can be set to 1 to reduce model run time. By
        default, MAXIMUM_PICARD_ITERATIONS is equal to 100.
      mf6internal: maxsfrpicard
      reader: urword
      optional: true
      longname: SFR picard iterations
      type: integer
    maximum_iterations:
      block: options
      description: integer value that defines the maximum number of Streamflow Routing Newton-Raphson
        iterations allowed for a reach. By default, MAXIMUM_ITERATIONS is equal to 100. MAXIMUM_ITERATIONS
        would only need to be increased from the default value if one or more reach in a simulation has
        a large water budget error.
      mf6internal: maxsfrit
      reader: urword
      optional: true
      longname: SFR Newton-Raphson iterations
      type: integer
    maximum_depth_change:
      block: options
      description: real value that defines the depth closure tolerance. By default, MAXIMUM_DEPTH_CHANGE
        is equal to $1 times 10^{-5}$. The MAXIMUM_STAGE_CHANGE would only need to be increased or decreased
        from the default value if the water budget error for one or more reach is too small or too large,
        respectively.
      mf6internal: dmaxchg
      reader: urword
      optional: true
      longname: depth closure tolerance
      type: double
    unit_conversion:
      block: options
      description: real value that is used to convert user-specified Manning's roughness coefficients
        from seconds per meters$^{1/3}$ to model length and time units. A constant of 1.486 is used for
        flow units of cubic feet per second, and a constant of 1.0 is used for units of cubic meters per
        second. The constant must be multiplied by 86,400 when using time units of days in the simulation.
      reader: urword
      optional: true
      deprecated: 6.4.2
      longname: conversion factor
      type: double
    length_conversion:
      block: options
      description: real value that is used to convert user-specified Manning's roughness coefficients
        from meters to model length units. LENGTH_CONVERSION should be set to 3.28081, 1.0, and 100.0
        when using length units (LENGTH_UNITS) of feet, meters, or centimeters in the simulation, respectively.
        LENGTH_CONVERSION does not need to be specified if LENGTH_UNITS are meters.
      mf6internal: lengthconv
      reader: urword
      optional: true
      longname: length conversion factor
      type: double
    time_conversion:
      block: options
      description: real value that is used to convert user-specified Manning's roughness coefficients
        from seconds to model time units. TIME_CONVERSION should be set to 1.0, 60.0, 3,600.0, 86,400.0,
        and 31,557,600.0 when using time units (TIME_UNITS) of seconds, minutes, hours, days, or years
        in the simulation, respectively. TIME_CONVERSION does not need to be specified if TIME_UNITS are
        seconds.
      reader: urword
      optional: true
      longname: time conversion factor
      type: double
    dev_storage_weight:
      block: options
      description: real number value that defines the time weighting factor used to calculate the change
        in channel storage. DEV_STORAGE_WEIGHT must have a value between 0.5 and 1. The default DEV_STORAGE_WEIGHT
        value is 1, which is fully implicit and is recommended for all practical applications.
      mf6internal: storage_weight
      reader: urword
      optional: true
      longname: reach storage time weighting
      type: double
    dev_no_check:
      block: options
      description: keyword that deactivates the checks of reach geometry relative to the model grid and
        of reach parameters for reasonable values.  This development option is not supported.
      mf6internal: icheck
      reader: urword
      optional: true
      longname: do not check reach geometry and parameters
      type: keyword
    dev_no_final_check:
      block: options
      description: keyword that deactivates the final convergence check of the change in stream flow routing
        stages and flows.  This development option is not supported.
      mf6internal: iconvchk
      reader: urword
      optional: true
      longname: do not perform final convergence check
      type: keyword
  dimensions:
    nreaches:
      block: dimensions
      description: integer value specifying the number of stream reaches.  There must be NREACHES entries
        in the PACKAGEDATA block.
      mf6internal: maxbound
      reader: urword
      optional: false
      longname: maximum number reaches
      type: integer
  packagedata:
    packagedata:
      shape: (nreaches)
      block: packagedata
      reader: urword
      type: list
      children:
        packagedata:
          shape: (nreaches)
          block: packagedata
          reader: urword
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (reach) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NREACHES. Reach information must be specified for every reach or the program will terminate
                with an error.  The program will also terminate with an error if information for a reach
                is specified more than once.
              mf6internal: packagedata_ifno
              reader: urword
              longname: reach number for this entry
              numeric_index: true
              type: integer
            cellid:
              shape: (ncelldim)
              block: packagedata
              description: is the cell identifier, and depends on the type of grid that is used for the
                simulation. For a structured grid that uses the DIS input file, CELLID is the layer, row,
                and column. For a grid that uses the DISV input file, CELLID is the layer and CELL2D number.
                If the model uses the unstructured discretization (DISU) input file, CELLID is the node
                number for the cell. For reaches that are not connected to an underlying GWF cell, a zero
                should be specified for each grid dimension. For example, for a DIS grid a CELLID of 0
                0 0 should be specified. Reach-aquifer flow is not calculated for unconnected reaches.
                The keyword NONE can be still be specified to identify unconnected reaches for backward
                compatibility with previous versions of MODFLOW 6 but eventually NONE will be deprecated
                and will cause MODFLOW 6 to terminate with an error.
              reader: urword
              longname: cell identifier
              type: integer
            rlen:
              block: packagedata
              description: real value that defines the reach length. RLEN must be greater than zero.
              reader: urword
              longname: reach length
              type: double
            rwid:
              block: packagedata
              description: real value that defines the reach width. RWID must be greater than zero.
              reader: urword
              longname: reach width
              type: double
            rgrd:
              block: packagedata
              description: real value that defines the stream gradient (slope) across the reach. RGRD
                must be greater than zero.
              reader: urword
              longname: stream gradient
              type: double
            rtp:
              block: packagedata
              description: real value that defines the top elevation of the streambed of a reach.
              reader: urword
              longname: reach streambed top elevation
              type: double
            rbth:
              block: packagedata
              description: real value that defines the thickness of the reach streambed. RBTH can be any
                value if the reach is not connected to an underlying GWF cell. Otherwise, RBTH must be
                greater than zero.
              reader: urword
              longname: streambed thickness
              type: double
            rhk:
              block: packagedata
              description: real or character value that defines the hydraulic conductivity of the reach
                streambed. RHK can be any positive value if the reach is not connected to an underlying
                GWF cell. Otherwise, RHK must be greater than zero. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              longname: reach bed hydraulic conductivity
              type: double
            man:
              block: packagedata
              description: real or character value that defines the Manning's roughness coefficient for
                the reach. MAN must be greater than zero.  If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              longname: Manning's roughness coefficient
              type: double
            ncon:
              block: packagedata
              description: integer value that defines the number of reaches connected to the reach.  If
                a value of zero is specified for NCON an entry for IFNO is still required in the subsequent
                CONNECTIONDATA block.
              reader: urword
              longname: number of connected reaches
              type: integer
            ustrf:
              block: packagedata
              description: real value that defines the fraction of upstream flow from each upstream reach
                that is applied as upstream inflow to the reach. The sum of all USTRF values for all reaches
                connected to the same upstream reach must be equal to one and USTRF must be greater than
                or equal to zero. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              reader: urword
              time_series: true
              longname: fraction of upstream flow
              type: double
            ndv:
              block: packagedata
              description: integer value that defines the number of downstream diversions for the reach.
              reader: urword
              longname: number of downstream reaches
              type: integer
            aux:
              shape: (naux)
              block: packagedata
              description: represents the values of the auxiliary variables for each stream reach. The
                values of auxiliary variables must be present for each stream reach. The values must be
                specified in the order of the auxiliary variables specified in the OPTIONS block.  If
                the package supports time series and the Options block includes a TIMESERIESFILE entry
                (see the 'Time-Variable Input' section), values can be obtained from a time series by
                entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              optional: true
              longname: auxiliary variables
              type: double
            boundname:
              block: packagedata
              description: name of the stream reach cell.  BOUNDNAME is an ASCII character variable that
                can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire
                name must be enclosed within single quotes.
              reader: urword
              optional: true
              longname: well name
              type: string
  crosssections:
    crosssections:
      block: crosssections
      optional: true
      reader: urword
      type: list
      children:
        crosssections:
          block: crosssections
          optional: true
          reader: urword
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (reach) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NREACHES. Reach information must be specified for every reach or the program will terminate
                with an error.  The program will also terminate with an error if information for a reach
                is specified more than once.
              mf6internal: packagedata_ifno
              reader: urword
              longname: reach number for this entry
              numeric_index: true
              type: integer
            tab6:
              block: crosssections
              description: keyword to specify that record corresponds to a cross-section table file.
              mf6internal: xs_tab6
              reader: urword
              optional: false
              longname: head keyword
              type: keyword
            filein:
              block: options
              description: keyword to specify that an input filename is expected next.
              mf6internal: options_filein
              reader: urword
              optional: false
              longname: file keyword
              type: keyword
            tab6_filename:
              block: crosssections
              description: character string that defines the path and filename for the file containing
                cross-section table data for the reach. The TAB6_FILENAME file includes the number of
                entries in the file and the station elevation data in terms of the fractional width and
                the reach depth. Instructions for creating the TAB6_FILENAME input file are provided in
                SFR Reach Cross-Section Table Input File section.
              mf6internal: sfrtab6_filename
              reader: urword
              optional: false
              longname: table file name
              type: string
  connectiondata:
    connectiondata:
      shape: (nreaches)
      block: connectiondata
      reader: urword
      type: list
      children:
        connectiondata:
          shape: (nreaches)
          block: connectiondata
          reader: urword
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (reach) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NREACHES. Reach information must be specified for every reach or the program will terminate
                with an error.  The program will also terminate with an error if information for a reach
                is specified more than once.
              mf6internal: packagedata_ifno
              reader: urword
              longname: reach number for this entry
              numeric_index: true
              type: integer
            ic:
              shape: (ncon(ifno))
              block: connectiondata
              description: integer value that defines the reach number of the reach connected to the current
                reach and whether it is connected to the upstream or downstream end of the reach. Negative
                IC numbers indicate connected reaches are connected to the downstream end of the current
                reach. Positive IC numbers indicate connected reaches are connected to the upstream end
                of the current reach. The absolute value of IC must be greater than zero and less than
                or equal to NREACHES. IC should not be specified when NCON is zero but must be specified
                otherwise.
              reader: urword
              optional: true
              longname: connected reach numbers
              numeric_index: true
              support_negative_index: true
              type: integer
  diversions:
    diversions:
      block: diversions
      optional: true
      reader: urword
      type: list
      children:
        diversions:
          block: diversions
          optional: true
          reader: urword
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (reach) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NREACHES. Reach information must be specified for every reach or the program will terminate
                with an error.  The program will also terminate with an error if information for a reach
                is specified more than once.
              mf6internal: packagedata_ifno
              reader: urword
              longname: reach number for this entry
              numeric_index: true
              type: integer
            idv:
              block: diversions
              description: integer value that defines the downstream diversion number for the diversion
                for reach IFNO. IDV must be greater than zero and less than or equal to NDV for reach
                IFNO.
              mf6internal: diversions_idv
              reader: urword
              longname: downstream diversion number
              numeric_index: true
              type: integer
            iconr:
              block: diversions
              description: integer value that defines the downstream reach that will receive the diverted
                water. IDV must be greater than zero and less than or equal to NREACHES. Furthermore,
                reach  ICONR must be a downstream connection for reach IFNO.
              reader: urword
              longname: downstream reach number for diversion
              numeric_index: true
              type: integer
            cprior:
              block: diversions
              description: 'character string value that defines the the prioritization system for the
                diversion, such as when insufficient water is available to meet all diversion stipulations,
                and is used in conjunction with the value of FLOW value specified in the STRESS_PERIOD_DATA
                section. Available diversion options include:  (1) CPRIOR = `FRACTION'', then the amount
                of the diversion is computed as a fraction of the streamflow leaving reach IFNO ($Q_{DS}$);
                in this case, 0.0 $le$ DIVFLOW $le$ 1.0.  (2) CPRIOR = `EXCESS'', a diversion is made
                only if $Q_{DS}$ for reach IFNO exceeds the value of DIVFLOW. If this occurs, then the
                quantity of water diverted is the excess flow ($Q_{DS} -$ DIVFLOW) and $Q_{DS}$ from reach
                IFNO is set equal to DIVFLOW. This represents a flood-control type of diversion, as described
                by Danskin and Hanson (2002). (3) CPRIOR = `THRESHOLD'', then if $Q_{DS}$ in reach IFNO
                is less than the specified diversion flow DIVFLOW, no water is diverted from reach IFNO.
                If $Q_{DS}$ in reach IFNO is greater than or equal to DIVFLOW, DIVFLOW is diverted and
                $Q_{DS}$ is set to the remainder ($Q_{DS} -$ DIVFLOW)). This approach assumes that once
                flow in the stream is sufficiently low, diversions from the stream cease, and is the `priority''
                algorithm that originally was programmed into the STR1 Package (Prudic, 1989).  (4) CPRIOR
                = `UPTO'' -- if $Q_{DS}$ in reach IFNO is greater than or equal to the specified diversion
                flow DIVFLOW, $Q_{DS}$ is reduced by DIVFLOW. If $Q_{DS}$ in reach IFNO is less than DIVFLOW,
                DIVFLOW is set to $Q_{DS}$ and there will be no flow available for reaches connected to
                downstream end of reach IFNO.'
              reader: urword
              longname: iprior code
              type: string
  initialstages:
    initialstages:
      shape: (nreaches)
      block: initialstages
      optional: true
      reader: urword
      type: list
      children:
        initialstages:
          shape: (nreaches)
          block: initialstages
          optional: true
          reader: urword
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (reach) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NREACHES. Reach information must be specified for every reach or the program will terminate
                with an error.  The program will also terminate with an error if information for a reach
                is specified more than once.
              mf6internal: packagedata_ifno
              reader: urword
              longname: reach number for this entry
              numeric_index: true
              type: integer
            initialstage:
              block: initialstages
              description: real value that defines the initial stage for the reach. The program will terminate
                with an error if INITIALSTAGE is less than the RTP value for reach IFNO defined in the
                PACKAGEDATA block.  INITIALSTAGE data are used only if STORAGE is specified in the Options
                block and the first stress period is transient or for reaches defined to use the SIMPLE
                STATUS in the Period block.
              optional: false
              reader: urword
              longname: initial reach stage
              type: double
  period:
    ifno:
      shape: (nper)
      block: period
      description: integer value that defines the feature (reach) number associated with the specified
        PERIOD data on the line. IFNO must be greater than zero and less than or equal to NREACHES.
      reader: urword
      longname: reach number for this entry
      numeric_index: true
      type: integer
    sfrsetting:
      shape: (nper)
      block: period
      description: 'line of information that is parsed into a keyword and values.  Keyword values that
        can be used to start the SFRSETTING string include: STATUS, BEDK, MANNING, STAGE, INFLOW, RAINFALL,
        EVAPORATION, RUNOFF, DIVERSION, UPSTREAM_FRACTION, and AUXILIARY.'
      reader: urword
      type: union
      children:
        stage:
          block: period
          description: real or character value that defines the stage for the reach. The specified STAGE
            is only applied if the reach uses the simple routing option. If STAGE is not specified for
            reaches that use the simple routing option, the specified stage is set to the top of the reach.
            If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          reader: urword
          time_series: true
          longname: reach stage
          type: double
        status:
          block: period
          description: keyword option to define stream reach status.  STATUS can be ACTIVE, INACTIVE,
            or SIMPLE. The SIMPLE STATUS option simulates streamflow using a user-specified stage for
            a reach or a stage set to the top of the reach (depth = 0). In cases where the simulated leakage
            calculated using the specified stage exceeds the sum of inflows to the reach, the stage is
            set to the top of the reach and leakage is set equal to the sum of inflows. Upstream fractions
            should be changed using the UPSTREAM_FRACTION SFRSETTING if the status for one or more reaches
            is changed to ACTIVE or INACTIVE. For example, if one of two downstream connections for a
            reach is inactivated, the upstream fraction for the active and inactive downstream reach should
            be changed to 1.0 and 0.0, respectively, to ensure that the active reach receives all of the
            downstream outflow from the upstream reach. By default, STATUS is ACTIVE.
          reader: urword
          longname: reach status
          type: string
        bedk:
          block: period
          description: real or character value that defines the hydraulic conductivity of the reach streambed.
            BEDK can be any positive value if the reach is not connected to an underlying GWF cell. Otherwise,
            BEDK must be greater than zero. If the Options block includes a TIMESERIESFILE entry (see
            the 'Time-Variable Input' section), values can be obtained from a time series by entering
            the time-series name in place of a numeric value.
          reader: urword
          time_series: true
          longname: reach bed hydraulic conductivity
          type: double
        manning:
          block: period
          description: real or character value that defines the Manning's roughness coefficient for the
            reach. MANNING must be greater than zero.  If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          reader: urword
          time_series: true
          longname: reach Manning's roughness coefficient
          type: double
        inflow:
          block: period
          description: real or character value that defines the volumetric inflow rate for the streamflow
            routing reach. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value. By default, inflow rates are zero for each reach.
          reader: urword
          time_series: true
          longname: inflow rate
          type: double
        rainfall:
          block: period
          description: real or character value that defines the  volumetric rate per unit area of water
            added by precipitation directly on the streamflow routing reach. If the Options block includes
            a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from
            a time series by entering the time-series name in place of a numeric value. By default, rainfall  rates
            are zero for each reach.
          reader: urword
          time_series: true
          longname: rainfall rate
          type: double
        evaporation:
          block: period
          description: real or character value that defines the volumetric rate per unit area of water
            subtracted by evaporation from the streamflow routing reach. A positive evaporation rate should
            be provided. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value. If the volumetric evaporation rate for a reach exceeds the sources
            of water to the reach (upstream and specified inflows, rainfall, and runoff but excluding
            groundwater leakage into the reach) the volumetric evaporation rate is limited to the sources
            of water to the reach. By default, evaporation rates are zero for each reach.
          reader: urword
          time_series: true
          longname: evaporation rate
          type: double
        runoff:
          block: period
          description: real or character value that defines the volumetric rate of diffuse overland runoff
            that enters the streamflow routing reach. If the Options block includes a TIMESERIESFILE entry
            (see the 'Time-Variable Input' section), values can be obtained from a time series by entering
            the time-series name in place of a numeric value. If the volumetric runoff rate for a reach
            is negative and exceeds inflows to the reach (upstream and specified inflows, and rainfall
            but excluding groundwater leakage into the reach) the volumetric runoff rate is limited to
            inflows to the reach and the volumetric evaporation rate for the reach is set to zero. By
            default, runoff rates are zero for each reach.
          reader: urword
          time_series: true
          longname: runoff rate
          type: double
        diversionrecord:
          block: period
          reader: urword
          type: record
          children:
            diversion:
              block: period
              description: keyword to indicate diversion record.
              reader: urword
              longname: diversion keyword
              type: keyword
            idv:
              block: diversions
              description: integer value that defines the downstream diversion number for the diversion
                for reach IFNO. IDV must be greater than zero and less than or equal to NDV for reach
                IFNO.
              mf6internal: diversions_idv
              reader: urword
              longname: downstream diversion number
              numeric_index: true
              type: integer
            divflow:
              block: period
              description: real or character value that defines the volumetric diversion (DIVFLOW) rate
                for the streamflow routing reach. If the Options block includes a TIMESERIESFILE entry
                (see the 'Time-Variable Input' section), values can be obtained from a time series by
                entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              longname: volumetric diversion flow rate
              type: double
        upstream_fraction:
          block: period
          description: real value that defines the fraction of upstream flow (USTRF) from each upstream
            reach that is applied as upstream inflow to the reach. The sum of all USTRF values for all
            reaches connected to the same upstream reach must be equal to one.
          mf6internal: upstream_frac
          reader: urword
          time_series: true
          longname: fraction of upstream flow
          type: double
        cross_sectionrecord:
          block: period
          mf6internal: xsectionrecord
          reader: urword
          type: record
          children:
            cross_section:
              block: period
              description: keyword to specify that record corresponds to a reach cross-section.
              reader: urword
              optional: false
              longname: cross_section keyword
              type: keyword
            tab6:
              block: crosssections
              description: keyword to specify that record corresponds to a cross-section table file.
              mf6internal: xs_tab6
              reader: urword
              optional: false
              longname: head keyword
              type: keyword
            filein:
              block: options
              description: keyword to specify that an input filename is expected next.
              mf6internal: options_filein
              reader: urword
              optional: false
              longname: file keyword
              type: keyword
            tab6_filename:
              block: crosssections
              description: character string that defines the path and filename for the file containing
                cross-section table data for the reach. The TAB6_FILENAME file includes the number of
                entries in the file and the station elevation data in terms of the fractional width and
                the reach depth. Instructions for creating the TAB6_FILENAME input file are provided in
                SFR Reach Cross-Section Table Input File section.
              mf6internal: sfrtab6_filename
              reader: urword
              optional: false
              longname: table file name
              type: string
        auxiliaryrecord:
          block: period
          reader: urword
          type: record
          children:
            auxiliary:
              block: period
              description: keyword for specifying auxiliary variable.
              mf6internal: period_auxiliary
              reader: urword
              type: keyword
            auxname:
              block: period
              description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match
                one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does not
                match one of the auxiliary variable names defined in the OPTIONS block the data are ignored.
              reader: urword
              type: string
            auxval:
              block: period
              description: value for the auxiliary variable.  If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              longname: auxiliary variable value
              type: double
