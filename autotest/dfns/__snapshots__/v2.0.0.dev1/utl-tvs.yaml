name: utl-tvs
schema_version: 2.0.0.dev1
parent: parent_package
advanced: false
multi: false
ftype: TVS
blocks:
  options:
    disable_storage_change_integration:
      block: options
      description: keyword that deactivates inclusion of storage derivative terms in the STO package matrix
        formulation.  In the absence of this keyword (the default), the groundwater storage formulation
        will be modified to correctly adjust heads based on transient variations in stored water volumes
        arising from changes to SS and SY properties.
      mf6internal: disable_sc_int
      reader: urword
      optional: true
      longname: deactivate storage change integration
      type: keyword
    print_input:
      block: options
      description: keyword to indicate that information for each change to a storage property in a cell
        will be written to the model listing file.
      reader: urword
      optional: true
      longname: print input to listing file
      type: keyword
    ts_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        ts6:
          block: options
          description: keyword to specify that record corresponds to a time-series file.
          reader: urword
          optional: false
          longname: head keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        ts6_filename:
          block: options
          description: defines a time-series file defining time series that can be used to assign time-varying
            values. See the 'Time-Variable Input' section for instructions on using the time-series capability.
          reader: urword
          optional: false
          longname: file name of time series information
          type: string
  period:
    tvssetting:
      shape: (nper, nnodes)
      block: period
      description: 'line of information that is parsed into a property name keyword and values.  Property
        name keywords that can be used to start the TVSSETTING string include: SS and SY.'
      reader: urword
      type: union
      children:
        ss:
          block: period
          description: is the new value to be assigned as the cell's specific storage (or storage coefficient
            if the STORAGECOEFFICIENT STO package option is specified) from the start of the specified
            stress period, as per SS in the STO package.  Specific storage values must be greater than
            or equal to 0.  If the OPTIONS block includes a TS6 entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          reader: urword
          time_series: true
          longname: specific storage
          type: double
        sy:
          block: period
          description: is the new value to be assigned as the cell's specific yield from the start of
            the specified stress period, as per SY in the STO package.  Specific yield values must be
            greater than or equal to 0.  If the OPTIONS block includes a TS6 entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          reader: urword
          time_series: true
          longname: specific yield
          type: double
