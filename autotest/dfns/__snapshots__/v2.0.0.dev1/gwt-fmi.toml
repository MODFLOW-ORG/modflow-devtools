name = "gwt-fmi"
schema_version = "2.0.0.dev1"
advanced = false
multi = false
ftype = "FMI"

[blocks.options.save_flows]
block = "options"
description = "keyword to indicate that FMI flow terms will be written to the file specified with 'BUDGET FILEOUT' in Output Control."
reader = "urword"
optional = true
longname = "save calculated flow imbalance correction to budget file"
type = "keyword"

[blocks.options.flow_imbalance_correction]
block = "options"
description = "correct for an imbalance in flows by assuming that any residual flow error comes in or leaves at the concentration of the cell.  When this option is activated, the GWT Model budget written to the listing file will contain two additional entries: FLOW-ERROR and FLOW-CORRECTION.  These two entries will be equal but opposite in sign.  The FLOW-CORRECTION term is a mass flow that is added to offset the error caused by an imprecise flow balance.  If these terms are not relatively small, the flow model should be rerun with stricter convergence tolerances."
reader = "urword"
optional = true
mf6internal = "imbalancecorrect"
longname = "correct for flow imbalance"
type = "keyword"

[blocks.packagedata.packagedata]
block = "packagedata"
reader = "urword"
optional = true
longname = "flowtype list"
type = "list"

[blocks.packagedata.packagedata.children.packagedata]
block = "packagedata"
reader = "urword"
optional = true
longname = "flowtype list"
type = "record"

[blocks.packagedata.packagedata.children.packagedata.children.flowtype]
block = "packagedata"
description = "is the word GWFBUDGET, GWFHEAD, GWFGRID, GWFMOVER or the name of an advanced GWF stress package.  If GWFBUDGET is specified, then the corresponding file must be a budget file. If GWFHEAD is specified, the file must be a head file.  If GWFGRID is specified, the file must be a binary grid file.  If an advanced GWF stress package name appears then the corresponding file must be the budget file saved by a LAK, SFR, MAW or UZF Package."
reader = "urword"
longname = "flow type"
type = "string"

[blocks.packagedata.packagedata.children.packagedata.children.filein]
block = "packagedata"
description = "keyword to specify that an input filename is expected next."
reader = "urword"
optional = false
longname = "file keyword"
type = "keyword"

[blocks.packagedata.packagedata.children.packagedata.children.fname]
block = "packagedata"
description = "is the name of the file containing flows.  The path to the file should be included if the file is not located in the folder where the program was run."
reader = "urword"
longname = "file name"
type = "string"
