name: gwt-sft
schema_version: 2.0.0.dev1
advanced: true
multi: true
ftype: SFT
blocks:
  options:
    flow_package_name:
      block: options
      description: keyword to specify the name of the corresponding flow package.  If not specified, then
        the corresponding flow package must have the same name as this advanced transport package (the
        name associated with this package in the GWT name file).
      reader: urword
      optional: true
      mf6internal: flow_pkg_name
      longname: keyword to specify name of corresponding flow package
      type: string
    auxiliary:
      shape: (naux)
      block: options
      description: defines an array of one or more auxiliary variable names.  There is no limit on the
        number of auxiliary variables that can be provided on this line; however, lists of information
        provided in subsequent blocks must have a column of data for each auxiliary variable name defined
        here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
        cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
        variables may not be used by the package, but they will be available for use by other parts of
        the program.  The program will terminate with an error if auxiliary variables are specified on
        more than one line in the options block.
      reader: urword
      optional: true
      longname: keyword to specify aux variables
      type: string
    flow_package_auxiliary_name:
      block: options
      description: keyword to specify the name of an auxiliary variable in the corresponding flow package.  If
        specified, then the simulated concentrations from this advanced transport package will be copied
        into the auxiliary variable specified with this name.  Note that the flow package must have an
        auxiliary variable with this name or the program will terminate with an error.  If the flows for
        this advanced transport package are read from a file, then this option will have no effect.
      reader: urword
      optional: true
      mf6internal: fp_aux_name
      longname: keyword to specify name of concentration auxiliary variable in flow package
      type: string
    boundnames:
      block: options
      description: keyword to indicate that boundary names may be provided with the list of reach cells.
      reader: urword
      optional: true
      type: keyword
    print_input:
      block: options
      description: keyword to indicate that the list of reach information will be written to the listing
        file immediately after it is read.
      reader: urword
      optional: true
      mf6internal: iprpak
      longname: print input to listing file
      type: keyword
    print_concentration:
      block: options
      description: keyword to indicate that the list of reach {#2} will be printed to the listing file
        for every stress period in which 'CONCENTRATION PRINT' is specified in Output Control.  If there
        is no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last time
        step of each stress period.
      reader: urword
      optional: true
      mf6internal: iprconc
      longname: print calculated concentrations to listing file
      type: keyword
    print_flows:
      block: options
      description: keyword to indicate that the list of reach flow rates will be printed to the listing
        file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If
        there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed
        for the last time step of each stress period.
      reader: urword
      optional: true
      mf6internal: iprflow
      longname: print calculated flows to listing file
      type: keyword
    save_flows:
      block: options
      description: keyword to indicate that reach flow terms will be written to the file specified with
        'BUDGET FILEOUT' in Output Control.
      reader: urword
      optional: true
      mf6internal: ipakcb
      longname: save reach flows to budget file
      type: keyword
    concentration_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: conc_filerec
      type: record
      children:
        concentration:
          block: options
          description: keyword to specify that record corresponds to concentration.
          reader: urword
          optional: false
          longname: concentration keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        concfile:
          block: options
          description: name of the binary output file to write concentration information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budget_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: budfilerec
      type: record
      children:
        budget:
          block: options
          description: keyword to specify that record corresponds to the budget.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetfile:
          block: options
          description: name of the binary output file to write budget information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budgetcsv_filerecord:
      block: options
      reader: urword
      optional: true
      mf6internal: budcsvfilerec
      type: record
      children:
        budgetcsv:
          block: options
          description: keyword to specify that record corresponds to the budget CSV.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetcsvfile:
          block: options
          description: name of the comma-separated value (CSV) output file to write budget summary information.  A
            budget summary record will be written to this file for each time step of the simulation.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    ts_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        ts6:
          block: options
          description: keyword to specify that record corresponds to a time-series file.
          reader: urword
          optional: false
          longname: head keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        ts6_filename:
          block: options
          description: defines a time-series file defining time series that can be used to assign time-varying
            values. See the 'Time-Variable Input' section for instructions on using the time-series capability.
          reader: urword
          optional: false
          longname: file name of time series information
          type: string
    obs_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        obs6:
          block: options
          description: keyword to specify that record corresponds to an observations file.
          reader: urword
          optional: false
          longname: obs keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        obs6_filename:
          block: options
          description: name of input file to define observations for the SFT package. See the 'Observation
            utility' section for instructions for preparing observation input files. Table {#2} lists
            observation type(s) supported by the SFT package.
          reader: urword
          optional: false
          longname: obs6 input filename
          type: string
    dev_nonexpanding_matrix:
      block: options
      description: keyword that solves the feature concentration with a general mixing equation and adds
        the result to the right-hand side of the GWT equations, instead of adding a row to the solution
        matrix for each feature.  This development option is not supported.
      reader: urword
      optional: true
      mf6internal: dev_nonexpanding
      longname: do not add rows to the solution matrix
      type: keyword
  packagedata:
    packagedata:
      shape: (nreaches)
      block: packagedata
      reader: urword
      type: list
      children:
        packagedata:
          shape: (nreaches)
          block: packagedata
          reader: urword
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (reach) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NREACHES. Reach information must be specified for every reach or the program will terminate
                with an error.  The program will also terminate with an error if information for a reach
                is specified more than once.
              reader: urword
              longname: reach number for this entry
              numeric_index: true
              mf6internal: packagedata_ifno
              type: integer
            strt:
              block: packagedata
              description: real value that defines the starting concentration for the reach.
              reader: urword
              longname: starting reach concentration
              type: double
            aux:
              shape: (naux)
              block: packagedata
              description: represents the values of the auxiliary variables for each reach. The values
                of auxiliary variables must be present for each reach. The values must be specified in
                the order of the auxiliary variables specified in the OPTIONS block.  If the package supports
                time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              reader: urword
              time_series: true
              optional: true
              longname: auxiliary variables
              type: double
            boundname:
              block: packagedata
              description: name of the reach cell.  BOUNDNAME is an ASCII character variable that can
                contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire
                name must be enclosed within single quotes.
              reader: urword
              optional: true
              longname: well name
              type: string
  period:
    ifno:
      shape: (nper)
      block: period
      description: integer value that defines the feature (reach) number associated with the specified
        PERIOD data on the line. IFNO must be greater than zero and less than or equal to NREACHES.
      reader: urword
      longname: reach number for this entry
      numeric_index: true
      type: integer
    reachsetting:
      shape: (nper)
      block: period
      description: 'line of information that is parsed into a keyword and values.  Keyword values that
        can be used to start the REACHSETTING string include: STATUS, CONCENTRATION, RAINFALL, EVAPORATION,
        RUNOFF, and AUXILIARY.  These settings are used to assign the concentration of associated with
        the corresponding flow terms.  Concentrations cannot be specified for all flow terms.  For example,
        the Streamflow Package supports a ''DIVERSION'' flow term.  Diversion water will be routed using
        the calculated concentration of the reach.'
      reader: urword
      type: union
      children:
        concentration:
          block: period
          description: real or character value that defines the concentration for the reach. The specified
            CONCENTRATION is only applied if the reach is a constant concentration reach. If the Options
            block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can
            be obtained from a time series by entering the time-series name in place of a numeric value.
          time_series: true
          reader: urword
          longname: reach concentration
          type: double
        status:
          block: period
          description: keyword option to define reach status.  STATUS can be ACTIVE, INACTIVE, or CONSTANT.
            By default, STATUS is ACTIVE, which means that concentration will be calculated for the reach.  If
            a reach is inactive, then there will be no solute mass fluxes into or out of the reach and
            the inactive value will be written for the reach concentration.  If a reach is constant, then
            the concentration for the reach will be fixed at the user specified value.
          reader: urword
          longname: reach concentration status
          type: string
        rainfall:
          block: period
          description: real or character value that defines the rainfall solute concentration $(ML^{-3})$
            for the reach. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          reader: urword
          time_series: true
          longname: rainfall concentration
          type: double
        evaporation:
          block: period
          description: real or character value that defines the concentration of evaporated water $(ML^{-3})$
            for the reach. If this concentration value is larger than the simulated concentration in the
            reach, then the evaporated water will be removed at the same concentration as the reach.  If
            the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          reader: urword
          time_series: true
          longname: evaporation concentration
          type: double
        runoff:
          block: period
          description: real or character value that defines the concentration of runoff $(ML^{-3})$ for
            the reach. Value must be greater than or equal to zero. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          reader: urword
          time_series: true
          longname: runoff concentration
          type: double
        inflow:
          block: period
          description: real or character value that defines the concentration of inflow $(ML^{-3})$ for
            the reach. Value must be greater than or equal to zero. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          reader: urword
          time_series: true
          longname: inflow concentration
          type: double
        auxiliaryrecord:
          block: period
          reader: urword
          type: record
          children:
            auxiliary:
              block: period
              description: keyword for specifying auxiliary variable.
              reader: urword
              mf6internal: period_auxiliary
              type: keyword
            auxname:
              block: period
              description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match
                one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does not
                match one of the auxiliary variable names defined in the OPTIONS block the data are ignored.
              reader: urword
              type: string
            auxval:
              block: period
              description: value for the auxiliary variable. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              longname: auxiliary variable value
              type: double
