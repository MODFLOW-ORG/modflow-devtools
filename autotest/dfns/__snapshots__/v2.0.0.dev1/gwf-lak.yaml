name: gwf-lak
schema_version: 2.0.0.dev1
advanced: true
multi: true
ftype: LAK
subcomponents:
  - utl-laktab
blocks:
  options:
    auxiliary:
      shape: (naux)
      block: options
      description: defines an array of one or more auxiliary variable names.  There is no limit on the
        number of auxiliary variables that can be provided on this line; however, lists of information
        provided in subsequent blocks must have a column of data for each auxiliary variable name defined
        here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
        cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
        variables may not be used by the package, but they will be available for use by other parts of
        the program.  The program will terminate with an error if auxiliary variables are specified on
        more than one line in the options block.
      reader: urword
      optional: true
      longname: keyword to specify aux variables
      type: string
    boundnames:
      block: options
      description: keyword to indicate that boundary names may be provided with the list of lake cells.
      reader: urword
      optional: true
      type: keyword
    print_input:
      block: options
      description: keyword to indicate that the list of lake information will be written to the listing
        file immediately after it is read.
      reader: urword
      optional: true
      longname: print input to listing file
      mf6internal: iprpak
      type: keyword
    print_stage:
      block: options
      description: keyword to indicate that the list of lake {#2} will be printed to the listing file
        for every stress period in which 'HEAD PRINT' is specified in Output Control.  If there is no
        Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last time step
        of each stress period.
      reader: urword
      optional: true
      longname: print calculated stages to listing file
      type: keyword
    print_flows:
      block: options
      description: keyword to indicate that the list of lake flow rates will be printed to the listing
        file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If
        there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed
        for the last time step of each stress period.
      reader: urword
      optional: true
      longname: print calculated flows to listing file
      mf6internal: iprflow
      type: keyword
    save_flows:
      block: options
      description: keyword to indicate that lake flow terms will be written to the file specified with
        'BUDGET FILEOUT' in Output Control.
      reader: urword
      optional: true
      longname: save lake flows to budget file
      mf6internal: ipakcb
      type: keyword
    stage_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        stage:
          block: options
          description: keyword to specify that record corresponds to stage.
          mf6internal: options_stage
          reader: urword
          optional: false
          longname: stage keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        stagefile:
          block: options
          description: name of the binary output file to write stage information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budget_filerecord:
      block: options
      mf6internal: budfilerec
      reader: urword
      optional: true
      type: record
      children:
        budget:
          block: options
          description: keyword to specify that record corresponds to the budget.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetfile:
          block: options
          description: name of the binary output file to write budget information.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    budgetcsv_filerecord:
      block: options
      mf6internal: budcsvfilerec
      reader: urword
      optional: true
      type: record
      children:
        budgetcsv:
          block: options
          description: keyword to specify that record corresponds to the budget CSV.
          reader: urword
          optional: false
          longname: budget keyword
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        budgetcsvfile:
          block: options
          description: name of the comma-separated value (CSV) output file to write budget summary information.  A
            budget summary record will be written to this file for each time step of the simulation.
          reader: urword
          optional: false
          longname: file keyword
          type: string
    package_convergence_filerecord:
      block: options
      mf6internal: pkgconvfilerec
      reader: urword
      optional: true
      type: record
      children:
        package_convergence:
          block: options
          description: keyword to specify that record corresponds to the package convergence comma spaced
            values file. A warning message will be issued if package convergence data is requested but
            the IMPLICIT option is specified. In that case the lake stage is included in the Iterative
            Model Solution (IMS) convergence check and the package convergence file is not written.
          reader: urword
          optional: false
          longname: package_convergence keyword
          mf6internal: pkgconv
          type: keyword
        fileout:
          block: options
          description: keyword to specify that an output filename is expected next.
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        package_convergence_filename:
          block: options
          description: name of the comma spaced values output file to write package convergence information.
          reader: urword
          optional: false
          longname: file keyword
          mf6internal: pkgconvfname
          type: string
    ts_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        ts6:
          block: options
          description: keyword to specify that record corresponds to a time-series file.
          reader: urword
          optional: false
          longname: head keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          mf6internal: options_filein
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        ts6_filename:
          block: options
          description: defines a time-series file defining time series that can be used to assign time-varying
            values. See the 'Time-Variable Input' section for instructions on using the time-series capability.
          reader: urword
          optional: false
          longname: file name of time series information
          type: string
    obs_filerecord:
      block: options
      reader: urword
      optional: true
      type: record
      children:
        obs6:
          block: options
          description: keyword to specify that record corresponds to an observations file.
          reader: urword
          optional: false
          longname: obs keyword
          type: keyword
        filein:
          block: options
          description: keyword to specify that an input filename is expected next.
          mf6internal: options_filein
          reader: urword
          optional: false
          longname: file keyword
          type: keyword
        obs6_filename:
          block: options
          description: name of input file to define observations for the LAK package. See the 'Observation
            utility' section for instructions for preparing observation input files. Table {#2} lists
            observation type(s) supported by the LAK package.
          reader: urword
          optional: false
          longname: obs6 input filename
          type: string
    mover:
      block: options
      description: keyword to indicate that this instance of the LAK Package can be used with the Water
        Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within
        the package to store the available, provided, and received water.
      reader: urword
      optional: true
      type: keyword
    dev_force_legacy:
      block: options
      description: keyword that solves every active lake with the default (legacy) substitution solver
        under the implicit formulation, instead of only those lakes that are too poorly conditioned to
        solve as a matrix unknown.  Cannot be specified with DEV_FORCE_LEGACY_LAKE.  This development
        option exists to test that path and is not supported.
      mf6internal: iforceleg
      reader: urword
      optional: true
      longname: force the legacy solution for every lake
      type: keyword
    dev_force_legacy_lake:
      block: options
      description: integer lake number that is solved with the default (legacy) substitution solver under
        the implicit formulation, while the other lakes are solved as matrix unknowns.  Cannot be specified
        with DEV_FORCE_LEGACY.  This development option exists to test that path and is not supported.
      mf6internal: iforceleglak
      reader: urword
      optional: true
      longname: force the legacy solution for one lake
      type: integer
    dev_groundwater_head_conductance:
      block: options
      description: keyword that calculates the conductance for horizontal connections using the groundwater
        head instead of the lake stage.  This development option is not supported.
      mf6internal: igwhcopt
      reader: urword
      optional: true
      longname: use the groundwater head to calculate horizontal conductance
      type: keyword
    dev_maximum_outlet_depth:
      block: options
      description: real number value that defines the maximum depth used to calculate outlet flow.  This
        development option is not supported.
      mf6internal: outdmax
      reader: urword
      optional: true
      longname: maximum outlet depth
      type: double
    surfdep:
      block: options
      description: real value that defines the surface depression depth for VERTICAL lake-GWF connections.
        If specified, SURFDEP must be greater than or equal to zero. If SURFDEP is not specified, a default
        value of zero is used for all vertical lake-GWF connections.
      reader: urword
      optional: true
      longname: surface depression depth
      mf6internal: surfdep
      type: double
    implicit:
      block: options
      description: keyword that activates the implicit formulation. With this option each lake stage is
        solved as an additional unknown in the groundwater flow matrix, instead of by the default substitution-iteration
        solver. The implicit formulation typically converges in far fewer outer iterations for steady-state
        and strongly coupled lakes and can solve problems for which the default formulation fails to converge.
        Converged results are equivalent to the default formulation. The implicit formulation makes the
        coefficient matrix asymmetric and therefore requires the BICGSTAB linear acceleration in the Iterative
        Model Solution (IMS). Each lake must have at least one groundwater connection when the IMPLICIT
        option is active because the implicit formulation solves the lake stage through its lakebed seepage;
        the program will terminate with an error if a lake with no groundwater connections is specified
        with the IMPLICIT option. The implicit formulation does not yet include the density terms of the
        Buoyancy (BUY) Package, and the program will terminate with an error if the IMPLICIT option is
        specified and the BUY Package is active. If a lake stage becomes too poorly conditioned to solve
        as a matrix unknown, which can happen for a weakly connected or disconnected lake, that lake is
        solved automatically by the default substitution solver instead, so the implicit formulation remains
        as robust as the default formulation. The Newton formulation is recommended for lakes that may
        become perched (disconnected from the aquifer), because results obtained with the standard rewetting
        (REWET) capability can otherwise differ between the two approaches.
      mf6internal: iimplicit
      reader: urword
      optional: true
      longname: solve lake stage in the groundwater flow matrix
      type: keyword
    maximum_iterations:
      block: options
      description: integer value that defines the maximum number of Newton-Raphson iterations allowed
        for a lake. By default, MAXIMUM_ITERATIONS is equal to 100. MAXIMUM_ITERATIONS would only need
        to be increased from the default value if one or more lakes in a simulation has a large water
        budget error. This option applies only to the default substitution-iteration solver; when the
        IMPLICIT option is active the lake stage is solved within the groundwater flow matrix and its
        convergence is controlled by the Iterative Model Solution (IMS) settings instead.
      reader: urword
      optional: true
      longname: LAK Newton-Raphson iterations
      mf6internal: maxlakit
      type: integer
    maximum_stage_change:
      block: options
      description: real value that defines the lake stage closure tolerance. By default, MAXIMUM_STAGE_CHANGE
        is equal to $1 times 10^{-5}$. The MAXIMUM_STAGE_CHANGE would only need to be increased or decreased
        from the default value if the water budget error for one or more lakes is too small or too large,
        respectively. This option applies only to the default substitution-iteration solver; when the
        IMPLICIT option is active the lake stage is solved within the groundwater flow matrix and its
        convergence is controlled by the Iterative Model Solution (IMS) settings instead.
      reader: urword
      optional: true
      longname: stage closure tolerance
      mf6internal: dmaxchg
      type: double
    time_conversion:
      block: options
      description: real value that is used to convert user-specified Manning's roughness coefficients
        or gravitational acceleration used to calculate outlet flows from seconds to model time units.
        TIME_CONVERSION should be set to 1.0, 60.0, 3,600.0, 86,400.0, and 31,557,600.0 when using time
        units (TIME_UNITS) of seconds, minutes, hours, days, or years in the simulation, respectively.
        TIME_CONVERSION does not need to be specified if no lake outlets are specified or TIME_UNITS are
        seconds.
      reader: urword
      optional: true
      longname: time conversion factor
      mf6internal: convtime
      type: double
    length_conversion:
      block: options
      description: real value that is used to convert outlet user-specified Manning's roughness coefficients
        or gravitational acceleration used to calculate outlet flows from meters to model length units.
        LENGTH_CONVERSION should be set to 3.28081, 1.0, and 100.0 when using length units (LENGTH_UNITS)
        of feet, meters, or centimeters in the simulation, respectively. LENGTH_CONVERSION does not need
        to be specified if no lake outlets are specified or LENGTH_UNITS are meters.
      reader: urword
      optional: true
      longname: length conversion factor
      mf6internal: convlength
      type: double
    dev_no_final_check:
      block: options
      description: flag disabling the final convergence check of the change in lake stages. By default
        this check is enabled.
      reader: urword
      optional: true
      longname: disable final convergence check for lake stages
      mf6internal: iconvchk
      type: keyword
  dimensions:
    nlakes:
      block: dimensions
      description: value specifying the number of lakes that will be simulated for all stress periods.
      reader: urword
      optional: false
      longname: number of lakes
      type: integer
    noutlets:
      block: dimensions
      description: value specifying the number of outlets that will be simulated for all stress periods.
        If NOUTLETS is not specified, a default value of zero is used.
      reader: urword
      optional: false
      longname: number of outlets
      type: integer
    ntables:
      block: dimensions
      description: value specifying the number of lakes tables that will be used to define the lake stage,
        volume relation, and surface area. If NTABLES is not specified, a default value of zero is used.
      reader: urword
      optional: false
      longname: number of tables
      type: integer
  packagedata:
    packagedata:
      shape: (nlakes)
      block: packagedata
      reader: urword
      type: list
      children:
        packagedata:
          shape: (nlakes)
          block: packagedata
          reader: urword
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (lake) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NLAKES. Lake information must be specified for every lake or the program will terminate
                with an error.  The program will also terminate with an error if information for a lake
                is specified more than once.
              reader: urword
              longname: lake number for this entry
              numeric_index: true
              mf6internal: packagedata_ifno
              type: integer
            strt:
              block: packagedata
              description: real value that defines the starting stage for the lake.
              reader: urword
              longname: starting lake stage
              type: double
            nlakeconn:
              block: packagedata
              description: integer value that defines the number of GWF cells connected to this (IFNO)
                lake. There can only be one vertical lake connection to each GWF cell. NLAKECONN must
                be greater than zero.
              reader: urword
              longname: number of lake connections
              type: integer
            aux:
              shape: (naux)
              block: packagedata
              description: represents the values of the auxiliary variables for each lake. The values
                of auxiliary variables must be present for each lake. The values must be specified in
                the order of the auxiliary variables specified in the OPTIONS block.  If the package supports
                time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              reader: urword
              time_series: true
              optional: true
              longname: auxiliary variables
              type: double
            boundname:
              block: packagedata
              description: name of the lake cell.  BOUNDNAME is an ASCII character variable that can contain
                as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must
                be enclosed within single quotes.
              reader: urword
              optional: true
              longname: well name
              type: string
  connectiondata:
    connectiondata:
      shape: (sum(nlakeconn))
      block: connectiondata
      reader: urword
      type: list
      children:
        connectiondata:
          shape: (sum(nlakeconn))
          block: connectiondata
          reader: urword
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (lake) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NLAKES. Lake information must be specified for every lake or the program will terminate
                with an error.  The program will also terminate with an error if information for a lake
                is specified more than once.
              reader: urword
              longname: lake number for this entry
              numeric_index: true
              mf6internal: packagedata_ifno
              type: integer
            iconn:
              block: connectiondata
              description: integer value that defines the GWF connection number for this lake connection
                entry. ICONN must be greater than zero and less than or equal to NLAKECONN for lake IFNO.
              reader: urword
              longname: connection number for this entry
              numeric_index: true
              type: integer
            cellid:
              shape: (ncelldim)
              block: connectiondata
              description: is the cell identifier, and depends on the type of grid that is used for the
                simulation.  For a structured grid that uses the DIS input file, CELLID is the layer,
                row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D
                number.  If the model uses the unstructured discretization (DISU) input file, CELLID is
                the node number for the cell.
              reader: urword
              longname: cell identifier
              type: integer
            claktype:
              block: connectiondata
              description: 'character string that defines the lake-GWF connection type for the lake connection.
                Possible lake-GWF connection type strings include:  VERTICAL--character keyword to indicate
                the lake-GWF connection is vertical  and connection conductance calculations use the hydraulic
                conductivity corresponding to the $K_{33}$ tensor component defined for CELLID in the
                NPF package. HORIZONTAL--character keyword to indicate the lake-GWF connection is horizontal
                and connection conductance calculations use the hydraulic conductivity corresponding to
                the $K_{11}$ tensor component defined for CELLID in the NPF package. EMBEDDEDH--character
                keyword to indicate the lake-GWF connection is embedded in a single cell and connection
                conductance calculations use the hydraulic conductivity corresponding to the $K_{11}$
                tensor component defined for CELLID in the NPF package. EMBEDDEDV--character keyword to
                indicate the lake-GWF connection is embedded in a single cell and connection conductance
                calculations use the hydraulic conductivity corresponding to the $K_{33}$ tensor component
                defined for CELLID in the NPF package. Embedded lakes can only be connected to a single
                cell (NLAKECONN = 1) and there must be a lake table associated with each embedded lake.'
              reader: urword
              longname: lake connection type
              type: string
            bedleak:
              block: connectiondata
              description: real value or character string that defines the bed leakance for the lake-GWF
                connection. BEDLEAK must be greater than or equal to zero, equal to the DNODATA value
                (3.0E+30), or specified to be NONE. If DNODATA or NONE is specified for BEDLEAK, the lake-GWF
                connection conductance is solely a function of aquifer properties in the connected GWF
                cell and lakebed sediments are assumed to be absent. Warning messages will be issued if
                NONE is specified. Eventually the ability to specify NONE will be deprecated and cause
                MODFLOW 6 to terminate with an error.
              reader: urword
              longname: bed leakance
              type: string
            belev:
              block: connectiondata
              description: real value that defines the bottom elevation for a HORIZONTAL lake-GWF connection.
                Any value can be specified if CLAKTYPE is VERTICAL, EMBEDDEDH, or EMBEDDEDV. If CLAKTYPE
                is HORIZONTAL and BELEV is not equal to TELEV, BELEV must be greater than or equal to
                the bottom of the GWF cell CELLID. If BELEV is equal to TELEV, BELEV is reset to the bottom
                of the GWF cell CELLID.
              reader: urword
              longname: bottom elevation
              type: double
            telev:
              block: connectiondata
              description: real value that defines the top elevation for a HORIZONTAL lake-GWF connection.
                Any value can be specified if CLAKTYPE is VERTICAL, EMBEDDEDH, or EMBEDDEDV. If CLAKTYPE
                is HORIZONTAL and TELEV is not equal to BELEV, TELEV must be less than or equal to the
                top of the GWF cell CELLID. If TELEV is equal to BELEV, TELEV is reset to the top of the
                GWF cell CELLID.
              reader: urword
              longname: top elevation
              type: double
            connlen:
              block: connectiondata
              description: real value that defines the distance between the connected GWF CELLID node
                and the lake for a HORIZONTAL, EMBEDDEDH, or EMBEDDEDV lake-GWF connection. CONLENN must
                be greater than zero for a HORIZONTAL, EMBEDDEDH, or EMBEDDEDV lake-GWF connection. Any
                value can be specified if CLAKTYPE is VERTICAL.
              reader: urword
              longname: connection length
              type: double
            connwidth:
              block: connectiondata
              description: real value that defines the connection face width for a HORIZONTAL lake-GWF
                connection. CONNWIDTH must be greater than zero for a HORIZONTAL lake-GWF connection.
                Any value can be specified if CLAKTYPE is VERTICAL, EMBEDDEDH, or EMBEDDEDV.
              reader: urword
              longname: connection width
              type: double
  tables:
    tables:
      shape: (ntables)
      block: tables
      reader: urword
      optional: true
      type: list
      children:
        tables:
          shape: (ntables)
          block: tables
          reader: urword
          optional: true
          type: record
          children:
            ifno:
              block: packagedata
              description: integer value that defines the feature (lake) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NLAKES. Lake information must be specified for every lake or the program will terminate
                with an error.  The program will also terminate with an error if information for a lake
                is specified more than once.
              reader: urword
              longname: lake number for this entry
              numeric_index: true
              mf6internal: packagedata_ifno
              type: integer
            tab6:
              block: tables
              description: keyword to specify that record corresponds to a table file.
              reader: urword
              optional: false
              longname: head keyword
              type: keyword
            filein:
              block: options
              description: keyword to specify that an input filename is expected next.
              mf6internal: options_filein
              reader: urword
              optional: false
              longname: file keyword
              type: keyword
            tab6_filename:
              block: tables
              description: character string that defines the path and filename for the file containing
                lake table data for the lake connection. The TAB6_FILENAME file includes the number of
                entries in the file and the relation between stage, volume, and surface area for each
                entry in the file. Lake table files for EMBEDDEDH and EMBEDDEDV lake-GWF connections also
                include lake-GWF exchange area data for each entry in the file. Instructions for creating
                the TAB6_FILENAME input file are provided in Lake Table Input File section.
              mf6internal: laktab6_filename
              reader: urword
              optional: false
              longname: table file name
              type: string
  outlets:
    outlets:
      shape: (noutlets)
      block: outlets
      reader: urword
      optional: true
      type: list
      children:
        outlets:
          shape: (noutlets)
          block: outlets
          reader: urword
          optional: true
          type: record
          children:
            outletno:
              block: outlets
              description: integer value that defines the outlet number associated with the specified
                OUTLETS data on the line. OUTLETNO must be greater than zero and less than or equal to
                NOUTLETS. Outlet information must be specified for every outlet or the program will terminate
                with an error. The program will also terminate with an error if information for a outlet
                is specified more than once.
              reader: urword
              longname: outlet number for this entry
              numeric_index: true
              mf6internal: outlets_outletno
              type: integer
            lakein:
              block: outlets
              description: integer value that defines the lake number that outlet is connected to. LAKEIN
                must be greater than zero and less than or equal to NLAKES.
              reader: urword
              longname: lake number for upstream lake
              numeric_index: true
              type: integer
            lakeout:
              block: outlets
              description: integer value that defines the lake number that outlet discharge from lake
                outlet OUTLETNO is routed to. LAKEOUT must be greater than or equal to zero and less than
                or equal to NLAKES. If LAKEOUT is zero, outlet discharge from lake outlet OUTLETNO is
                discharged to an external boundary.
              reader: urword
              longname: lake number for downstream lake
              numeric_index: true
              type: integer
            couttype:
              block: outlets
              description: 'character string that defines the outlet type for the outlet OUTLETNO. Possible
                COUTTYPE strings include: SPECIFIED--character keyword to indicate the outlet is defined
                as a specified flow.  MANNING--character keyword to indicate the outlet is defined using
                Manning''s equation. WEIR--character keyword to indicate the outlet is defined using a
                sharp weir equation.'
              reader: urword
              longname: outlet type
              type: string
            invert:
              block: outlets
              description: real value that defines the invert elevation for the lake outlet. Any value
                can be specified if COUTTYPE is SPECIFIED. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              mf6internal: outlets_invert
              longname: invert elevation
              type: double
            width:
              block: outlets
              description: real value that defines the width of the lake outlet. Any value can be specified
                if COUTTYPE is SPECIFIED. If the Options block includes a TIMESERIESFILE entry (see the
                'Time-Variable Input' section), values can be obtained from a time series by entering
                the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              mf6internal: outlets_width
              longname: outlet width
              type: double
            rough:
              block: outlets
              description: real value that defines the roughness coefficient for the lake outlet. Any
                value can be specified if COUTTYPE is not MANNING. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              mf6internal: outlets_rough
              longname: roughness coefficient
              type: double
            slope:
              block: outlets
              description: real value that defines the bed slope for the lake outlet. Any value can be
                specified if COUTTYPE is not MANNING. If the Options block includes a TIMESERIESFILE entry
                (see the 'Time-Variable Input' section), values can be obtained from a time series by
                entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              mf6internal: outlets_slope
              longname: bed slope
              type: double
  period:
    number:
      shape: (nper)
      block: period
      description: integer value that defines the lake or outlet number associated with the specified
        PERIOD data on the line.  NUMBER must be greater than zero and less than or equal to NLAKES for
        a lake number and less than or equal to NOUTLETS for an outlet number.
      reader: urword
      longname: lake or outlet number for this entry
      numeric_index: true
      mf6internal: ifno
      type: integer
    laksetting:
      shape: (nper)
      block: period
      description: 'line of information that is parsed into a keyword and values.  Keyword values that
        can be used to start the LAKSETTING string include both keywords for lake settings and keywords
        for outlet settings.  Keywords for lake settings include: STATUS, STAGE, RAINFALL, EVAPORATION,
        RUNOFF, INFLOW, WITHDRAWAL, and AUXILIARY.  Keywords for outlet settings include RATE, INVERT,
        WIDTH, SLOPE, and ROUGH.'
      reader: urword
      type: union
      children:
        stage:
          block: period
          description: real or character value that defines the stage for the lake. The specified STAGE
            is only applied if the lake is a constant stage lake. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          mf6dimension: (nlakes)
          time_series: true
          reader: urword
          longname: lake stage
          type: double
        invert:
          block: period
          description: real or character value that defines the invert elevation for the lake outlet.
            A specified INVERT value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO
            is not SPECIFIED. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          mf6dimension: (noutlets)
          reader: urword
          time_series: true
          longname: invert elevation
          type: double
        width:
          block: period
          description: real or character value that defines the width of the lake outlet. A specified
            WIDTH value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO is not SPECIFIED.
            If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          mf6dimension: (noutlets)
          reader: urword
          time_series: true
          longname: outlet width
          type: double
        rough:
          block: period
          description: real value that defines the roughness coefficient for the lake outlet. Any value
            can be specified if COUTTYPE is not MANNING. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          mf6dimension: (noutlets)
          reader: urword
          time_series: true
          longname: roughness coefficient
          type: double
        slope:
          block: period
          description: real or character value that defines the bed slope for the lake outlet. A specified
            SLOPE value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO is MANNING.
            If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          mf6dimension: (noutlets)
          reader: urword
          time_series: true
          longname: bed slope
          type: double
        status:
          block: period
          description: keyword option to define lake status.  STATUS can be ACTIVE, INACTIVE, or CONSTANT.
            By default, STATUS is ACTIVE.
          reader: urword
          longname: lake status
          type: string
        rainfall:
          block: period
          description: real or character value that defines the rainfall rate $(LT^{-1})$ for the lake.
            Value must be greater than or equal to zero. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          mf6dimension: (nlakes)
          reader: urword
          time_series: true
          longname: rainfall rate
          type: double
        evaporation:
          block: period
          description: real or character value that defines the maximum evaporation rate $(LT^{-1})$ for
            the lake. Value must be greater than or equal to zero. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          mf6dimension: (nlakes)
          reader: urword
          time_series: true
          longname: evaporation rate
          type: double
        runoff:
          block: period
          description: real or character value that defines the runoff rate $(L^3 T^{-1})$ for the lake.
            Value must be greater than or equal to zero. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          mf6dimension: (nlakes)
          reader: urword
          time_series: true
          longname: runoff rate
          type: double
        inflow:
          block: period
          description: real or character value that defines the volumetric inflow rate $(L^3 T^{-1})$
            for the lake. Value must be greater than or equal to zero. If the Options block includes a
            TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from
            a time series by entering the time-series name in place of a numeric value. By default, inflow
            rates are zero for each lake.
          mf6dimension: (nlakes)
          reader: urword
          time_series: true
          longname: inflow rate
          type: double
        withdrawal:
          block: period
          description: real or character value that defines the maximum withdrawal rate $(L^3 T^{-1})$
            for the lake. Value must be greater than or equal to zero. If the Options block includes a
            TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from
            a time series by entering the time-series name in place of a numeric value.
          mf6dimension: (nlakes)
          reader: urword
          time_series: true
          longname: maximum withdrawal rate
          type: double
        rate:
          block: period
          description: real or character value that defines the extraction rate for the lake outflow.
            A positive value indicates inflow and a negative value indicates outflow from the lake. RATE
            only applies to outlets associated with active lakes (STATUS is ACTIVE). A specified RATE
            is only applied if COUTTYPE for the OUTLETNO is SPECIFIED. If the Options block includes a
            TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from
            a time series by entering the time-series name in place of a numeric value. By default, the
            RATE for each SPECIFIED lake outlet is zero.
          mf6dimension: (noutlets)
          reader: urword
          time_series: true
          longname: extraction rate
          type: double
        auxiliaryrecord:
          block: period
          mf6internal: auxrecord
          reader: urword
          type: record
          children:
            auxiliary:
              block: period
              description: keyword for specifying auxiliary variable.
              reader: urword
              mf6internal: period_auxiliary
              type: keyword
            auxname:
              block: period
              description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match
                one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does not
                match one of the auxiliary variable names defined in the OPTIONS block the data are ignored.
              reader: urword
              type: string
            auxval:
              block: period
              description: value for the auxiliary variable. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              reader: urword
              time_series: true
              longname: auxiliary variable value
              type: double
