name = "gwf-wel"
schema_version = "2.0.0.dev1"
advanced = false
multi = true
ftype = "WEL"

[blocks.options.auxiliary]
shape = "(naux)"
block = "options"
description = "defines an array of one or more auxiliary variable names.  There is no limit on the number of auxiliary variables that can be provided on this line; however, lists of information provided in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary variables may not be used by the package, but they will be available for use by other parts of the program.  The program will terminate with an error if auxiliary variables are specified on more than one line in the options block."
reader = "urword"
optional = true
longname = "keyword to specify aux variables"
type = "string"

[blocks.options.auxmultname]
block = "options"
description = "name of auxiliary variable to be used as multiplier of well flow rate."
reader = "urword"
optional = true
longname = "name of auxiliary variable for multiplier"
type = "string"

[blocks.options.boundnames]
block = "options"
description = "keyword to indicate that boundary names may be provided with the list of well cells."
reader = "urword"
optional = true
type = "keyword"

[blocks.options.print_input]
block = "options"
description = "keyword to indicate that the list of well information will be written to the listing file immediately after it is read."
reader = "urword"
optional = true
longname = "print input to listing file"
mf6internal = "iprpak"
type = "keyword"

[blocks.options.print_flows]
block = "options"
description = "keyword to indicate that the list of well flow rates will be printed to the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for the last time step of each stress period."
reader = "urword"
optional = true
longname = "print calculated flows to listing file"
mf6internal = "iprflow"
type = "keyword"

[blocks.options.save_flows]
block = "options"
description = "keyword to indicate that well flow terms will be written to the file specified with 'BUDGET FILEOUT' in Output Control."
reader = "urword"
optional = true
longname = "save well flows to budget file"
mf6internal = "ipakcb"
type = "keyword"

[blocks.options.auto_flow_reduce]
block = "options"
description = "keyword and real value that defines the fraction of the cell thickness used as an interval for smoothly adjusting negative pumping rates to 0 in cells with head values less than or equal to the bottom of the cell. Negative pumping rates are adjusted to 0 or a smaller negative value when the head in the cell is equal to or less than the calculated interval above the cell bottom. AUTO_FLOW_REDUCE is set to 0.1 if the specified value is less than or equal to zero. AUTO_FLOW_REDUCE is set to 1.0 if the specified value is greater than 1.0 and the FLOW_REDUCTION_LENGTH option is not specified (that is, the value is interpreted as a fraction of the cell thickness). By default, negative pumping rates are not reduced during a simulation.  This AUTO_FLOW_REDUCE option only applies to wells in model cells that are marked as 'convertible' (ICELLTYPE /= 0) in the Node Property Flow (NPF) input file. Reduction in flow will not occur for wells in cells marked as confined (ICELLTYPE = 0)."
reader = "urword"
optional = true
longname = "cell fractional thickness for reduced pumping"
mf6internal = "flowred"
type = "double"

[blocks.options.afrcsv_filerecord]
block = "options"
reader = "urword"
optional = true
mf6internal = "afrcsv_rec"
type = "record"

[blocks.options.afrcsv_filerecord.children.auto_flow_reduce_csv]
block = "options"
description = "keyword to specify that record corresponds to the AUTO_FLOW_REDUCE output option in which a new record is written for each well and for each time step in which the user-requested extraction rate is reduced by the program."
reader = "urword"
optional = false
longname = "budget keyword"
mf6internal = "afrcsv"
type = "keyword"

[blocks.options.afrcsv_filerecord.children.fileout]
block = "options"
description = "keyword to specify that an output filename is expected next."
reader = "urword"
optional = false
longname = "file keyword"
type = "keyword"

[blocks.options.afrcsv_filerecord.children.afrcsvfile]
block = "options"
description = "name of the comma-separated value (CSV) output file to write information about well extraction rates that have been reduced by the program.  Entries are only written if the extraction rates are reduced."
reader = "urword"
optional = false
longname = "file keyword"
type = "string"

[blocks.options.flow_reduction_length]
block = "options"
description = "keyword that indicates the AUTO_FLOW_REDUCE value is a length instead of a fraction of the cell thickness. A warning will be issued if the FLOW_REDUCTION_LENGTH option is specified but the AUTO_FLOW_REDUCE option is not specified in the options block. The program will terminate with an error if the FLOW_REDUCTION_LENGTH option is specified and the AUTO_FLOW_REDUCE value specified in the options block is less than or equal to zero."
reader = "urword"
optional = true
longname = "flow reduction length keyword"
mf6internal = "iflowredlen"
type = "keyword"

[blocks.options.auto_flow_reduce_auxname]
block = "options"
description = "name of a variable listed in AUXILIARY that defines the per-well AUTO_FLOW_REDUCE value used to compute the flow reduction threshold for each well. The auxiliary variable is interpreted the same way as the global AUTO_FLOW_REDUCE value: as a length above the cell bottom when FLOW_REDUCTION_LENGTH is specified, or otherwise as a fraction of the cell thickness. When specified, the per-well auxiliary value overrides the global AUTO_FLOW_REDUCE value for that well. A warning will be issued if AUTO_FLOW_REDUCE_AUXNAME is specified but AUTO_FLOW_REDUCE is not specified in the OPTIONS block. A warning will be issued if AUTO_FLOW_REDUCE_AUXNAME is specified but FLOW_REDUCTION_LENGTH is not specified in the OPTIONS block. The program will terminate with an error if AUTO_FLOW_REDUCE_AUXNAME is specified but no AUXILIARY variables are specified, or if the named AUXILIARY variable cannot be found. The per-well value must be greater than zero and less than or equal to 1 when FLOW_REDUCTION_LENGTH is not specified, or greater than zero and less than or equal to the cell thickness when FLOW_REDUCTION_LENGTH is specified; the program will terminate with an error if a value is outside the valid range."
reader = "urword"
optional = true
longname = "name of auxiliary variable for the per-well AUTO\\_FLOW\\_REDUCE value"
mf6internal = "afrauxname"
type = "string"

[blocks.options.ts_filerecord]
block = "options"
reader = "urword"
optional = true
type = "record"

[blocks.options.ts_filerecord.children.ts6]
block = "options"
description = "keyword to specify that record corresponds to a time-series file."
reader = "urword"
optional = false
longname = "head keyword"
type = "keyword"

[blocks.options.ts_filerecord.children.filein]
block = "options"
description = "keyword to specify that an input filename is expected next."
reader = "urword"
optional = false
longname = "file keyword"
type = "keyword"

[blocks.options.ts_filerecord.children.ts6_filename]
block = "options"
description = "defines a time-series file defining time series that can be used to assign time-varying values. See the 'Time-Variable Input' section for instructions on using the time-series capability."
reader = "urword"
optional = false
longname = "file name of time series information"
type = "string"

[blocks.options.obs_filerecord]
block = "options"
reader = "urword"
optional = true
type = "record"

[blocks.options.obs_filerecord.children.obs6]
block = "options"
description = "keyword to specify that record corresponds to an observations file."
reader = "urword"
optional = false
longname = "obs keyword"
type = "keyword"

[blocks.options.obs_filerecord.children.filein]
block = "options"
description = "keyword to specify that an input filename is expected next."
reader = "urword"
optional = false
longname = "file keyword"
type = "keyword"

[blocks.options.obs_filerecord.children.obs6_filename]
block = "options"
description = "name of input file to define observations for the WEL package. See the 'Observation utility' section for instructions for preparing observation input files. Table {#2} lists observation type(s) supported by the WEL package."
reader = "urword"
optional = false
longname = "obs6 input filename"
type = "string"

[blocks.options.mover]
block = "options"
description = "keyword to indicate that this instance of the Well Package can be used with the Water Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within the package to store the available, provided, and received water."
reader = "urword"
optional = true
type = "keyword"

[blocks.dimensions.maxbound]
block = "dimensions"
description = "integer value specifying the maximum number of wells cells that will be specified for use during any stress period."
reader = "urword"
optional = false
longname = "maximum number of wells"
type = "integer"

[blocks.period.q]
shape = "(nper, nnodes)"
block = "period"
description = "is the volumetric well rate. A positive value indicates recharge (injection) and a negative value indicates discharge (extraction). If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
reader = "urword"
time_series = true
longname = "well rate"
type = "double"

[blocks.period.aux]
shape = "(nper, nnodes, naux)"
block = "period"
description = "represents the values of the auxiliary variables for each well. The values of auxiliary variables must be present for each well. The values must be specified in the order of the auxiliary variables specified in the OPTIONS block.  If the package supports time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
reader = "urword"
optional = true
time_series = true
longname = "auxiliary variables"
mf6internal = "auxvar"
type = "double"

[blocks.period.boundname]
shape = "(nper, nnodes)"
block = "period"
description = "name of the well cell.  BOUNDNAME is an ASCII character variable that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be enclosed within single quotes."
reader = "urword"
optional = true
longname = "well name"
type = "string"
