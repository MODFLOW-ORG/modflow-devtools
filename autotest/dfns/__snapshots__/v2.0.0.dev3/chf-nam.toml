type = "model"
schema_version = "2.0.0.dev3"
name = "chf-nam"
parent = "sim-nam"
ftype = "CHF6"
dependent_variable = "stage"

[runtime_dims.nja]
set_in = "ar"

[runtime_dims.nodes]
set_in = "ar"

[blocks.options.fields.list]
type = "string"
longname = "name of listing file"
description = "is name of the listing file to create for this CHF model.  If not specified, then the name of the list file will be the basename of the CHF model name file and the '.lst' extension.  For example, if the CHF name file is called 'my.model.nam' then the list file will be called 'my.model.lst'."
optional = true
case_sensitive = true

[blocks.options.fields.print_input]
type = "keyword"
longname = "print input to listing file"
description = "keyword to indicate that the list of all model stress package information will be written to the listing file immediately after it is read."
optional = true

[blocks.options.fields.print_flows]
type = "keyword"
longname = "print calculated flows to listing file"
description = "keyword to indicate that the list of all model package flow rates will be printed to the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for the last time step of each stress period."
optional = true

[blocks.options.fields.save_flows]
type = "keyword"
longname = "save flows for all packages to budget file"
description = "keyword to indicate that all model package flow terms will be written to the file specified with 'BUDGET FILEOUT' in Output Control."
optional = true

[blocks.options.fields.newtonoptions]
type = "record"
longname = "newton keyword and options"
description = "none"
optional = true

[blocks.options.fields.newtonoptions.fields.newton]
type = "keyword"
longname = "keyword to activate Newton-Raphson formulation"
description = "keyword that activates the Newton-Raphson formulation for surface water flow between connected reaches and stress packages that support calculation of Newton-Raphson terms."

[blocks.options.fields.newtonoptions.fields.under_relaxation]
type = "keyword"
longname = "keyword to activate Newton-Raphson UNDER_RELAXATION option"
description = "keyword that indicates whether the surface water stage in a reach will be under-relaxed when water levels fall below the bottom of the model below any given cell. By default, Newton-Raphson UNDER_RELAXATION is not applied."
optional = true

[blocks.packages.fields.packages]
type = "list"
longname = "package list"

[blocks.packages.fields.packages.item]
name = "packages"
type = "record"

[blocks.packages.fields.packages.item.fields.ftype]
type = "string"
longname = "package type"
description = "is the file type, which must be one of the following character values shown in table~ref{table:ftype-chf}. Ftype may be entered in any combination of uppercase and lowercase."
tagged = false

[blocks.packages.fields.packages.item.fields.fname]
type = "file"
longname = "file name"
description = "is the name of the file containing the package input.  The path to the file should be included if the file is not located in the folder where the program was run."
tagged = false
direction = "in"
mode_keyword = false
component = "package"
component_ftype = "ftype"

[blocks.packages.fields.packages.item.fields.pname]
type = "string"
longname = "user name for package"
description = "is the user-defined name for the package. PNAME is restricted to 16 characters.  No spaces are allowed in PNAME.  PNAME character values are read and stored by the program for stress packages only.  These names may be useful for labeling purposes when multiple stress packages of the same type are located within a single CHF Model.  If PNAME is specified for a stress package, then PNAME will be used in the flow budget table in the listing file; it will also be used for the text entry in the cell-by-cell budget file.  PNAME is case insensitive and is stored in all upper case letters."
optional = true
tagged = false

[memory.x]
type = "array"
set_in = "ca"
description = "Stage for each model cell. Checked in from the solution-level dependent-variable vector (or directly allocated when the DFW package is absent). Initialized by the IC package during AR; updated by the nonlinear solver at each Picard iteration (CA). API-written values serve as initial guesses and are overwritten by the solver."
obs_type = "STAGE"
dtype = "double"
shape = [
    "nodes",
]

[memory.xold]
type = "array"
readonly = true
set_in = "ad"
description = "Dependent variable from the end of the previous time step. Copied from X at advance (AD); used to restore X if the adaptive time stepping scheme retries a failed time step."
dtype = "double"
shape = [
    "nodes",
]

[memory.flowja]
type = "array"
readonly = true
set_in = "cq"
description = "Intercell flows in compressed sparse row (CSR) order, calculated after solution convergence. Diagonal entries hold the flow residual."
budget = "FLOW-JA-FACE"
dtype = "double"
shape = [
    "nja",
]

[memory.rhs]
type = "array"
readonly = true
set_in = "fc"
description = "Right-hand-side contribution for this model, sliced from the solution-level RHS vector. Rebuilt each solver iteration."
dtype = "double"
shape = [
    "nodes",
]

[memory.ibound]
type = "array"
set_in = "ar"
description = "Cell activity flag: positive values indicate active cells, zero indicates inactive (no-flow) cells. Set during model initialisation; may change when Newton-Raphson wet-dry logic activates or deactivates cells."
dtype = "integer"
shape = [
    "nodes",
]

[memory.neq]
readonly = true
set_in = "ar"
description = "Number of equations (unknowns) for this model. Equal to the number of active cells (NODES) for standard models."
type = "integer"

[memory.idxglo]
type = "array"
readonly = true
set_in = "mc"
description = "Maps each local CSR position to the corresponding row/column index in the global solution matrix. Populated during matrix connectivity (MC) and constant thereafter."
dtype = "integer"
shape = [
    "nja",
]

[observations.stage]
type = "array"
tagged = false
dtype = "integer"
index = true
cellid = true
shape = [
    "ncelldim",
]

[observations.flow-ja-face]
type = "record"
tagged = false

[observations.flow-ja-face.fields.cellid]
type = "array"
tagged = false
dtype = "integer"
index = true
cellid = true
shape = [
    "ncelldim",
]

[observations.flow-ja-face.fields.cellid2]
type = "array"
tagged = false
dtype = "integer"
index = true
cellid = true
shape = [
    "ncelldim",
]
