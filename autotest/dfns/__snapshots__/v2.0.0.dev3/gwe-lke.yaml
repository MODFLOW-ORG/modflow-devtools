type: package
schema_version: 2.0.0.dev3
name: gwe-lke
parent: gwe-nam
multi: true
subtype: advanced
dims:
  auxiliary:
    value: len(auxiliary)
runtime_dims:
  ncv:
    set_in: ar
blocks:
  options:
    fields:
      flow_package_name:
        type: string
        longname: keyword to specify name of corresponding flow package
        description: keyword to specify the name of the corresponding flow package.  If not specified,
          then the corresponding flow package must have the same name as this advanced transport package
          (the name associated with this package in the GWE name file).
        optional: true
      auxiliary:
        type: array
        longname: keyword to specify aux variables
        description: defines an array of one or more auxiliary variable names.  There is no limit on the
          number of auxiliary variables that can be provided on this line; however, lists of information
          provided in subsequent blocks must have a column of data for each auxiliary variable name defined
          here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
          cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
          variables may not be used by the package, but they will be available for use by other parts
          of the program.  The program will terminate with an error if auxiliary variables are specified
          on more than one line in the options block.
        optional: true
        dtype: string
      flow_package_auxiliary_name:
        type: string
        longname: keyword to specify name of temperature auxiliary variable in flow package
        description: keyword to specify the name of an auxiliary variable in the corresponding flow package.  If
          specified, then the simulated temperatures from this advanced transport package will be copied
          into the auxiliary variable specified with this name.  Note that the flow package must have
          an auxiliary variable with this name or the program will terminate with an error.  If the flows
          for this advanced transport package are read from a file, then this option will have no effect.
        optional: true
      boundnames:
        type: keyword
        description: keyword to indicate that boundary names may be provided with the list of lake cells.
        optional: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to indicate that the list of lake information will be written to the listing
          file immediately after it is read.
        optional: true
      print_temperature:
        type: keyword
        longname: print calculated temperatures to listing file
        description: keyword to indicate that the list of lake {#2} will be printed to the listing file
          for every stress period in which 'TEMPERATURE PRINT' is specified in Output Control.  If there
          is no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last
          time step of each stress period.
        optional: true
      print_flows:
        type: keyword
        longname: print calculated flows to listing file
        description: keyword to indicate that the list of lake flow rates will be printed to the listing
          file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If
          there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed
          for the last time step of each stress period.
        optional: true
      save_flows:
        type: keyword
        longname: save lake flows to budget file
        description: keyword to indicate that lake flow terms will be written to the file specified with
          'BUDGET FILEOUT' in Output Control.
        optional: true
      temperature_filerecord:
        type: record
        optional: true
        fields:
          temperature:
            type: keyword
            longname: stage keyword
            description: keyword to specify that record corresponds to temperature.
          tempfile:
            type: file
            longname: file keyword
            description: name of the binary output file to write temperature information.
            tagged: false
            direction: out
      budget_filerecord:
        type: record
        optional: true
        fields:
          budget:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to the budget.
          budgetfile:
            type: file
            longname: file keyword
            description: name of the binary output file to write budget information.
            tagged: false
            direction: out
      budgetcsv_filerecord:
        type: record
        optional: true
        fields:
          budgetcsv:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to the budget CSV.
          budgetcsvfile:
            type: file
            longname: file keyword
            description: name of the comma-separated value (CSV) output file to write budget summary information.  A
              budget summary record will be written to this file for each time step of the simulation.
            tagged: false
            direction: out
      ts_filerecord:
        type: list
        optional: true
        item:
          type: record
          fields:
            ts6:
              type: keyword
              longname: head keyword
              description: keyword to specify that record corresponds to a time-series file.
            ts6_filename:
              type: file
              longname: file name of time series information
              description: defines a time-series file defining time series that can be used to assign
                time-varying values. See the 'Time-Variable Input' section for instructions on using the
                time-series capability.
              tagged: false
              direction: in
      obs_filerecord:
        type: record
        optional: true
        fields:
          obs6:
            type: keyword
            longname: obs keyword
            description: keyword to specify that record corresponds to an observations file.
          obs6_filename:
            type: file
            longname: obs6 input filename
            description: name of input file to define observations for the LKE package. See the 'Observation
              utility' section for instructions for preparing observation input files. Table {#2} lists
              observation type(s) supported by the LKE package.
            tagged: false
            direction: in
  packagedata:
    fields:
      packagedata:
        type: list
        item:
          type: record
          fields:
            lakeno:
              type: integer
              longname: lake number for this entry
              description: integer value that defines the lake number associated with the specified PACKAGEDATA
                data on the line. LAKENO must be greater than zero and less than or equal to NLAKES. Lake
                information must be specified for every lake or the program will terminate with an error.  The
                program will also terminate with an error if information for a lake is specified more
                than once.
              tagged: false
              index: true
              pk: true
            strt:
              type: double
              longname: starting lake temperature
              description: real value that defines the starting temperature for the lake.
              tagged: false
            ktf:
              type: double
              longname: boundary thermal conductivity
              description: is the thermal conductivity of the material between the aquifer cell and the
                lake. The thickness of the material is defined by the variable RBTHCND.
              tagged: false
            rbthcnd:
              type: double
              longname: streambed thickness
              description: real value that defines the thickness of the lakebed material through which
                conduction occurs.  Must be greater than 0.
              tagged: false
            aux:
              type: array
              longname: auxiliary variables
              description: represents the values of the auxiliary variables for each lake. The values
                of auxiliary variables must be present for each lake. The values must be specified in
                the order of the auxiliary variables specified in the OPTIONS block.  If the package supports
                time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              optional: true
              tagged: false
              dtype: double
              time_series: true
              shape:
                - auxiliary
            boundname:
              type: string
              longname: lake name
              description: name of the lake cell.  BOUNDNAME is an ASCII character variable that can contain
                as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must
                be enclosed within single quotes.
              optional: true
              tagged: false
  period:
    fields:
      lakeperioddata:
        type: list
        item:
          type: record
          fields:
            lakeno:
              type: integer
              longname: lake number for this entry
              description: integer value that defines the lake number associated with the specified PERIOD
                data on the line. LAKENO must be greater than zero and less than or equal to NLAKES.
              tagged: false
              index: true
              fk: packagedata.lakeno
            laksetting:
              type: union
              description: 'line of information that is parsed into a keyword and values.  Keyword values
                that can be used to start the LAKSETTING string include: STATUS, TEMPERATURE, RAINFALL,
                EVAPORATION, RUNOFF, and AUXILIARY.  These settings are used to assign the temperature
                associated with the corresponding flow terms.  Temperatures cannot be specified for all
                flow terms.  For example, the Lake Package supports a ''WITHDRAWAL'' flow term.  If this
                withdrawal term is active, then water will be withdrawn from the lake at the calculated
                temperature of the lake.'
              arms:
                status:
                  type: string
                  longname: lake temperature status
                  description: keyword option to define lake status.  STATUS can be ACTIVE, INACTIVE,
                    or CONSTANT. By default, STATUS is ACTIVE, which means that temperature will be calculated
                    for the lake.  If a lake is inactive, then there will be no energy fluxes into or
                    out of the lake and the inactive value will be written for the lake temperature.  If
                    a lake is constant, then the temperature for the lake will be fixed at the user specified
                    value.
                temperature:
                  type: string
                  longname: lake temperature
                  description: real or character value that defines the temperature for the lake. The
                    specified TEMPERATURE is only applied if the lake is a constant temperature lake.
                    If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input'
                    section), values can be obtained from a time series by entering the time-series name
                    in place of a numeric value.
                  time_series: true
                rainfall:
                  type: string
                  longname: rainfall temperature
                  description: real or character value that defines the rainfall temperature for the lake.
                    If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input'
                    section), values can be obtained from a time series by entering the time-series name
                    in place of a numeric value.
                  time_series: true
                evaporation:
                  type: string
                  longname: evaporation temperature
                  description: use of the EVAPORATION keyword is allowed in the LKE package; however,
                    the specified value is not currently used in LKE calculations.  Instead, the latent
                    heat of evaporation is multiplied by the simulated evaporation rate for determining
                    the thermal energy lost from a stream reach.
                  time_series: true
                runoff:
                  type: string
                  longname: runoff temperature
                  description: real or character value that defines the temperature of runoff for the
                    lake. Users are free to use whatever temperature scale they want, which might include
                    negative temperatures. If the Options block includes a TIMESERIESFILE entry (see the
                    'Time-Variable Input' section), values can be obtained from a time series by entering
                    the time-series name in place of a numeric value.
                  time_series: true
                ext-inflow:
                  type: string
                  longname: ext-inflow temperature
                  description: real or character value that defines the temperature of external inflow
                    for the lake.  Users are free to use whatever temperature scale they want, which might
                    include negative temperatures.  If the Options block includes a TIMESERIESFILE entry
                    (see the 'Time-Variable Input' section), values can be obtained from a time series
                    by entering the time-series name in place of a numeric value.
                  time_series: true
                auxiliaryrecord:
                  type: record
                  fields:
                    auxiliary:
                      type: keyword
                      description: keyword for specifying auxiliary variable.
                    auxname:
                      type: string
                      description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must
                        match one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME
                        does not match one of the auxiliary variable names defined in the OPTIONS block
                        the data are ignored.
                      tagged: false
                    auxval:
                      type: double
                      longname: auxiliary variable value
                      description: value for the auxiliary variable. If the Options block includes a TIMESERIESFILE
                        entry (see the 'Time-Variable Input' section), values can be obtained from a time
                        series by entering the time-series name in place of a numeric value.
                      tagged: false
                      time_series: true
    header:
      fill_forward: true
      field:
        name: iper
        type: integer
        longname: stress period number
        description: integer value specifying the starting stress period number for which the data specified
          in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and
          greater than zero.  The IPER value assigned to a stress period block must be greater than the
          IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD
          block will continue to apply for all subsequent stress periods, unless the program encounters
          another PERIOD block.
        tagged: false
memory:
  ncv:
    readonly: true
    set_in: ar
    description: Number of control volumes. Assigned from the linked flow package during AR.
    type: integer
  strt:
    type: array
    set_in: ar
    source: strt
    description: Starting temperature for each control volume.
    dtype: double
    shape:
      - ncv
  xnewpak:
    type: array
    set_in: ca
    description: Current temperature for each control volume. Initialized from STRT during AR; updated
      by the solver at each Picard iteration (CA). API-written values serve as initial guesses and are
      overwritten by the solver.
    dtype: double
    shape:
      - ncv
  xoldpak:
    type: array
    readonly: true
    set_in: ad
    description: Temperature from the end of the previous time step. Copied from XNEWPAK at the start
      of advance (AD).
    dtype: double
    shape:
      - ncv
  ibound:
    type: array
    set_in: ar
    description: Boundary activity flag for each control volume.
    dtype: integer
    shape:
      - ncv
  concfeat:
    type: array
    readonly: true
    set_in: cq
    description: Computed temperature for each feature. Set from XNEWPAK after solver convergence.
    dtype: double
    shape:
      - ncv
  qsto:
    type: array
    readonly: true
    set_in: cq
    description: Storage temperature flow contribution for each control volume.
    dtype: double
    shape:
      - ncv
  temprain:
    type: array
    set_in: rp
    description: Rainfall temperature for each lake.
    dtype: double
    shape:
      - ncv
  tempevap:
    type: array
    set_in: rp
    description: Evaporation temperature for each lake.
    dtype: double
    shape:
      - ncv
  temproff:
    type: array
    set_in: rp
    description: Runoff temperature for each lake.
    dtype: double
    shape:
      - ncv
  tempiflw:
    type: array
    set_in: rp
    description: External inflow temperature for each lake.
    dtype: double
    shape:
      - ncv
  ktf:
    type: array
    set_in: ar
    source: ktf
    description: Thermal conductivity of the lakebed (E/T/L/Deg).
    dtype: double
    shape:
      - ncv
  rfeatthk:
    type: array
    set_in: ar
    source: rbthcnd
    description: Thickness of the lakebed conduction layer (L).
    dtype: double
    shape:
      - ncv
