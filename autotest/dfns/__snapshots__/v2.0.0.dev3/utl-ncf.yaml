type: package
schema_version: 2.0.0.dev3
name: utl-ncf
parent: sim-nam
subtype: utility
dims:
  ncpl:
    value: ncpl
blocks:
  options:
    fields:
      wkt:
        type: string
        longname: CRS well-known text (WKT) string
        description: is the coordinate reference system (CRS) well-known text (WKT) string. Ignored if
          latitude and longitude griddata arrays have been provided for NETCDF_STRUCTURED export type.
        optional: true
      deflate:
        type: integer
        longname: variable compression deflate level
        description: is the variable deflate level (0=min, 9=max) in the NetCDF file. Defining this parameter
          activates per-variable compression at the level specified.
        optional: true
      shuffle:
        type: keyword
        description: is the keyword used to turn on the NetCDF variable shuffle filter when the deflate
          option is also set. The shuffle filter has the effect of storing the first byte of all of a
          variable's values in a chunk contiguously, followed by all the second bytes, etc. This can be
          an optimization for compression with certain types of data.
        optional: true
      chunk_time:
        type: integer
        longname: chunking parameter for the time dimension
        description: is the keyword used to provide a data chunk size for the time dimension in a NETCDF_MESH2D
          or NETCDF_STRUCTURED output file. Must be used in combination with the the chunk_face parameter
          (NETCDF_MESH2D) or the chunk_z, chunk_y, and chunk_x parameter set (NETCDF_STRUCTURED) to have
          an effect.
        optional: true
      chunk_face:
        type: integer
        longname: chunking parameter for the mesh face dimension
        description: is the keyword used to provide a data chunk size for the face dimension in a NETCDF_MESH2D
          output file. Must be used in combination with the the chunk_time parameter to have an effect.
        optional: true
      chunk_z:
        type: integer
        longname: chunking parameter for structured z
        description: is the keyword used to provide a data chunk size for the z dimension in a NETCDF_STRUCTURED
          output file. Must be used in combination with the the chunk_time, chunk_x and chunk_y parameter
          set to have an effect.
        optional: true
      chunk_y:
        type: integer
        longname: chunking parameter for structured y
        description: is the keyword used to provide a data chunk size for the y dimension in a NETCDF_STRUCTURED
          output file. Must be used in combination with the the chunk_time, chunk_x and chunk_z parameter
          set to have an effect.
        optional: true
      chunk_x:
        type: integer
        longname: chunking parameter for structured x
        description: is the keyword used to provide a data chunk size for the x dimension in a NETCDF_STRUCTURED
          output file. Must be used in combination with the the chunk_time, chunk_y and chunk_z parameter
          set to have an effect.
        optional: true
      modflow6_attr_off:
        type: keyword
        description: is the keyword used to turn off internal input tagging in the model NetCDF file.
          Tagging adds internal modflow 6 attribute(s) to variables which facilitate identification. Currently
          this applies to gridded arrays.
        optional: true
  dimensions:
    fields:
      ncpl:
        type: integer
        longname: number of cells in layer
        description: is the number of cells in a projected plane layer.
        optional: true
  griddata:
    fields:
      latitude:
        type: array
        longname: cell center latitude
        description: cell center latitude. Only supported for NETCDF_STRUCTURED export type.
        optional: true
        dtype: double
        shape:
          - ncpl
      longitude:
        type: array
        longname: cell center longitude
        description: cell center longitude. Only supported for NETCDF_STRUCTURED export type.
        optional: true
        dtype: double
        shape:
          - ncpl
memory:
  attr_off:
    set_in: ar
    source: modflow6_attr_off
    type: logical
  ncpl:
    set_in: ar
    source: ncpl
    type: integer
  latitude:
    type: array
    set_in: ar
    source: latitude
    dtype: double
    shape:
      - ncpl
  longitude:
    type: array
    set_in: ar
    source: longitude
    dtype: double
    shape:
      - ncpl
