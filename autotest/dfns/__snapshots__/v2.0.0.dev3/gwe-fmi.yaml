type: package
schema_version: 2.0.0.dev3
name: gwe-fmi
parent: gwe-nam
blocks:
  options:
    fields:
      save_flows:
        type: keyword
        longname: save calculated flow imbalance correction to budget file
        description: keyword to indicate that FMI flow terms will be written to the file specified with
          'BUDGET FILEOUT' in Output Control.
        optional: true
      flow_imbalance_correction:
        type: keyword
        longname: correct for flow imbalance
        description: 'correct for an imbalance in flows by assuming that any residual flow error comes
          in or leaves at the temperature of the cell.  When this option is activated, the GWE Model budget
          written to the listing file will contain two additional entries: FLOW-ERROR and FLOW-CORRECTION.  These
          two entries will be equal but opposite in sign.  The FLOW-CORRECTION term is a mass flow that
          is added to offset the error caused by an imprecise flow balance.  If these terms are not relatively
          small, the flow model should be rerun with stricter convergence tolerances.'
        optional: true
  packagedata:
    fields:
      packagedata:
        type: list
        longname: flowtype list
        optional: true
        item:
          type: record
          fields:
            flowtype:
              type: string
              longname: flow type
              description: is the word GWFBUDGET, GWFHEAD, GWFGRID, GWFMOVER or the name of an advanced
                GWF stress package from a previous model run.  If GWFBUDGET is specified, then the corresponding
                file must be a budget file.  If GWFHEAD is specified, the file must be a head file.  If
                GWFGRID is specified, the file must be a binary grid file. If GWFMOVER is specified, the
                file must be a mover file.  If an advanced GWF stress package name appears then the corresponding
                file must be the budget file saved by a LAK, SFR, MAW or UZF Package.
              tagged: false
            fname:
              type: file
              longname: file name
              description: is the name of the file containing flows.  The path to the file should be included
                if the file is not located in the folder where the program was run.
              tagged: false
              direction: in
memory:
  imbalancecorrect:
    set_in: ar
    source: flow_imbalance_correction
    type: logical
