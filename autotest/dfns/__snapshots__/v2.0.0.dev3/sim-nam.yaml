type: simulation
schema_version: 2.0.0.dev3
name: sim-nam
blocks:
  options:
    fields:
      continue:
        type: keyword
        longname: continue if not converged
        description: keyword flag to indicate that the simulation should continue even if one or more
          solutions do not converge.
        optional: true
      nocheck:
        type: keyword
        longname: turn off checking
        description: keyword flag to indicate that the model input check routines should not be called
          prior to each time step. Checks are performed by default.
        optional: true
      memory_print_option:
        type: string
        longname: memory print option
        description: is a flag that controls printing of detailed memory manager usage to the end of the
          simulation list file.  NONE means do not print detailed information. SUMMARY means print only
          the total memory for each simulation component. ALL means print information for each variable
          stored in the memory manager. NONE is default if MEMORY_PRINT_OPTION is not specified.
        optional: true
      profile_option:
        type: string
        longname: profiling option
        description: is a flag that controls performance profiling and reporting.  NONE disables profiling.
          SUMMARY means to measure and print a coarse performance profile. DETAIL means collect and print
          information with the highest resolution available. NONE is default if PROFILE_OPTION is not
          specified.
        optional: true
      maxerrors:
        type: integer
        longname: maximum number of errors
        description: maximum number of errors that will be stored and printed.
        optional: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to activate printing of simulation input summaries to the simulation list
          file (mfsim.lst). With this keyword, input summaries will be written for those packages that
          support newer input data model routines.  Not all packages are supported yet by the newer input
          data model routines.
        optional: true
      hpc_filerecord:
        type: record
        description: hpc record
        optional: true
        fields:
          hpc6:
            type: keyword
            longname: head keyword
            description: keyword to specify that record corresponds to a hpc file.
          hpc6_filename:
            type: file
            longname: file name of time series information
            description: name of input file to define HPC file settings for the HPC package. See the 'HPC
              File' section for instructions for preparing HPC input files.
            tagged: false
            direction: in
  timing:
    fields:
      tdis6:
        type: string
        longname: name of tdis input file
        description: is the name of the Temporal Discretization (TDIS) Input File.
        optional: true
        case_sensitive: true
  models:
    fields:
      models:
        type: list
        longname: list of models
        description: is the list of model types, model name files, and model names.
        optional: true
        item:
          type: record
          description: is the record of model types, model name files, and model names.
          fields:
            mtype:
              type: string
              longname: model type
              description: is the type of model to add to simulation.
              tagged: false
            mfname:
              type: string
              longname: file name for model name file
              description: is the file name of the model name file.
              tagged: false
              case_sensitive: true
            mname:
              type: string
              longname: name of model
              description: is the user-assigned name of the model.  The model name cannot exceed 16 characters
                and must not have blanks within the name.  The model name is case insensitive; any lowercase
                letters are converted and stored as upper case letters.
              tagged: false
  exchanges:
    fields:
      exchanges:
        type: list
        longname: list of exchanges
        description: is the list of exchange types, exchange files, and model names.
        optional: true
        item:
          type: record
          description: is the record of exchange types, exchange files, and model names.
          fields:
            exgtype:
              type: string
              longname: exchange type
              description: is the exchange type.
              tagged: false
            exgfile:
              type: string
              longname: input file for exchange
              description: is the input file for the exchange.
              tagged: false
              case_sensitive: true
            exgmnamea:
              type: string
              longname: name of model A
              description: is the name of the first model that is part of this exchange.
              tagged: false
            exgmnameb:
              type: string
              longname: name of model B
              description: is the name of the second model that is part of this exchange.
              tagged: false
  solutiongroup:
    fields:
      mxiter:
        type: integer
        longname: maximum solution group iterations
        description: is the maximum number of outer iterations for this solution group.  The default value
          is 1.  If there is only one solution in the solution group, then MXITER must be 1.
        optional: true
      solutiongroup:
        type: list
        longname: solution type and models in the solution
        description: is the list of solution types and models in the solution.
        item:
          type: record
          description: is the record of solution types and models in the solution.
          fields:
            slntype:
              type: string
              longname: type of solution
              description: is the type of solution.  The Integrated Model Solution (IMS6) and Explicit
                Model Solution (EMS6) are the only supported options in this version.
              tagged: false
              valid:
                - ims6
                - ems6
            slnfname:
              type: string
              longname: file name for solution input
              description: name of file containing solution input.
              tagged: false
              case_sensitive: true
            slnmnames:
              type: array
              longname: array of model names in this solution
              description: is the array of model names to add to this solution.  The number of model names
                is determined by the number of model names the user provides on this line.
              tagged: false
              dtype: string
    header:
      field:
        name: group_num
        type: integer
        description: is the group number of the solution group.  Solution groups must be numbered sequentially,
          starting with group number one.
        tagged: false
memory:
  prmem:
    set_in: ar
    source: memory_print_option
    type: string
  prprof:
    set_in: ar
    source: profile_option
    type: string
