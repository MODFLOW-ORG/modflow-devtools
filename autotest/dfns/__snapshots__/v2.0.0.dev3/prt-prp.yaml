type: package
schema_version: 2.0.0.dev3
name: prt-prp
parent: prt-nam
multi: true
subtype: stress
dims:
  nreleasepts:
    value: nreleasepts
    scope: model
  nreleasetimes:
    value: nreleasetimes
    scope: model
runtime_dims:
  naux:
    set_in: ar
  nbound:
    set_in: rp
  ncolbnd:
    set_in: ar
blocks:
  options:
    fields:
      boundnames:
        type: keyword
        description: keyword to indicate that boundary names may be provided with the list of particle
          release points.
        optional: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to indicate that the list of all model stress package information will be
          written to the listing file immediately after it is read.
        optional: true
      dev_exit_solve_method:
        type: integer
        longname: exit solve method
        description: the method for iterative solution of particle exit location and time in the generalized
          Pollock's method.  0 default, 1 Brent, 2 Chandrupatla.  The default is Brent's method.
        optional: true
        developmode: true
      exit_solve_tolerance:
        type: double
        longname: exit solve tolerance
        description: the convergence tolerance for iterative solution of particle exit location and time
          in the generalized Pollock's method.  The variable being solved for varies from 0 to 1.  A tolerance
          of 0.00001 works well for many problems, but the value that strikes the best balance between
          accuracy and runtime is problem-dependent.
        optional: true
        default: 1.0e-05
      local_z:
        type: keyword
        longname: whether to use local z coordinates
        description: indicates that 'zrpt' defines the local z coordinate of the release point within
          the cell, with value of 0 at the bottom and 1 at the effective top of the cell. If the cell
          is convertible and partially saturated at release time, the effective top of the cell is considered
          to be the water table elevation (the head in the cell) rather than the top defined by the user,
          and is constrained to be no higher than the geometric top of the cell and no lower than the
          cell bottom. If the cell is confined, the effective top is the geometric top.
        optional: true
      extend_tracking:
        type: keyword
        longname: whether to extend tracking beyond the end of the simulation
        description: indicates that particles should be tracked beyond the end of the simulation's final
          time step (using that time step's flows) until particles terminate or reach a specified stop
          time.  By default, particles are terminated at the end of the simulation's final time step.
        optional: true
      track_filerecord:
        type: record
        optional: true
        fields:
          track:
            type: keyword
            longname: track keyword
            description: keyword to specify that record corresponds to a binary track output file.  Each
              PRP Package may have a distinct binary track output file.
          trackfile:
            type: file
            longname: file keyword
            description: name of the binary output file to write tracking information.
            tagged: false
            direction: out
      trackcsv_filerecord:
        type: record
        optional: true
        fields:
          trackcsv:
            type: keyword
            longname: track keyword
            description: keyword to specify that record corresponds to a CSV track output file.  Each
              PRP Package may have a distinct CSV track output file.
          trackcsvfile:
            type: file
            longname: file keyword
            description: name of the comma-separated value (CSV) file to write tracking information.
            tagged: false
            direction: out
      stoptime:
        type: double
        longname: stop time
        description: real value defining the maximum simulation time to which particles in the package
          can be tracked.  Particles that have not terminated earlier due to another termination condition
          will terminate when simulation time STOPTIME is reached.  If the last stress period in the simulation
          consists of more than one time step, particles will not be tracked past the ending time of the
          last stress period, regardless of STOPTIME.  If the EXTEND_TRACKING option is enabled and the
          last stress period in the simulation is steady-state, the simulation ending time will not limit
          the time to which particles can be tracked, but STOPTIME and STOPTRAVELTIME will continue to
          apply.  If STOPTIME and STOPTRAVELTIME are both provided, particles will be stopped if either
          is reached.
        optional: true
      stoptraveltime:
        type: double
        longname: stop travel time
        description: real value defining the maximum travel time over which particles in the model can
          be tracked.  Particles that have not terminated earlier due to another termination condition
          will terminate when their travel time reaches STOPTRAVELTIME.  If the last stress period in
          the simulation consists of more than one time step, particles will not be tracked past the ending
          time of the last stress period, regardless of STOPTRAVELTIME.  If the EXTEND_TRACKING option
          is enabled and the last stress period in the simulation is steady-state, the simulation ending
          time will not limit the time to which particles can be tracked, but STOPTIME and STOPTRAVELTIME
          will continue to apply.  If STOPTIME and STOPTRAVELTIME are both provided, particles will be
          stopped if either is reached.
        optional: true
      stop_at_weak_sink:
        type: keyword
        longname: stop at weak sink
        description: is a text keyword to indicate that a particle is to terminate when it enters a cell
          that is a weak sink.  By default, particles are allowed to pass though cells that are weak sinks.
        optional: true
      istopzone:
        type: integer
        longname: stop zone number
        description: integer value defining the stop zone number.  If cells have been assigned IZONE values
          in the GRIDDATA block, a particle terminates if it enters a cell whose IZONE value matches ISTOPZONE.  An
          ISTOPZONE value of zero indicates that there is no stop zone.  The default value is zero.
        optional: true
      drape:
        type: keyword
        longname: drape
        description: is a text keyword to indicate that if a particle's release point is in a cell that
          happens to be inactive at release time, the particle is to be moved to the topmost active cell
          below it, if any. By default, a particle is not released into the simulation if its release
          point's cell is inactive at release time. Note that DRAPE does not apply to attempted release
          into a cell for which IDOMAIN <= 0, which is considered not to exist in the simulation. Attempted
          release into a such a cell results in an error.
        optional: true
      release_timesrecord:
        type: record
        optional: true
        removed: 6.6.0
        fields:
          release_times:
            type: keyword
            description: keyword indicating release times will follow
            removed: 6.6.0
          times:
            type: array
            longname: release times
            description: times to release, relative to the beginning of the simulation.  RELEASE_TIMES
              and RELEASE_TIMESFILE are mutually exclusive.
            tagged: false
            removed: 6.6.0
            dtype: double
      release_timesfilerecord:
        type: record
        optional: true
        removed: 6.6.0
        fields:
          release_timesfile:
            type: keyword
            description: keyword indicating release times file name will follow
            removed: 6.6.0
          timesfile:
            type: string
            longname: file keyword
            description: name of the release times file.  RELEASE_TIMES and RELEASE_TIMESFILE are mutually
              exclusive.
            tagged: false
            removed: 6.6.0
            case_sensitive: true
      dry_tracking_method:
        type: string
        longname: what to do in dry-but-active cells
        description: is a string indicating how particles should behave in dry-but-active cells (as can
          occur with the Newton formulation).  The value can be 'DROP', 'STOP', or 'STAY'.  The default
          is 'DROP', which passes particles vertically and instantaneously to the water table. 'STOP'
          causes particles to terminate. 'STAY' causes particles to remain stationary but active.
        optional: true
        valid:
          - drop
          - stop
          - stay
      dev_forceternary:
        type: keyword
        longname: force ternary tracking method
        description: force use of the ternary tracking method regardless of cell type in DISV grids.
        developmode: true
      release_time_tolerance:
        type: double
        longname: release time coincidence tolerance
        description: real number indicating the tolerance within which to consider consecutive release
          times coincident. Coincident release times will be merged into a single release time. The default
          is $epsilon times 10^{11}$, where $epsilon$ is machine precision.
        optional: true
      release_time_frequency:
        type: double
        longname: release time frequency
        description: real number indicating the time frequency at which to release particles. This option
          can be used to schedule releases at a regular interval for the duration of the simulation, starting
          at the simulation start time. The release schedule is the union of this option, the RELEASETIMES
          block, and PERIOD block RELEASESETTING selections. If none of these are provided, a single release
          time is configured at the beginning of the first time step of the simulation's first stress
          period.
        optional: true
      coordinate_check_method:
        type: string
        longname: coordinate checking method
        description: approach for verifying that release point coordinates are in the cell with the specified
          ID. Possible values are NONE and EAGER. By default, release point coordinates are checked at
          release time, i.e. EAGER.
        optional: true
        default: eager
        valid:
          - none
          - eager
      dev_cycle_detection_window:
        type: integer
        longname: cycle detection window size
        description: integer value defining the size of the window (number of consecutive exit events)
          used for cycle detection. Defaults to 0, disabling cycle detection. With detection enabled,
          particle pathlines with duplicate cell exit events (i.e., exiting the same cell through the
          same face twice) will cause the program to terminate with an error. A larger window size provides
          more robust cycle detection at the cost of more runtime operations per cell exit.
        optional: true
        developmode: true
  dimensions:
    fields:
      nreleasepts:
        type: integer
        longname: number of particle release points
        description: is the number of particle release points.
      nreleasetimes:
        type: integer
        longname: number of particle release times
        description: is the number of particle release times specified in the RELEASETIMES block. This
          is not necessarily the total number of release times; release times are the union of RELEASE_TIME_FREQUENCY,
          RELEASETIMES block, and PERIOD block RELEASESETTING selections.
  packagedata:
    fields:
      packagedata:
        type: list
        item:
          type: record
          fields:
            irptno:
              type: integer
              longname: PRP id number for release point
              description: integer value that defines the PRP release point number associated with the
                specified PACKAGEDATA data on the line. IRPTNO must be greater than zero and less than
                or equal to NRELEASEPTS.  The program will terminate with an error if information for
                a PRP release point number is specified more than once.
              tagged: false
              index: true
              pk: true
            cellid:
              type: array
              longname: cell identifier
              description: is the cell identifier, and depends on the type of grid that is used for the
                simulation.  For a structured grid that uses the DIS input file, CELLID is the layer,
                row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D
                number.  If the model uses the unstructured discretization (DISU) input file, CELLID is
                the node number for the cell.
              tagged: false
              dtype: integer
              shape:
                - ncelldim
            xrpt:
              type: double
              longname: x coordinate of release point
              description: real value that defines the x coordinate of the release point in model coordinates.  The
                (x, y, z) location specified for the release point must lie within the cell that is identified
                by the specified cellid.
              tagged: false
            yrpt:
              type: double
              longname: y coordinate of release point
              description: real value that defines the y coordinate of the release point in model coordinates.  The
                (x, y, z) location specified for the release point must lie within the cell that is identified
                by the specified cellid.
              tagged: false
            zrpt:
              type: double
              longname: z coordinate of release point
              description: real value that defines the z coordinate of the release point in model coordinates
                or, if the LOCAL_Z option is active, in local cell coordinates.  The (x, y, z) location
                specified for the release point must lie within the cell that is identified by the specified
                cellid.
              tagged: false
            boundname:
              type: string
              longname: release point name
              description: name of the particle release point. BOUNDNAME is an ASCII character variable
                that can contain as many as 40 characters. If BOUNDNAME contains spaces in it, then the
                entire name must be enclosed within single quotes.
              optional: true
              tagged: false
        shape:
          - nreleasepts
  releasetimes:
    fields:
      releasetimes:
        type: list
        optional: true
        item:
          type: record
          fields:
            time:
              type: double
              longname: release time
              description: real value that defines the release time with respect to the simulation start
                time.
              tagged: false
        shape:
          - nreleasetimes
  period:
    fields:
      perioddata:
        type: list
        item:
          type: union
          description: specifies time steps at which to release a particle. A particle is released at
            the beginning of each specified time step. For fine control over release timing, specify times
            explicitly using the RELEASETIMES block. If the beginning of a specified time step coincides
            with a release time specified in the RELEASETIMES block or configured via RELEASE_TIME_FREQUENCY,
            only one particle is released at that time. Coincidence is evaluated up to the tolerance specified
            in RELEASE_TIME_TOLERANCE, or $epsilon times 10^{11}$ by default, where $epsilon$ is machine
            precision. If no release times are configured via this setting, the RELEASETIMES block, or
            the RELEASE_TIME_FREQUENCY option, a single release time is configured at the beginning of
            the first time step of the simulation's first stress period.
          arms:
            all:
              type: keyword
              description: keyword to indicate release at the start of all time steps in the period.
            first:
              type: keyword
              description: keyword to indicate release at the start of the first time step in the period.
                This keyword may be used in conjunction with other RELEASESETTING options.
            last:
              type: keyword
              description: keyword to indicate release at the start of the last time step in the period.
                This keyword may be used in conjunction with other RELEASESETTING options.
            frequency:
              type: integer
              description: release at the specified time step frequency. This keyword may be used in conjunction
                with other RELEASESETTING options.
            steps:
              type: array
              description: release at the start of each step specified in STEPS. This option may be used
                in conjunction with other RELEASESETTING options.
              dtype: integer
            fraction:
              type: array
              description: 'release particles after the specified fraction of the time step has elapsed.
                If FRACTION is not set, particles are released at the start of the specified time step(s).
                FRACTION must be a single value when used with ALL, FIRST, or FREQUENCY. When used with
                STEPS, FRACTION may be a single value or an array of the same length as STEPS. If a single
                FRACTION value is provided with STEPS, the fraction applies to all steps. NOTE: The FRACTION
                option has been removed. For fine control over release timing, specify times explicitly
                using the RELEASETIMES block.'
              optional: true
              removed: 6.6.0
              dtype: double
    header:
      fill_forward: true
      field:
        name: iper
        type: integer
        longname: stress period number
        description: integer value specifying the stress period number for which the data specified in
          the PERIOD block apply. IPER must be less than or equal to NPER in the TDIS Package and greater
          than zero. The IPER value assigned to a stress period block must be greater than the IPER value
          assigned for the previous PERIOD block. The information specified in the PERIOD block applies
          only to that stress period.
        tagged: false
memory:
  iprpak:
    set_in: ar
    source: print_input
    type: integer
  iexmeth:
    set_in: ar
    source: dev_exit_solve_method
    type: integer
  extol:
    set_in: ar
    source: exit_solve_tolerance
    type: double
  localz:
    set_in: ar
    source: local_z
    type: logical
  extend:
    set_in: ar
    source: extend_tracking
    type: logical
  istopweaksink:
    set_in: ar
    source: stop_at_weak_sink
    type: integer
  release_timesfn:
    set_in: ar
    source: release_timesfile
    type: logical
  idrymeth:
    set_in: ar
    source: dry_tracking_method
    type: string
  frctrn:
    set_in: ar
    source: dev_forceternary
    type: logical
  rttol:
    set_in: ar
    source: release_time_tolerance
    type: double
  rtfreq:
    set_in: ar
    source: release_time_frequency
    type: double
  ichkmeth:
    set_in: ar
    source: coordinate_check_method
    type: string
  icycwin:
    set_in: ar
    source: dev_cycle_detection_window
    type: integer
  nreleasepts:
    set_in: ar
    source: nreleasepts
    type: integer
  nreleasetimes:
    set_in: ar
    source: nreleasetimes
    type: integer
  ipakcb:
    set_in: ar
    description: Flag controlling whether boundary flows are written to the budget file.
    type: integer
  maxbound:
    readonly: true
    set_in: ar
    description: Maximum number of boundary entries per stress period.
    type: integer
  nbound:
    set_in: rp
    description: Number of active boundaries for the current stress period.
    type: integer
  ncolbnd:
    readonly: true
    set_in: ar
    description: Number of columns in BOUND.
    type: integer
  nodelist:
    type: array
    set_in: rp
    source: cellid
    description: Reduced node number for each active boundary, derived from CELLID.
    dtype: integer
    shape:
      - nbound
  bound:
    type: array
    set_in: rp
    description: Boundary data for the current stress period.
    dtype: double
    shape:
      - ncolbnd
      - nbound
  hcof:
    type: array
    readonly: true
    set_in: fc
    description: Diagonal coefficient contribution to the system matrix.
    dtype: double
    shape:
      - nbound
  rhs:
    type: array
    readonly: true
    set_in: fc
    description: Right-hand-side contribution to the system matrix.
    dtype: double
    shape:
      - nbound
  simvals:
    type: array
    readonly: true
    set_in: cq
    description: Simulated boundary flow values for the current time step.
    budget: PRP
    output: true
    obs_type: PRP
    dtype: double
    shape:
      - nbound
  simtomvr:
    type: array
    readonly: true
    set_in: cq
    description: Flow diverted to the Water Mover for each boundary.
    budget: PRP-TO-MVR
    output: true
    dtype: double
    shape:
      - nbound
  naux:
    readonly: true
    set_in: ar
    description: Number of auxiliary variables.
    type: integer
  auxname_cst:
    type: array
    readonly: true
    set_in: ar
    description: Names of auxiliary variables.
    dtype: string
    shape:
      - naux
  auxvar:
    type: array
    description: Auxiliary variable values for each boundary.
    dtype: double
    set_in:
      - rp
      - ad
    shape:
      - naux
      - nbound
