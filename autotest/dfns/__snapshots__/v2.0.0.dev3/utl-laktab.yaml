type: package
schema_version: 2.0.0.dev3
name: utl-laktab
parent: sim-nam
multi: true
subtype: utility
dims:
  nrow:
    value: nrow
  ncol:
    value: ncol
blocks:
  dimensions:
    fields:
      nrow:
        type: integer
        longname: number of table rows
        description: integer value specifying the number of rows in the lake table. There must be NROW
          rows of data in the TABLE block.
      ncol:
        type: integer
        longname: number of table columns
        description: integer value specifying the number of columns in the lake table. There must be NCOL
          columns of data in the TABLE block. For lakes with HORIZONTAL and/or VERTICAL CTYPE connections,
          NCOL must be equal to 3. For lakes with EMBEDDEDH or EMBEDDEDV CTYPE connections, NCOL must
          be equal to 4.
  table:
    fields:
      table:
        type: list
        item:
          type: record
          fields:
            stage:
              type: double
              longname: lake stage
              description: real value that defines the stage corresponding to the remaining data on the
                line.
              tagged: false
            volume:
              type: double
              longname: lake volume
              description: real value that defines the lake volume corresponding to the stage specified
                on the line.
              tagged: false
            sarea:
              type: double
              longname: lake surface area
              description: real value that defines the lake surface area corresponding to the stage specified
                on the line.
              tagged: false
            barea:
              type: double
              longname: lake-GWF exchange area
              description: real value that defines the lake-GWF exchange area corresponding to the stage
                specified on the line. BAREA is only specified if the CLAKTYPE for the lake is EMBEDDEDH
                or EMBEDDEDV.
              optional: true
              tagged: false
        shape:
          - nrow
memory:
  nrow:
    set_in: ar
    source: nrow
    type: integer
  ncol:
    set_in: ar
    source: ncol
    type: integer
