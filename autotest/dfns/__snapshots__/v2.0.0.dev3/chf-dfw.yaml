type: package
schema_version: 2.0.0.dev3
name: chf-dfw
parent: chf-nam
ftype: DFW6
runtime_dims:
  nodes:
    set_in: ar
blocks:
  options:
    fields:
      central_in_space:
        type: keyword
        longname: use central in space weighting
        description: keyword to indicate conductance should be calculated using central-in-space weighting
          instead of the default upstream weighting approach.  This option should be used with caution
          as it does not work well unless all of the stream reaches are saturated.  With this option,
          there is no way for water to flow into a dry reach from connected reaches.
        optional: true
      length_conversion:
        type: double
        longname: length conversion factor
        description: real value that is used to convert user-specified Manning's roughness coefficients
          from meters to model length units. LENGTH_CONVERSION should be set to 3.28081, 1.0, and 100.0
          when using length units (LENGTH_UNITS) of feet, meters, or centimeters in the simulation, respectively.
          LENGTH_CONVERSION does not need to be specified if LENGTH_UNITS are meters.
        optional: true
      time_conversion:
        type: double
        longname: time conversion factor
        description: real value that is used to convert user-specified Manning's roughness coefficients
          from seconds to model time units. TIME_CONVERSION should be set to 1.0, 60.0, 3,600.0, 86,400.0,
          and 31,557,600.0 when using time units (TIME_UNITS) of seconds, minutes, hours, days, or years
          in the simulation, respectively. TIME_CONVERSION does not need to be specified if TIME_UNITS
          are seconds.
        optional: true
      save_flows:
        type: keyword
        longname: keyword to save DFW flows
        description: keyword to indicate that budget flow terms will be written to the file specified
          with 'BUDGET SAVE FILE' in Output Control.
        optional: true
      print_flows:
        type: keyword
        longname: keyword to print DFW flows to listing file
        description: keyword to indicate that calculated flows between cells will be printed to the listing
          file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.
          If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed
          for the last time step of each stress period.  This option can produce extremely large list
          files because all cell-by-cell flows are printed.  It should only be used with the DFW Package
          for models that have a small number of cells.
        optional: true
      save_velocity:
        type: keyword
        longname: keyword to save velocity
        description: keyword to indicate that x, y, and z components of velocity will be calculated at
          cell centers and written to the budget file, which is specified with 'BUDGET SAVE FILE' in Output
          Control.  If this option is activated, then additional information may be required in the discretization
          packages and the GWF Exchange package (if GWF models are coupled).  Specifically, ANGLDEGX must
          be specified in the CONNECTIONDATA block of the DISU Package; ANGLDEGX must also be specified
          for the GWF Exchange as an auxiliary variable.
        optional: true
      obs_filerecord:
        type: record
        optional: true
        fields:
          obs6:
            type: keyword
            longname: obs keyword
            description: keyword to specify that record corresponds to an observations file.
          obs6_filename:
            type: file
            longname: obs6 input filename
            description: name of input file to define observations for the DFW package. See the 'Observation
              utility' section for instructions for preparing observation input files. Table {#2} lists
              observation type(s) supported by the DFW package.
            tagged: false
            direction: in
            component: utl-obs
      export_array_ascii:
        type: keyword
        longname: export array variables to layered ascii files.
        description: keyword that specifies input griddata arrays should be written to layered ascii output
          files.
        optional: true
      dev_swr_conductance:
        type: keyword
        longname: use SWR conductance formulation
        description: use the conductance formulation in the Surface Water Routing (SWR) Process for MODFLOW-2005.
        optional: true
        developmode: true
  griddata:
    fields:
      manningsn:
        type: array
        longname: mannings roughness coefficient
        description: mannings roughness coefficient
        optional: true
        dtype: double
        shape:
          - nodes
      idcxs:
        type: array
        longname: cross section number
        description: integer value indication the cross section identifier in the Cross Section Package
          that applies to the reach.  If not provided then reach will be treated as hydraulically wide.
        optional: true
        dtype: integer
        index: true
        fk: chf-cxs.packagedata.idcxs
        shape:
          - nodes
memory:
  icentral:
    set_in: ar
    source: central_in_space
    type: integer
  lengthconv:
    set_in: ar
    source: length_conversion
    type: double
  timeconv:
    set_in: ar
    source: time_conversion
    type: double
  ipakcb:
    set_in: ar
    source: save_flows
    type: integer
  iprflow:
    set_in: ar
    source: print_flows
    type: integer
  isavvelocity:
    set_in: ar
    source: save_velocity
    type: integer
  export_ascii:
    set_in: ar
    source: export_array_ascii
    type: logical
  iswrcond:
    set_in: ar
    source: dev_swr_conductance
    type: integer
  manningsn:
    type: array
    set_in: ar
    source: manningsn
    dtype: double
    shape:
      - nodes
  idcxs:
    type: array
    set_in: ar
    source: idcxs
    dtype: integer
    shape:
      - nodes
observations:
  ext-outflow:
    type: integer
    tagged: false
    index: true
