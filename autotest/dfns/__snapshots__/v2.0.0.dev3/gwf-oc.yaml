type: package
schema_version: 2.0.0.dev3
name: gwf-oc
parent: gwf-nam
blocks:
  options:
    fields:
      budget_filerecord:
        type: record
        optional: true
        fields:
          budget:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to the budget.
          budgetfile:
            type: file
            longname: file keyword
            description: name of the output file to write budget information.
            tagged: false
            direction: out
      budgetcsv_filerecord:
        type: record
        optional: true
        fields:
          budgetcsv:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to the budget CSV.
          budgetcsvfile:
            type: file
            longname: file keyword
            description: name of the comma-separated value (CSV) output file to write budget summary information.  A
              budget summary record will be written to this file for each time step of the simulation.
            tagged: false
            direction: out
      head_filerecord:
        type: record
        optional: true
        fields:
          head:
            type: keyword
            longname: head keyword
            description: keyword to specify that record corresponds to head.
          headfile:
            type: file
            longname: file keyword
            description: name of the output file to write head information.
            tagged: false
            direction: out
      headprintrecord:
        type: record
        optional: true
        fields:
          head:
            type: keyword
            longname: head keyword
            description: keyword to specify that record corresponds to head.
          print_format:
            type: keyword
            longname: keyword to indicate that a print format follows
            description: keyword to specify format for printing to the listing file.
          formatrecord:
            type: record
            fields:
              columns:
                type: integer
                longname: number of columns
                description: number of columns for writing data.
                optional: true
              width:
                type: integer
                longname: width for each number
                description: width for writing each number.
                optional: true
              digits:
                type: integer
                longname: number of digits
                description: number of digits to use for writing a number.
                optional: true
              format:
                type: string
                longname: write format
                description: write format can be EXPONENTIAL, FIXED, GENERAL, or SCIENTIFIC.
                tagged: false
  period:
    fields:
      output:
        type: list
        optional: true
        item:
          type: union
          arms:
            saverecord:
              type: record
              optional: true
              fields:
                save:
                  type: keyword
                  longname: keyword to save
                  description: keyword to indicate that information will be saved this stress period.
                rtype:
                  type: string
                  longname: record type
                  description: type of information to save or print.  Can be BUDGET or HEAD.
                  tagged: false
                  valid:
                    - HEAD
                    - BUDGET
                ocsetting:
                  type: union
                  description: specifies the steps for which the data will be saved.
                  arms:
                    all:
                      type: keyword
                      description: keyword to indicate save for all time steps in period.
                    first:
                      type: keyword
                      description: keyword to indicate save for first step in period. This keyword may
                        be used in conjunction with other keywords to print or save results for multiple
                        time steps.
                    last:
                      type: keyword
                      description: keyword to indicate save for last step in period. This keyword may
                        be used in conjunction with other keywords to print or save results for multiple
                        time steps.
                    frequency:
                      type: integer
                      description: save at the specified time step frequency. This keyword may be used
                        in conjunction with other keywords to print or save results for multiple time
                        steps.
                    steps:
                      type: array
                      description: save for each step specified in STEPS. This keyword may be used in
                        conjunction with other keywords to print or save results for multiple time steps.
                      dtype: integer
            printrecord:
              type: record
              optional: true
              fields:
                print:
                  type: keyword
                  longname: keyword to save
                  description: keyword to indicate that information will be printed this stress period.
                rtype:
                  type: string
                  longname: record type
                  description: type of information to save or print.  Can be BUDGET or HEAD.
                  tagged: false
                  valid:
                    - HEAD
                    - BUDGET
                ocsetting:
                  type: union
                  description: specifies the steps for which the data will be saved.
                  arms:
                    all:
                      type: keyword
                      description: keyword to indicate save for all time steps in period.
                    first:
                      type: keyword
                      description: keyword to indicate save for first step in period. This keyword may
                        be used in conjunction with other keywords to print or save results for multiple
                        time steps.
                    last:
                      type: keyword
                      description: keyword to indicate save for last step in period. This keyword may
                        be used in conjunction with other keywords to print or save results for multiple
                        time steps.
                    frequency:
                      type: integer
                      description: save at the specified time step frequency. This keyword may be used
                        in conjunction with other keywords to print or save results for multiple time
                        steps.
                    steps:
                      type: array
                      description: save for each step specified in STEPS. This keyword may be used in
                        conjunction with other keywords to print or save results for multiple time steps.
                      dtype: integer
    header:
      fill_forward: true
      field:
        name: iper
        type: integer
        longname: stress period number
        description: integer value specifying the starting stress period number for which the data specified
          in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and
          greater than zero.  The IPER value assigned to a stress period block must be greater than the
          IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD
          block will continue to apply for all subsequent stress periods, unless the program encounters
          another PERIOD block.
        tagged: false
