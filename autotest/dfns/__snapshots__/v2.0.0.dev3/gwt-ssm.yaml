type: package
schema_version: 2.0.0.dev3
name: gwt-ssm
parent: gwt-nam
blocks:
  options:
    fields:
      print_flows:
        type: keyword
        longname: print calculated flows to listing file
        description: keyword to indicate that the list of SSM flow rates will be printed to the listing
          file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If
          there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed
          for the last time step of each stress period.
        optional: true
      save_flows:
        type: keyword
        longname: save calculated flows to budget file
        description: keyword to indicate that SSM flow terms will be written to the file specified with
          'BUDGET FILEOUT' in Output Control.
        optional: true
  sources:
    write_if_empty: true
    fields:
      sources:
        type: list
        longname: package list
        item:
          type: record
          fields:
            pname:
              type: string
              longname: package name
              description: name of the flow package for which an auxiliary variable contains a source
                concentration.  If this flow package is represented using an advanced transport package
                (SFT, LKT, MWT, or UZT), then the advanced transport package will override SSM terms specified
                here.
              tagged: false
            srctype:
              type: string
              longname: source type
              description: keyword indicating how concentration will be assigned for sources and sinks.  Keyword
                must be specified as either AUX or AUXMIXED.  For both options the user must provide an
                auxiliary variable in the corresponding flow package.  The auxiliary variable must have
                the same name as the AUXNAME value that follows.  If the AUX keyword is specified, then
                the auxiliary variable specified by the user will be assigned as the concentration value
                for groundwater sources (flows with a positive sign).  For negative flow rates (sinks),
                groundwater will be withdrawn from the cell at the simulated concentration of the cell.  The
                AUXMIXED option provides an alternative method for how to determine the concentration
                of sinks.  If the cell concentration is larger than the user-specified auxiliary concentration,
                then the concentration of groundwater withdrawn from the cell will be assigned as the
                user-specified concentration.  Alternatively, if the user-specified auxiliary concentration
                is larger than the cell concentration, then groundwater will be withdrawn at the cell
                concentration.  Thus, the AUXMIXED option is designed to work with the Evapotranspiration
                (EVT) and Recharge (RCH) Packages where water may be withdrawn at a concentration that
                is less than the cell concentration.
              tagged: false
            auxname:
              type: string
              longname: auxiliary variable name
              description: name of the auxiliary variable in the package PNAME.  This auxiliary variable
                must exist and be specified by the user in that package.  The values in this auxiliary
                variable will be used to set the concentration associated with the flows for that boundary
                package.
              tagged: false
  fileinput:
    fields:
      fileinput:
        type: list
        optional: true
        item:
          type: record
          fields:
            pname:
              type: string
              longname: package name
              description: name of the flow package for which an SPC6 input file contains a source concentration.  If
                this flow package is represented using an advanced transport package (SFT, LKT, MWT, or
                UZT), then the advanced transport package will override SSM terms specified here.
              tagged: false
            spc6:
              type: keyword
              longname: head keyword
              description: keyword to specify that record corresponds to a source sink mixing input file.
            filein:
              type: keyword
              longname: file keyword
              description: keyword to specify that an input filename is expected next.
            spc6_filename:
              type: string
              longname: spc file name
              description: character string that defines the path and filename for the file containing
                source and sink input data for the flow package. The SPC6_FILENAME file is a flexible
                input file that allows concentrations to be specified by stress period and with time series.
                Instructions for creating the SPC6_FILENAME input file are provided in the next section
                on file input for boundary concentrations.
              tagged: false
              case_sensitive: true
            mixed:
              type: keyword
              longname: mixed keyword
              description: keyword to specify that these stress package boundaries will have the mixed
                condition.  The MIXED condition is described in the SOURCES block for AUXMIXED.  The MIXED
                condition allows for water to be withdrawn at a concentration that is less than the cell
                concentration.  It is intended primarily for representing evapotranspiration.
              optional: true
memory:
  pname_sources:
    source: pname
    type: string
