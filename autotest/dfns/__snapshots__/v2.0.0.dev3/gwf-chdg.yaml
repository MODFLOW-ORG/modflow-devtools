type: package
schema_version: 2.0.0.dev3
name: gwf-chdg
parent: gwf-nam
multi: true
subtype: stress
dims:
  auxiliary:
    value: len(auxiliary)
  naux:
    value: len(auxiliary)
runtime_dims:
  nbound:
    set_in: rp
  ncolbnd:
    set_in: ar
blocks:
  options:
    fields:
      readarraygrid:
        type: keyword
        longname: use array-based grid input
        description: indicates that array-based grid input will be used for the constant head package.  This
          keyword must be specified to use array-based grid input.  When READARRAYGRID is specified, values
          must be provided for every cell within a model grid, even those cells that have an IDOMAIN value
          less than one.  Values assigned to cells with IDOMAIN values less than one are not used and
          have no effect on simulation results. No data cells should contain the value DNODATA (3.0E+30).
        default: true
        developmode: true
      auxiliary:
        type: array
        longname: keyword to specify aux variables
        description: defines an array of one or more auxiliary variable names.  There is no limit on the
          number of auxiliary variables that can be provided on this line; however, lists of information
          provided in subsequent blocks must have a column of data for each auxiliary variable name defined
          here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
          cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
          variables may not be used by the package, but they will be available for use by other parts
          of the program.  The program will terminate with an error if auxiliary variables are specified
          on more than one line in the options block.
        optional: true
        dtype: string
      auxmultname:
        type: string
        longname: name of auxiliary variable for multiplier
        description: name of auxiliary variable to be used as multiplier of CHD head value.
        optional: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to indicate that the list of constant-head information will be written to
          the listing file immediately after it is read.
        optional: true
      print_flows:
        type: keyword
        longname: print CHD flows to listing file
        description: keyword to indicate that the list of constant-head flow rates will be printed to
          the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output
          Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates
          are printed for the last time step of each stress period.
        optional: true
      save_flows:
        type: keyword
        longname: save CHD flows to budget file
        description: keyword to indicate that constant-head flow terms will be written to the file specified
          with 'BUDGET FILEOUT' in Output Control.
        optional: true
      obs_filerecord:
        type: record
        optional: true
        fields:
          obs6:
            type: keyword
            longname: obs keyword
            description: keyword to specify that record corresponds to an observations file.
          obs6_filename:
            type: file
            longname: obs6 input filename
            description: name of input file to define observations for the CHD package. See the 'Observation
              utility' section for instructions for preparing observation input files. Table {#2} lists
              observation type(s) supported by the CHD package.
            tagged: false
            direction: in
      export_array_netcdf:
        type: keyword
        longname: export array variables to netcdf output files.
        description: keyword that specifies input gridded arrays should be written to the model output
          NetCDF file with attributes that support using the generated file as a MODFLOW 6 simulation
          input.  This option only has an effect when an output model NetCDF file is configured and the
          simulation is run in VALIDATE mode, otherwise it is ignored.
        optional: true
      dev_no_newton:
        type: keyword
        longname: turn off Newton for unconfined cells
        description: turn off Newton for unconfined cells
        optional: true
        developmode: true
  dimensions:
    fields: {}
  period:
    fields:
      head:
        type: array
        longname: head value assigned to constant head
        description: is the head at the boundary.
        default: 3.0e+30
        netcdf: true
        dtype: double
        layered: true
        shape:
          - nodes
      aux:
        type: array
        longname: constant head auxiliary variable iaux
        description: is an array of values for auxiliary variable aux(iaux), where iaux is a value from
          1 to naux, and aux(iaux) must be listed as part of the auxiliary variables.  A separate array
          can be specified for each auxiliary variable. If the value specified here for the auxiliary
          variable is the same as auxmultname, then the head array will be multiplied by this array.
        optional: true
        netcdf: true
        dtype: double
        layered: true
        shape:
          - nodes
    header:
      name: iper
      type: integer
      longname: stress period number
      description: integer value specifying the starting stress period number for which the data specified
        in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and greater
        than zero.  The IPER value assigned to a stress period block must be greater than the IPER value
        assigned for the previous PERIOD block.  The information specified in the PERIOD block will continue
        to apply for all subsequent stress periods, unless the program encounters another PERIOD block.
      tagged: false
memory:
  iprpak:
    set_in: ar
    source: print_input
    type: integer
  iprflow:
    set_in: ar
    source: print_flows
    type: integer
  ipakcb:
    set_in: ar
    source: save_flows
    description: Flag controlling whether boundary flows are written to the budget file.
    type: integer
  export_nc:
    set_in: ar
    source: export_array_netcdf
    type: logical
  inewton:
    set_in: ar
    source: dev_no_newton
    type: integer
  auxvar:
    type: array
    source: aux
    description: Auxiliary variable values for each boundary.
    dtype: double
    set_in:
      - rp
      - ad
    shape:
      - naux
      - nbound
  maxbound:
    readonly: true
    set_in: ar
    description: Maximum number of boundary entries per stress period.
    type: integer
  nbound:
    set_in: rp
    description: Number of active boundaries for the current stress period.
    type: integer
  ncolbnd:
    readonly: true
    set_in: ar
    description: Number of columns in BOUND.
    type: integer
  nodelist:
    type: array
    set_in: rp
    description: Reduced node number for each active boundary, derived from CELLID.
    dtype: integer
    shape:
      - nbound
  bound:
    type: array
    set_in: rp
    description: Boundary data for the current stress period.
    dtype: double
    shape:
      - ncolbnd
      - nbound
  hcof:
    type: array
    readonly: true
    set_in: fc
    description: Diagonal coefficient contribution to the system matrix.
    dtype: double
    shape:
      - nbound
  rhs:
    type: array
    readonly: true
    set_in: fc
    description: Right-hand-side contribution to the system matrix.
    dtype: double
    shape:
      - nbound
  simvals:
    type: array
    readonly: true
    set_in: cq
    description: Simulated boundary flow values for the current time step.
    budget: CHD
    output: true
    obs_type: CHD
    dtype: double
    shape:
      - nbound
  simtomvr:
    type: array
    readonly: true
    set_in: cq
    description: Flow diverted to the Water Mover for each boundary.
    dtype: double
    shape:
      - nbound
  naux:
    readonly: true
    set_in: ar
    description: Number of auxiliary variables.
    type: integer
  auxname_cst:
    type: array
    readonly: true
    set_in: ar
    description: Names of auxiliary variables.
    dtype: string
    shape:
      - naux
