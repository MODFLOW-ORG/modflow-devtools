type: package
schema_version: 2.0.0.dev3
name: prt-disv
parent: prt-nam
ftype: DISV6
dims:
  nlay:
    value: nlay
    scope: model
  ncpl:
    value: ncpl
    scope: model
  nvert:
    value: nvert
    scope: model
  nodes:
    value: nlay * ncpl
    scope: model
  ncelldim:
    value: '2'
    scope: model
runtime_dims:
  nodes:
    set_in: ar
  nodesuser:
    set_in: ar
blocks:
  options:
    fields:
      length_units:
        type: string
        longname: model length units
        description: is the length units used for this model.  Values can be 'FEET', 'METERS', or 'CENTIMETERS'.  If
          not specified, the default is 'UNKNOWN'.
        optional: true
      nogrb:
        type: keyword
        longname: do not write binary grid file
        description: keyword to deactivate writing of the binary grid file.
        optional: true
      grb_filerecord:
        type: record
        optional: true
        fields:
          grb6:
            type: keyword
            longname: grb keyword
            description: keyword to specify that record corresponds to a binary grid file.
          grb6_filename:
            type: file
            longname: file name of GRB information
            description: defines a binary grid output file.
            tagged: false
            direction: out
      xorigin:
        type: double
        longname: x-position origin of the model grid coordinate system
        description: x-position of the origin used for model grid vertices.  This value should be provided
          in a real-world coordinate system.  A default value of zero is assigned if not specified.  The
          value for XORIGIN does not affect the model simulation, but it is written to the binary grid
          file so that postprocessors can locate the grid in space.
        optional: true
      yorigin:
        type: double
        longname: y-position origin of the model grid coordinate system
        description: y-position of the origin used for model grid vertices.  This value should be provided
          in a real-world coordinate system.  If not specified, then a default value equal to zero is
          used.  The value for YORIGIN does not affect the model simulation, but it is written to the
          binary grid file so that postprocessors can locate the grid in space.
        optional: true
      angrot:
        type: double
        longname: rotation angle
        description: counter-clockwise rotation angle (in degrees) of the model grid coordinate system
          relative to a real-world coordinate system.  If not specified, then a default value of 0.0 is
          assigned.  The value for ANGROT does not affect the model simulation, but it is written to the
          binary grid file so that postprocessors can locate the grid in space.
        optional: true
      export_array_ascii:
        type: keyword
        longname: export array variables to layered ascii files.
        description: keyword that specifies input griddata arrays should be written to layered ascii output
          files.
        optional: true
      export_array_netcdf:
        type: keyword
        longname: export array variables to netcdf output files.
        description: keyword that specifies input gridded arrays should be written to the model output
          NetCDF file with attributes that support using the generated file as a MODFLOW 6 simulation
          input.  This option only has an effect when an output model NetCDF file is configured and the
          simulation is run in VALIDATE mode, otherwise it is ignored.
        optional: true
      crs:
        type: string
        longname: CRS user input string
        description: is a real-world coordinate reference system (CRS) for the model, for example, an
          EPSG integer code (e.g. 26915), authority string (i.e. epsg:26915), or Open Geospatial Consortium
          Well-Known Text (WKT) specification. Limited to 5000 characters. The entry for CRS does not
          affect the model simulation, but it is written to the binary grid file so that postprocessors
          can locate the grid in space.
        optional: true
        developmode: true
        case_sensitive: true
      ncf_filerecord:
        type: record
        optional: true
        fields:
          ncf6:
            type: keyword
            longname: ncf keyword
            description: keyword to specify that record corresponds to a NetCDF configuration (NCF) file.
          ncf6_filename:
            type: file
            longname: file name of NCF information
            description: defines a NetCDF configuration (NCF) input file.
            tagged: false
            direction: in
            component: utl-ncf
  dimensions:
    fields:
      nlay:
        type: integer
        longname: number of layers
        description: is the number of layers in the model grid.
      ncpl:
        type: integer
        longname: number of cells per layer
        description: is the number of cells per layer.  This is a constant value for the grid and it applies
          to all layers.
      nvert:
        type: integer
        longname: number of columns
        description: is the total number of (x, y) vertex pairs used to characterize the horizontal configuration
          of the model grid.
  griddata:
    fields:
      top:
        type: array
        longname: model top elevation
        description: is the top elevation for each cell in the top model layer.
        dtype: double
        shape:
          - ncpl
      botm:
        type: array
        longname: model bottom elevation
        description: is the bottom elevation for each cell.
        dtype: double
        layered: true
        shape:
          - ncpl
          - nlay
      idomain:
        type: array
        longname: idomain existence array
        description: is an optional array that characterizes the existence status of a cell.  If the IDOMAIN
          array is not specified, then all model cells exist within the solution.  If the IDOMAIN value
          for a cell is 0, the cell does not exist in the simulation.  Input and output values will be
          read and written for the cell, but internal to the program, the cell is excluded from the solution.  If
          the IDOMAIN value for a cell is 1, the cell exists in the simulation.  If the IDOMAIN value
          for a cell is -1, the cell does not exist in the simulation.  Furthermore, the first existing
          cell above will be connected to the first existing cell below.  This type of cell is referred
          to as a 'vertical pass through' cell.
        optional: true
        dtype: integer
        layered: true
        shape:
          - ncpl
          - nlay
  vertices:
    fields:
      vertices:
        type: list
        longname: vertices data
        item:
          name: vertices
          type: record
          fields:
            iv:
              type: integer
              longname: vertex number
              description: is the vertex number.  Records in the VERTICES block must be listed in consecutive
                order from 1 to NVERT.
              tagged: false
              index: true
              pk: true
            xv:
              type: double
              longname: x-coordinate for vertex
              description: is the x-coordinate for the vertex.
              tagged: false
            yv:
              type: double
              longname: y-coordinate for vertex
              description: is the y-coordinate for the vertex.
              tagged: false
        shape:
          - nvert
  cell2d:
    fields:
      cell2d:
        type: list
        longname: cell2d data
        item:
          name: cell2d
          type: record
          fields:
            icell2d:
              type: integer
              longname: cell2d number
              description: is the CELL2D number.  Records in the CELL2D block must be listed in consecutive
                order from the first to the last.
              tagged: false
              index: true
              pk: true
            xc:
              type: double
              longname: x-coordinate for cell center
              description: is the x-coordinate for the cell center.
              tagged: false
            yc:
              type: double
              longname: y-coordinate for cell center
              description: is the y-coordinate for the cell center.
              tagged: false
            ncvert:
              type: integer
              longname: number of cell vertices
              description: is the number of vertices required to define the cell.  There may be a different
                number of vertices for each cell.
              tagged: false
            icvert:
              type: array
              longname: array of vertex numbers
              description: is an array of integer values containing vertex numbers (in the VERTICES block)
                used to define the cell.  Vertices must be listed in clockwise order.  Cells that are
                connected must share vertices.
              tagged: false
              dtype: integer
              index: true
              shape:
                - ncvert
        shape:
          - ncpl
memory:
  export_ascii:
    set_in: ar
    source: export_array_ascii
    type: logical
  export_nc:
    set_in: ar
    source: export_array_netcdf
    type: logical
  nlay:
    set_in: ar
    source: nlay
    type: integer
  ncpl:
    set_in: ar
    source: ncpl
    type: integer
  nvert:
    set_in: ar
    source: nvert
    type: integer
  top:
    type: array
    set_in: ar
    source: top
    dtype: double
    shape:
      - ncpl
  botm:
    type: array
    set_in: ar
    source: botm
    dtype: double
    shape:
      - ncpl
      - nlay
  idomain:
    type: array
    set_in: ar
    source: idomain
    dtype: integer
    shape:
      - ncpl
      - nlay
  area:
    type: array
    readonly: true
    set_in: ar
    description: Horizontal cell area, computed from grid geometry.
    dtype: double
    shape:
      - ncpl
  nodeuser:
    type: array
    readonly: true
    set_in: ar
    description: Maps each packed (active-cell) node position to its full-grid user node number. Index
      map for the runtime 'nodes' dimension.
    dtype: integer
    shape:
      - nodes
  nodereduced:
    type: array
    readonly: true
    set_in: ar
    description: Maps each full-grid user node number to its packed (active-cell) node position, or a
      nonpositive sentinel if the cell is inactive.
    dtype: integer
    shape:
      - nodesuser
