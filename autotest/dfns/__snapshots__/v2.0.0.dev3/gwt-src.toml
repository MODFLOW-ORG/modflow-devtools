type = "package"
schema_version = "2.0.0.dev3"
name = "gwt-src"
parent = "gwt-nam"
multi = true
subtype = "stress"

[dims.maxbound]
value = "maxbound"
scope = "model"

[dims.auxiliary]
value = "len(auxiliary)"

[dims.naux]
value = "len(auxiliary)"

[runtime_dims.nbound]
set_in = "rp"

[runtime_dims.ncolbnd]
set_in = "ar"

[blocks.options.fields.auxiliary]
type = "array"
longname = "keyword to specify aux variables"
description = "defines an array of one or more auxiliary variable names.  There is no limit on the number of auxiliary variables that can be provided on this line; however, lists of information provided in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary variables may not be used by the package, but they will be available for use by other parts of the program.  The program will terminate with an error if auxiliary variables are specified on more than one line in the options block."
optional = true
dtype = "string"

[blocks.options.fields.auxmultname]
type = "string"
longname = "name of auxiliary variable for multiplier"
description = "name of auxiliary variable to be used as multiplier of mass loading rate."
optional = true

[blocks.options.fields.boundnames]
type = "keyword"
description = "keyword to indicate that boundary names may be provided with the list of mass source cells."
optional = true

[blocks.options.fields.print_input]
type = "keyword"
longname = "print input to listing file"
description = "keyword to indicate that the list of mass source information will be written to the listing file immediately after it is read."
optional = true

[blocks.options.fields.print_flows]
type = "keyword"
longname = "print calculated flows to listing file"
description = "keyword to indicate that the list of mass source flow rates will be printed to the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for the last time step of each stress period."
optional = true

[blocks.options.fields.save_flows]
type = "keyword"
longname = "save well flows to budget file"
description = "keyword to indicate that mass source flow terms will be written to the file specified with 'BUDGET FILEOUT' in Output Control."
optional = true

[blocks.options.fields.ts_filerecord]
type = "record"
optional = true

[blocks.options.fields.ts_filerecord.fields.ts6]
type = "keyword"
longname = "head keyword"
description = "keyword to specify that record corresponds to a time-series file."

[blocks.options.fields.ts_filerecord.fields.ts6_filename]
type = "file"
longname = "file name of time series information"
description = "defines a time-series file defining time series that can be used to assign time-varying values. See the 'Time-Variable Input' section for instructions on using the time-series capability."
tagged = false
direction = "in"

[blocks.options.fields.obs_filerecord]
type = "record"
optional = true

[blocks.options.fields.obs_filerecord.fields.obs6]
type = "keyword"
longname = "obs keyword"
description = "keyword to specify that record corresponds to an observations file."

[blocks.options.fields.obs_filerecord.fields.obs6_filename]
type = "file"
longname = "obs6 input filename"
description = "name of input file to define observations for the SRC package. See the 'Observation utility' section for instructions for preparing observation input files. Table {#2} lists observation type(s) supported by the SRC package."
tagged = false
direction = "in"

[blocks.options.fields.highest_saturated]
type = "keyword"
longname = "apply source to highest saturated cell"
description = "Apply mass source loading rate to specified CELLID or highest underlying cell with a cell saturation greater than zero. The highest_saturated option has an additional complication for certain types of grids specified using the DISU Package. When the DISU Package is used, a cell may have more than one cell underlying it. If the overlying cell were to become inactive, there is no straightforward method for determining how to apportion the mass source loading rate to the underlying cells. In this case, the approach described by cite{modflowusg} is used. The mass source loading rate is assigned to the first active cell encountered (determined by searching through the underlying cell numbers from the lowest number to the highest number). In this manner, the total mass source loading rate is conserved; however, the spatial distribution of the applied mass source loading rate may not be maintained as layers become dry or wet during a simulation."
optional = true

[blocks.dimensions.fields.maxbound]
type = "integer"
longname = "maximum number of sources"
description = "integer value specifying the maximum number of sources cells that will be specified for use during any stress period."

[blocks.period.fields.stress_period_data]
type = "list"
shape = [
    "maxbound",
]

[blocks.period.fields.stress_period_data.item]
type = "record"

[blocks.period.fields.stress_period_data.item.fields.cellid]
type = "array"
longname = "cell identifier"
description = "is the cell identifier, and depends on the type of grid that is used for the simulation.  For a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model uses the unstructured discretization (DISU) input file, CELLID is the node number for the cell."
tagged = false
dtype = "integer"
shape = [
    "ncelldim",
]

[blocks.period.fields.stress_period_data.item.fields.smassrate]
type = "double"
longname = "mass source loading rate"
description = "is the mass source loading rate. A positive value indicates addition of solute mass and a negative value indicates removal of solute mass. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
tagged = false
time_series = true

[blocks.period.fields.stress_period_data.item.fields.aux]
type = "array"
longname = "auxiliary variables"
description = "represents the values of the auxiliary variables for each mass source. The values of auxiliary variables must be present for each mass source. The values must be specified in the order of the auxiliary variables specified in the OPTIONS block.  If the package supports time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
optional = true
tagged = false
dtype = "double"
time_series = true
shape = [
    "auxiliary",
]

[blocks.period.fields.stress_period_data.item.fields.boundname]
type = "string"
longname = "well name"
description = "name of the mass source cell.  BOUNDNAME is an ASCII character variable that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be enclosed within single quotes."
optional = true
tagged = false

[blocks.period.header]
fill_forward = true

[blocks.period.header.field]
name = "iper"
type = "integer"
longname = "stress period number"
description = "integer value specifying the starting stress period number for which the data specified in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and greater than zero.  The IPER value assigned to a stress period block must be greater than the IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD block will continue to apply for all subsequent stress periods, unless the program encounters another PERIOD block."
tagged = false

[memory.iprpak]
set_in = "ar"
source = "print_input"
type = "integer"

[memory.iprflow]
set_in = "ar"
source = "print_flows"
type = "integer"

[memory.ipakcb]
set_in = "ar"
source = "save_flows"
description = "Flag controlling whether boundary flows are written to the budget file."
type = "integer"

[memory.highest_sat]
set_in = "ar"
source = "highest_saturated"
type = "logical"

[memory.auxvar]
type = "array"
source = "aux"
description = "Auxiliary variable values for each boundary."
dtype = "double"
set_in = [
    "rp",
    "ad",
]
shape = [
    "naux",
    "nbound",
]

[memory.maxbound]
readonly = true
set_in = "ar"
description = "Maximum number of boundary entries per stress period."
type = "integer"

[memory.nbound]
set_in = "rp"
description = "Number of active boundaries for the current stress period."
type = "integer"

[memory.ncolbnd]
readonly = true
set_in = "ar"
description = "Number of columns in BOUND."
type = "integer"

[memory.nodelist]
type = "array"
set_in = "rp"
source = "cellid"
description = "Reduced node number for each active boundary, derived from CELLID."
dtype = "integer"
shape = [
    "nbound",
]

[memory.bound]
type = "array"
set_in = "rp"
description = "Boundary data for the current stress period. Columns (0-indexed): 0: smassrate."
dtype = "double"
shape = [
    "ncolbnd",
    "nbound",
]

[memory.hcof]
type = "array"
readonly = true
set_in = "fc"
description = "Diagonal coefficient contribution to the system matrix."
dtype = "double"
shape = [
    "nbound",
]

[memory.rhs]
type = "array"
readonly = true
set_in = "fc"
description = "Right-hand-side contribution to the system matrix."
dtype = "double"
shape = [
    "nbound",
]

[memory.simvals]
type = "array"
readonly = true
set_in = "cq"
description = "Simulated boundary flow values for the current time step."
budget = "SRC"
output = true
obs_type = "SRC"
dtype = "double"
shape = [
    "nbound",
]

[memory.simtomvr]
type = "array"
readonly = true
set_in = "cq"
description = "Flow diverted to the Water Mover for each boundary."
budget = "SRC-TO-MVR"
output = true
dtype = "double"
shape = [
    "nbound",
]

[memory.naux]
readonly = true
set_in = "ar"
description = "Number of auxiliary variables."
type = "integer"

[memory.auxname_cst]
type = "array"
readonly = true
set_in = "ar"
description = "Names of auxiliary variables."
dtype = "string"
shape = [
    "naux",
]
