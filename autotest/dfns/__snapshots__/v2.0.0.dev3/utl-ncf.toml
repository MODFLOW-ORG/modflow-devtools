type = "package"
schema_version = "2.0.0.dev3"
name = "utl-ncf"
ftype = "NCF6"
subtype = "utility"
parent = [
    "gwe-dis",
    "gwe-disv",
    "gwf-dis",
    "gwf-disv",
    "gwt-dis",
    "gwt-disv",
    "prt-dis",
    "prt-disv",
]

[dims.ncpl]
value = "ncpl"

[blocks.options.fields.wkt]
type = "string"
longname = "CRS well-known text (WKT1) string"
description = "is the coordinate reference system (CRS) well-known text string in WKT1 format (OGC 01-009). Written as the 'wkt' attribute on the projection variable. For supported projected CRS types, individual CF-standard numeric grid_mapping parameters are also written to the projection variable, for tools that read these directly rather than parsing 'wkt'/'crs_wkt' text. For a NETCDF_STRUCTURED export with a rotated grid (ANGROT not 0.0), WKT1 cannot represent the rotation; provide 'crs_wkt' instead for correct grid positioning. Ignored when latitude and longitude griddata arrays have been provided. To also embed the CRS in the binary grid file, provide the same string as the 'CRS' option in the discretization input; the discretization 'CRS' option additionally accepts other pyproj-compatible identifiers such as an EPSG code (e.g. 'EPSG:26918')."
optional = true
case_sensitive = true

[blocks.options.fields.crs_wkt]
type = "string"
longname = "CRS well-known text (WKT2) string"
description = "is the coordinate reference system (CRS) well-known text string in WKT2 format (ISO 19162:2019), as required by CF-1.13. Written as the 'crs_wkt' attribute on the projection variable. When omitted, the 'wkt' value is written to 'crs_wkt' as a compatibility alias. Ignored when latitude and longitude griddata arrays have been provided. To also embed the CRS in the binary grid file, provide the same string as the 'CRS' option in the discretization input; the discretization 'CRS' option additionally accepts other pyproj-compatible identifiers such as an EPSG code (e.g. 'EPSG:26918'). For a NETCDF_STRUCTURED export with a rotated grid (ANGROT not 0.0), a valid WKT2 PROJCRS string is required here to correctly position the grid: it is wrapped in a derived CRS that encodes the rotation, resolved by any CRS-aware consumer through ordinary reprojection; without it the 'x'/'y' coordinate values remain grid-local rather than real-world. For grid mappings transverse_mercator, lambert_conformal_conic (two-standard-parallel variant only), and albers_conical_equal_area, individual CF-standard numeric grid_mapping parameters (e.g. 'false_easting', 'scale_factor_at_central_meridian') are also written to the projection variable, for tools -- such as ArcGIS's classic NetCDF connector -- that read these directly rather than parsing 'wkt'/'crs_wkt' text."
optional = true
case_sensitive = true

[blocks.options.fields.deflate]
type = "integer"
longname = "variable compression deflate level"
description = "is the variable deflate level (0=min, 9=max) in the NetCDF file. Defining this parameter activates per-variable compression at the level specified. Use with the SHUFFLE option to also enable the shuffle filter."
optional = true

[blocks.options.fields.shuffle]
type = "keyword"
description = "is the keyword used to turn on the NetCDF variable shuffle filter when the deflate option is also set. The shuffle filter has the effect of storing the first byte of all of a variable's values in a chunk contiguously, followed by all the second bytes, etc. This can be an optimization for compression with certain types of data."
optional = true

[blocks.options.fields.chunk_time]
type = "integer"
longname = "chunking parameter for the time dimension"
description = "is the chunk size for the time dimension in a NETCDF_MESH2D or NETCDF_STRUCTURED output file. Must be used in combination with the chunk_face parameter (NETCDF_MESH2D) or the chunk_z, chunk_y, and chunk_x parameter set (NETCDF_STRUCTURED) to have an effect."
optional = true

[blocks.options.fields.chunk_face]
type = "integer"
longname = "chunking parameter for the mesh face dimension"
description = "is the chunk size for the face dimension in a NETCDF_MESH2D output file. Must be used in combination with the chunk_time parameter to have an effect."
optional = true

[blocks.options.fields.chunk_z]
type = "integer"
longname = "chunking parameter for the layer dimension"
description = "is the chunk size for the layer (vertical) dimension in a NETCDF_STRUCTURED output file. Must be used in combination with the chunk_time, chunk_x, and chunk_y parameters to have an effect."
optional = true

[blocks.options.fields.chunk_y]
type = "integer"
longname = "chunking parameter for structured y"
description = "is the chunk size for the y dimension in a NETCDF_STRUCTURED output file. Must be used in combination with the chunk_time, chunk_x, and chunk_z parameters to have an effect."
optional = true

[blocks.options.fields.chunk_x]
type = "integer"
longname = "chunking parameter for structured x"
description = "is the chunk size for the x dimension in a NETCDF_STRUCTURED output file. Must be used in combination with the chunk_time, chunk_y, and chunk_z parameters to have an effect."
optional = true

[blocks.options.fields.modflow6_attr_off]
type = "keyword"
description = "is the keyword used to turn off internal input tagging in the model NetCDF file. Tagging adds internal modflow 6 attribute(s) to variables which facilitate identification. Currently this applies to gridded arrays."
optional = true

[blocks.dimensions.fields.ncpl]
type = "integer"
longname = "number of cells in layer"
description = "is the number of cells in a projected plane layer."
optional = true

[blocks.griddata.fields.latitude]
type = "array"
longname = "cell center latitude"
description = "cell center latitude array. Only supported for NETCDF_STRUCTURED export type; ignored, with a warning, for NETCDF_MESH2D. Providing latitude and longitude arrays enables geographic-coordinate output for external tooling that requires it, and is the more reliable option for a grid with non-uniform row or column spacing, or a rotated grid, since some tools cannot otherwise correctly position such a grid from 'wkt'/'crs_wkt' alone. For other grids, 'wkt'/'crs_wkt' is the simpler choice. When latitude and longitude arrays are provided, any 'wkt' or 'crs_wkt' option values are ignored."
optional = true
dtype = "double"
shape = [
    "ncpl",
]

[blocks.griddata.fields.longitude]
type = "array"
longname = "cell center longitude"
description = "cell center longitude array. Only supported for NETCDF_STRUCTURED export type. See the latitude description for usage notes."
optional = true
dtype = "double"
shape = [
    "ncpl",
]

[memory.attr_off]
set_in = "ar"
source = "modflow6_attr_off"
type = "logical"

[memory.ncpl]
set_in = "ar"
source = "ncpl"
type = "integer"

[memory.latitude]
type = "array"
set_in = "ar"
source = "latitude"
dtype = "double"
shape = [
    "ncpl",
]

[memory.longitude]
type = "array"
set_in = "ar"
source = "longitude"
dtype = "double"
shape = [
    "ncpl",
]
