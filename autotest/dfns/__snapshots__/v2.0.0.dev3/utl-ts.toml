type = "package"
schema_version = "2.0.0.dev3"
name = "utl-ts"
parent = "sim-nam"
multi = true
subtype = "utility"

[dims.time_series_names]
value = "len(time_series_names)"

[blocks.attributes.fields.time_series_namerecord]
type = "record"
description = "xxx"

[blocks.attributes.fields.time_series_namerecord.fields.names]
type = "keyword"
description = "xxx"
