[blocks.attributes.fields.interpolation_method_single]
type = "string"
description = "Interpolation method, which is either STEPWISE or LINEAR."
tagged = false
valid = [
    "stepwise",
    "linear",
    "linearend",
]

[blocks.attributes.fields.sfacrecord]
type = "record"
description = "xxx"
optional = true

[blocks.attributes.fields.sfacrecord.fields.sfacs]
