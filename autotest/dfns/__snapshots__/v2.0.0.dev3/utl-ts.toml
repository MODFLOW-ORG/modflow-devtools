[blocks.attributes.fields.sfac]
type = "keyword"
description = " xxx"

[blocks.timeseries.fields.timeseries]
type = "list"
description = "xxx"

[blocks.timeseries.fields.timeseries.item]
type = "record"
description = "xxx"

[blocks.timeseries.fields.timeseries.item.fields.ts_time]
type = "double"
description = "A numeric time relative to the start of the simulation, in the time unit used in the simulation. Times must be strictly increasing."
