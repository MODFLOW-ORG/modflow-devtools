type = "package"
schema_version = "2.0.0.dev3"
name = "gwe-sfe"
parent = "gwe-nam"
multi = true
subtype = "advanced"

[dims.auxiliary]
value = "len(auxiliary)"

[runtime_dims.ncv]
set_in = "ar"

[blocks.options.fields.flow_package_name]
type = "string"
longname = "keyword to specify name of corresponding flow package"
description = "keyword to specify the name of the corresponding flow package.  If not specified, then the corresponding flow package must have the same name as this advanced transport package (the name associated with this package in the GWE name file)."
optional = true

[blocks.options.fields.auxiliary]
type = "array"
longname = "keyword to specify aux variables"
description = "defines an array of one or more auxiliary variable names.  There is no limit on the number of auxiliary variables that can be provided on this line; however, lists of information provided in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary variables may not be used by the package, but they will be available for use by other parts of the program.  The program will terminate with an error if auxiliary variables are specified on more than one line in the options block."
optional = true
dtype = "string"

[blocks.options.fields.flow_package_auxiliary_name]
type = "string"
longname = "keyword to specify name of temperature auxiliary variable in flow package"
description = "keyword to specify the name of an auxiliary variable provided in the corresponding flow package (i.e., FLOW_PACKAGE_NAME).  If specified, then the simulated temperatures from this advanced energy transport package will be copied into the auxiliary variable specified with this name.  Note that the flow package must have an auxiliary variable with this name or the program will terminate with an error.  If the flows for this advanced energy transport package are read from a file, then this option will have no effect."
optional = true

[blocks.options.fields.boundnames]
type = "keyword"
description = "keyword to indicate that boundary names may be provided with the list of reach cells."
optional = true

[blocks.options.fields.print_input]
type = "keyword"
longname = "print input to listing file"
description = "keyword to indicate that the list of reach information will be written to the listing file immediately after it is read."
optional = true

[blocks.options.fields.print_temperature]
type = "keyword"
longname = "print calculated temperature to listing file"
description = "keyword to indicate that the list of reach {#2} will be printed to the listing file for every stress period in which 'TEMPERATURE PRINT' is specified in Output Control.  If there is no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last time step of each stress period."
optional = true

[blocks.options.fields.print_flows]
type = "keyword"
longname = "print calculated flows to listing file"
description = "keyword to indicate that the list of reach flow rates will be printed to the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for the last time step of each stress period."
optional = true

[blocks.options.fields.save_flows]
type = "keyword"
longname = "save reach flows to budget file"
description = "keyword to indicate that reach flow terms will be written to the file specified with 'BUDGET FILEOUT' in Output Control."
optional = true

[blocks.options.fields.temperature_filerecord]
type = "record"
optional = true

[blocks.options.fields.temperature_filerecord.fields.temperature]
type = "keyword"
longname = "temperature keyword"
description = "keyword to specify that record corresponds to temperature."

[blocks.options.fields.temperature_filerecord.fields.tempfile]
type = "file"
longname = "file keyword"
description = "name of the binary output file to write temperature information."
tagged = false
direction = "out"

[blocks.options.fields.budget_filerecord]
type = "record"
optional = true

[blocks.options.fields.budget_filerecord.fields.budget]
type = "keyword"
longname = "budget keyword"
description = "keyword to specify that record corresponds to the budget."

[blocks.options.fields.budget_filerecord.fields.budgetfile]
type = "file"
longname = "file keyword"
description = "name of the binary output file to write budget information."
tagged = false
direction = "out"

[blocks.options.fields.budgetcsv_filerecord]
type = "record"
optional = true

[blocks.options.fields.budgetcsv_filerecord.fields.budgetcsv]
type = "keyword"
longname = "budget keyword"
description = "keyword to specify that record corresponds to the budget CSV."

[blocks.options.fields.budgetcsv_filerecord.fields.budgetcsvfile]
type = "file"
longname = "file keyword"
description = "name of the comma-separated value (CSV) output file to write budget summary information.  A budget summary record will be written to this file for each time step of the simulation."
tagged = false
direction = "out"

[blocks.options.fields.ts_filerecord]
type = "list"
optional = true

[blocks.options.fields.ts_filerecord.item]
type = "record"

[blocks.options.fields.ts_filerecord.item.fields.ts6]
type = "keyword"
longname = "head keyword"
description = "keyword to specify that record corresponds to a time-series file."

[blocks.options.fields.ts_filerecord.item.fields.ts6_filename]
type = "file"
longname = "file name of time series information"
description = "defines a time-series file defining time series that can be used to assign time-varying values. See the 'Time-Variable Input' section for instructions on using the time-series capability."
tagged = false
direction = "in"

[blocks.options.fields.obs_filerecord]
type = "record"
optional = true

[blocks.options.fields.obs_filerecord.fields.obs6]
type = "keyword"
longname = "obs keyword"
description = "keyword to specify that record corresponds to an observations file."

[blocks.options.fields.obs_filerecord.fields.obs6_filename]
type = "file"
longname = "obs6 input filename"
description = "name of input file to define observations for the SFE package. See the 'Observation utility' section for instructions for preparing observation input files. Table {#2} lists observation type(s) supported by the SFE package."
tagged = false
direction = "in"

[blocks.packagedata.fields.packagedata]
type = "list"

[blocks.packagedata.fields.packagedata.item]
type = "record"

[blocks.packagedata.fields.packagedata.item.fields.rno]
type = "integer"
longname = "reach number for this entry"
description = "integer value that defines the reach number associated with the specified PACKAGEDATA data on the line. RNO must be greater than zero and less than or equal to NREACHES. Reach information must be specified for every reach or the program will terminate with an error.  The program will also terminate with an error if information for a reach is specified more than once."
tagged = false
index = true
pk = true

[blocks.packagedata.fields.packagedata.item.fields.strt]
type = "double"
longname = "starting reach temperature"
description = "real value that defines the starting temperature for the reach."
tagged = false

[blocks.packagedata.fields.packagedata.item.fields.ktf]
type = "double"
longname = "boundary thermal conductivity"
description = "is the thermal conductivity of the material between the aquifer cell and the stream reach. The thickness of the material is defined by the variable RBTHCND."
tagged = false

[blocks.packagedata.fields.packagedata.item.fields.rbthcnd]
type = "double"
longname = "streambed thickness"
description = "real value that defines the thickness of the streambed material through which conduction occurs.  Must be greater than 0."
tagged = false

[blocks.packagedata.fields.packagedata.item.fields.aux]
type = "array"
longname = "auxiliary variables"
description = "represents the values of the auxiliary variables for each reach. The values of auxiliary variables must be present for each reach. The values must be specified in the order of the auxiliary variables specified in the OPTIONS block.  If the package supports time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
optional = true
tagged = false
dtype = "double"
time_series = true
shape = [
    "auxiliary",
]

[blocks.packagedata.fields.packagedata.item.fields.boundname]
type = "string"
longname = "well name"
description = "name of the reach cell.  BOUNDNAME is an ASCII character variable that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be enclosed within single quotes."
optional = true
tagged = false

[blocks.period.fields.reachperioddata]
type = "list"

[blocks.period.fields.reachperioddata.item]
type = "record"

[blocks.period.fields.reachperioddata.item.fields.rno]
type = "integer"
longname = "reach number for this entry"
description = "integer value that defines the reach number associated with the specified PERIOD data on the line. RNO must be greater than zero and less than or equal to NREACHES."
tagged = false
index = true
fk = "packagedata.rno"

[blocks.period.fields.reachperioddata.item.fields.reachsetting]
type = "union"
description = "line of information that is parsed into a keyword and values.  Keyword values that can be used to start the REACHSETTING string include: STATUS, TEMPERATURE, RAINFALL, EVAPORATION, RUNOFF, and AUXILIARY.  These settings are used to assign the temperature of associated with the corresponding flow terms.  Temperatures cannot be specified for all flow terms.  For example, the Streamflow Package supports a 'DIVERSION' flow term.  Diversion water will be routed using the calculated temperature of the reach."

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.status]
type = "string"
longname = "reach temperature status"
description = "keyword option to define reach status.  STATUS can be ACTIVE, INACTIVE, or CONSTANT. By default, STATUS is ACTIVE, which means that temperature will be calculated for the reach.  If a reach is inactive, then there will be no energy fluxes into or out of the reach and the inactive value will be written for the reach temperature.  If a reach is constant, then the temperature for the reach will be fixed at the user specified value."

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.temperature]
type = "string"
longname = "reach temperature"
description = "real or character value that defines the temperature for the reach. The specified TEMPERATURE is only applied if the reach is a constant temperature reach. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
time_series = true

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.rainfall]
type = "string"
longname = "rainfall temperature"
description = "real or character value that defines the rainfall temperature $(e.g.,:^{circ}C:or:^{circ}F)$ for the reach. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
time_series = true

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.evaporation]
type = "string"
longname = "evaporation temperature"
description = "use of the EVAPORATION keyword is allowed in the SFE package; however, the specified value is not currently used in SFE calculations.  Instead, the latent heat of evaporation is multiplied by the simulated evaporation rate for determining the thermal energy lost from a stream reach."
time_series = true

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.runoff]
type = "string"
longname = "runoff temperature"
description = "real or character value that defines the temperature of runoff $(e.g.,:^{circ}C:or:^{circ}F)$ for the reach.  Users are free to use whatever temperature scale they want, which might include negative temperatures.  If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
time_series = true

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.inflow]
type = "string"
longname = "inflow temperature"
description = "real or character value that defines the temperature of inflow $(e.g.,:^{circ}C:or:^{circ}F)$ for the reach. Users are free to use whatever temperature scale they want, which might include negative temperatures.  If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
time_series = true

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.auxiliaryrecord]
type = "record"

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.auxiliaryrecord.fields.auxiliary]
type = "keyword"
description = "keyword for specifying auxiliary variable."

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.auxiliaryrecord.fields.auxname]
type = "string"
description = "name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does not match one of the auxiliary variable names defined in the OPTIONS block the data are ignored."
tagged = false

[blocks.period.fields.reachperioddata.item.fields.reachsetting.arms.auxiliaryrecord.fields.auxval]
type = "double"
longname = "auxiliary variable value"
description = "value for the auxiliary variable. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
tagged = false
time_series = true

[blocks.period.header]
fill_forward = true

[blocks.period.header.field]
name = "iper"
type = "integer"
longname = "stress period number"
description = "integer value specifying the starting stress period number for which the data specified in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and greater than zero.  The IPER value assigned to a stress period block must be greater than the IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD block will continue to apply for all subsequent stress periods, unless the program encounters another PERIOD block."
tagged = false

[memory.ncv]
readonly = true
set_in = "ar"
description = "Number of control volumes. Assigned from the linked flow package during AR."
type = "integer"

[memory.strt]
type = "array"
set_in = "ar"
source = "strt"
description = "Starting temperature for each control volume."
dtype = "double"
shape = [
    "ncv",
]

[memory.xnewpak]
type = "array"
set_in = "ca"
description = "Current temperature for each control volume. Initialized from STRT during AR; updated by the solver at each Picard iteration (CA). API-written values serve as initial guesses and are overwritten by the solver."
dtype = "double"
shape = [
    "ncv",
]

[memory.xoldpak]
type = "array"
readonly = true
set_in = "ad"
description = "Temperature from the end of the previous time step. Copied from XNEWPAK at the start of advance (AD)."
dtype = "double"
shape = [
    "ncv",
]

[memory.ibound]
type = "array"
set_in = "ar"
description = "Boundary activity flag for each control volume."
dtype = "integer"
shape = [
    "ncv",
]

[memory.concfeat]
type = "array"
readonly = true
set_in = "cq"
description = "Computed temperature for each feature. Set from XNEWPAK after solver convergence."
dtype = "double"
shape = [
    "ncv",
]

[memory.qsto]
type = "array"
readonly = true
set_in = "cq"
description = "Storage temperature flow contribution for each control volume."
dtype = "double"
shape = [
    "ncv",
]

[memory.temprain]
type = "array"
set_in = "rp"
description = "Rainfall temperature for each reach."
dtype = "double"
shape = [
    "ncv",
]

[memory.tempevap]
type = "array"
set_in = "rp"
description = "Evaporation temperature for each reach."
dtype = "double"
shape = [
    "ncv",
]

[memory.temproff]
type = "array"
set_in = "rp"
description = "Runoff temperature for each reach."
dtype = "double"
shape = [
    "ncv",
]

[memory.tempiflw]
type = "array"
set_in = "rp"
description = "Inflow temperature for each reach."
dtype = "double"
shape = [
    "ncv",
]

[memory.vnew]
type = "array"
readonly = true
set_in = "cq"
description = "Reach water volume at the end of the current time step."
dtype = "double"
shape = [
    "ncv",
]

[memory.vold]
type = "array"
readonly = true
set_in = "ad"
description = "Reach water volume at the start of the current time step."
dtype = "double"
shape = [
    "ncv",
]

[memory.ktf]
type = "array"
set_in = "ar"
source = "ktf"
description = "Thermal conductivity of the streambed (E/T/L/Deg)."
dtype = "double"
shape = [
    "ncv",
]

[memory.rfeatthk]
type = "array"
set_in = "ar"
source = "rbthcnd"
description = "Thickness of the streambed conduction layer (L)."
dtype = "double"
shape = [
    "ncv",
]
