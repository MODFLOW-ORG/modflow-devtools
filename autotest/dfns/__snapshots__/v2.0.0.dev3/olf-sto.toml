type = "package"
schema_version = "2.0.0.dev3"
name = "olf-sto"
parent = "olf-nam"

[blocks.options.fields.save_flows]
type = "keyword"
longname = "keyword to save NPF flows"
description = "keyword to indicate that cell-by-cell flow terms will be written to the file specified with 'BUDGET SAVE FILE' in Output Control."
optional = true

[blocks.options.fields.export_array_ascii]
type = "keyword"
longname = "export array variables to layered ascii files."
description = "keyword that specifies input grid arrays, which already support the layered keyword, should be written to layered ascii output files."
optional = true

[blocks.period.fields.storage]
type = "string"
longname = "storage state"
description = "keyword to indicate that stress period IPER is steady-state. Steady-state conditions will apply until the TRANSIENT keyword is specified in a subsequent BEGIN PERIOD block."
optional = true
tagged = false
valid = [
    "steady-state",
    "transient",
]

[blocks.period.header]
fill_forward = true

[blocks.period.header.field]
name = "iper"
type = "integer"
longname = "stress period number"
description = "integer value specifying the starting stress period number for which the data specified in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and greater than zero.  The IPER value assigned to a stress period block must be greater than the IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD block will continue to apply for all subsequent stress periods, unless the program encounters another PERIOD block."
tagged = false

[memory.ipakcb]
set_in = "ar"
source = "save_flows"
type = "integer"

[memory.export_ascii]
set_in = "ar"
source = "export_array_ascii"
type = "logical"

[memory.steady_state]
set_in = "rp"
type = "logical"
