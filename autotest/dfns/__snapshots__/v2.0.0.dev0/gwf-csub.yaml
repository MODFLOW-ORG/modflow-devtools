name: gwf-csub
advanced: false
multi: false
schema_version: 2.0.0.dev0
fkeys:
  ts_filerecord:
    parent: parent_package
    key: ts_filerecord
    val: timeseries
    abbr: ts
    param: timeseries
    description: xxx
  obs_filerecord:
    parent: parent_model_or_package
    key: obs_filerecord
    val: observations
    abbr: obs
    param: continuous
options:
  boundnames:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that boundary names may be provided with the list of CSUB cells.
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that the list of CSUB information will be written to the listing
      file immediately after it is read.
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to save CSUB flows
    description: keyword to indicate that cell-by-cell flow terms will be written to the file specified
      with 'BUDGET SAVE FILE' in Output Control.
  gammaw:
    block: options
    type: double precision
    default: 9806.65
    reader: urword
    optional: true
    longname: unit weight of water
    description: unit weight of water. For freshwater, GAMMAW is 9806.65 Newtons/cubic meters or 62.48
      lb/cubic foot in SI and English units, respectively. By default, GAMMAW is 9806.65 Newtons/cubic
      meters.
  beta:
    block: options
    type: double precision
    default: 4.6512e-10
    reader: urword
    optional: true
    longname: compressibility of water
    description: compressibility of water. Typical values of BETA are 4.6512e-10 1/Pa or 2.2270e-8 lb/square
      foot in SI and English units, respectively. By default, BETA is 4.6512e-10 1/Pa.
  elastic_inelastic_smoothing:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: elastic to inelastic smoothing
    description: keyword to activate smoothing of the delay interbed skeletal specific storage as the
      effective stress exceeds the preconsolidation stress. When active, the skeletal specific storage
      is smoothly transitioned from the elastic value to the inelastic value over a small window (0.001
      of the preconsolidation stress) instead of switching discontinuously at the preconsolidation stress.
      Activating this option can improve convergence of models with delay interbeds. By default, the elastic
      to inelastic transition is discontinuous.
    mf6internal: ei_smoothing
  strict_effective_stress:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: terminate on negative effective stress
    description: keyword to terminate the simulation when the calculated effective stress is small or
      negative, instead of regularizing it. By default the effective stress used to calculate the skeletal
      specific storage is not allowed to fall below a small fraction (0.001) of the geostatic stress,
      which keeps the specific storage bounded and allows the simulation to continue; a warning reports
      the number of time steps in which a negative effective stress was regularized. Negative effective
      stress typically occurs in uppermost cells where simulated water levels rise above land surface.
      This keyword is deprecated and will be removed in a future release.
    deprecated: 6.8.0
    mf6internal: strict_stress
  head_based:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate the head-based formulation will be used
    description: keyword to indicate the head-based formulation will be used to simulate coarse-grained
      aquifer materials and no-delay and delay interbeds. Specifying HEAD_BASED also specifies the INITIAL_PRECONSOLIDATION_HEAD
      option.
  initial_preconsolidation_head:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate that preconsolidation heads will be specified
    description: keyword to indicate that preconsolidation heads will be specified for no-delay and delay
      interbeds in the PACKAGEDATA block. If the SPECIFIED_INITIAL_INTERBED_STATE option is specified
      in the OPTIONS block, user-specified preconsolidation heads in the PACKAGEDATA block are absolute
      values. Otherwise, user-specified preconsolidation heads in the PACKAGEDATA block are relative to
      steady-state or initial heads.
    mf6internal: precon_head
  ndelaycells:
    block: options
    type: integer
    reader: urword
    optional: true
    longname: number of interbed cell nodes
    description: number of nodes used to discretize delay interbeds. If not specified, then a default
      value of 19 is assigned.
  compression_indices:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate CR and CC are read instead of SSE and SSV
    description: keyword to indicate that the recompression (CR) and compression (CC) indices are specified
      instead of the elastic specific storage (SSE) and inelastic specific storage (SSV) coefficients.
      If not specified, then elastic specific storage (SSE) and inelastic specific storage (SSV) coefficients
      must be specified.
    mf6internal: icompress
  update_material_properties:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate material properties can change during the simulations
    description: keyword to indicate that the thickness and void ratio of coarse-grained and interbed
      sediments (delay and no-delay) will vary during the simulation. If not specified, the thickness
      and void ratio of coarse-grained and interbed sediments will not vary during the simulation.
    mf6internal: matprop
  cell_fraction:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate cell fraction interbed thickness
    description: keyword to indicate that the thickness of interbeds will be specified in terms of the
      fraction of cell thickness. If not specified, interbed thicknness must be specified.
  specified_initial_interbed_state:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate that absolute initial states will be specified
    description: keyword to indicate that absolute preconsolidation stresses (heads) and delay bed heads
      will be specified for interbeds defined in the PACKAGEDATA block. The SPECIFIED_INITIAL_INTERBED_STATE
      option is equivalent to specifying the SPECIFIED_INITIAL_PRECONSOLITATION_STRESS and SPECIFIED_INITIAL_DELAY_HEAD.
      If SPECIFIED_INITIAL_INTERBED_STATE is not specified then preconsolidation stress (head) and delay
      bed head values specified in the PACKAGEDATA block are relative to simulated values of the first
      stress period if steady-state or initial stresses and GWF heads if the first stress period is transient.
    mf6internal: interbed_state
  specified_initial_preconsolidation_stress:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate that absolute initial preconsolidation stresses (head) will be specified
    description: keyword to indicate that absolute preconsolidation stresses (heads) will be specified
      for interbeds defined in the PACKAGEDATA block. If SPECIFIED_INITIAL_PRECONSOLITATION_STRESS and
      SPECIFIED_INITIAL_INTERBED_STATE are not specified then preconsolidation stress (head) values specified
      in the PACKAGEDATA block are relative to simulated values if the first stress period is steady-state
      or initial stresses (heads) if the first stress period is transient.
    mf6internal: precon_stress
  specified_initial_delay_head:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate that absolute initial delay bed heads will be specified
    description: keyword to indicate that absolute initial delay bed head will be specified for interbeds
      defined in the PACKAGEDATA block. If SPECIFIED_INITIAL_DELAY_HEAD and SPECIFIED_INITIAL_INTERBED_STATE
      are not specified then delay bed head values specified in the PACKAGEDATA block are relative to
      simulated values if the first stress period is steady-state or initial GWF heads if the first stress
      period is transient.
    mf6internal: delay_head
  effective_stress_lag:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: keyword to indicate that specific storage will be calculate using the effective stress from
      the previous time step
    description: keyword to indicate the effective stress from the previous time step will be used to
      calculate specific storage values. This option can 1) help with convergence in models with thin
      cells and water table elevations close to land surface; 2) is identical to the approach used in
      the SUBWT package for MODFLOW-2005; and 3) is only used if the effective-stress formulation is being
      used. By default, current effective stress values are used to calculate specific storage values.
    mf6internal: stress_lag
  strainib_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: strainibfr
    fields:
      strain_csv_interbed:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify the record that corresponds to final interbed strain output.
        in_record: true
        tagged: true
        mf6internal: csvinterbed
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      interbedstrain_filename:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma-separated-values output file to write final interbed strain information.
        preserve_case: true
        in_record: true
        tagged: false
        mf6internal: interbedstrainfn
  straincg_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: straincgfr
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      strain_csv_coarse:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify the record that corresponds to final coarse-grained material strain
          output.
        in_record: true
        tagged: true
        mf6internal: csvcoarse
      coarsestrain_filename:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma-separated-values output file to write final coarse-grained material
          strain information.
        preserve_case: true
        in_record: true
        tagged: false
        mf6internal: coarsestrainfn
  compaction_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: cmpfr
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      compaction:
