dimensions:
  ninterbeds:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of CSUB interbed systems
    description: is the number of CSUB interbed systems.  More than 1 CSUB interbed systems can be assigned
      to a GWF cell; however, only 1 GWF cell can be assigned to a single CSUB interbed system.
  maxsig0:
    block: dimensions
    type: integer
    reader: urword
    optional: true
    longname: maximum number of stress offset cells
    description: is the maximum number of cells that can have a specified stress offset.  More than 1
      stress offset can be assigned to a GWF cell. By default, MAXSIG0 is 0.
    mf6internal: maxbound
griddata:
  cg_ske_cr:
    block: griddata
    type: double precision
    shape: (nodes)
    default: 1.0e-05
    reader: readarray
    longname: elastic coarse specific storage
    description: is the initial elastic coarse-grained material specific storage or recompression index.
      The recompression index is specified if COMPRESSION_INDICES is specified in the OPTIONS block.  Specified
      or calculated elastic coarse-grained material specific storage values are not adjusted from initial
      values if HEAD_BASED is specified in the OPTIONS block.
    layered: true
    netcdf: true
  cg_theta:
    block: griddata
    type: double precision
    shape: (nodes)
    default: 0.2
    reader: readarray
    longname: initial coarse-grained material porosity
    description: is the initial porosity of coarse-grained materials.
    layered: true
    netcdf: true
  sgm:
    block: griddata
    type: double precision
    shape: (nodes)
    reader: readarray
    optional: true
    longname: specific gravity of moist sediments
    description: is the specific gravity of moist or unsaturated sediments.  If not specified, then a
      default value of 1.7 is assigned.
    layered: true
    netcdf: true
  sgs:
    block: griddata
    type: double precision
    shape: (nodes)
    reader: readarray
    optional: true
    longname: specific gravity of saturated sediments
    description: is the specific gravity of saturated sediments. If not specified, then a default value
      of 2.0 is assigned.
    layered: true
    netcdf: true
packagedata:
  packagedata:
    block: packagedata
    type: recarray
    shape: (ninterbeds)
    reader: urword
    optional: true
    item:
      type: record
      block: packagedata
      reader: urword
      optional: true
      fields:
        icsubno:
          block: packagedata
          type: integer
          reader: urword
          longname: CSUB id number for this entry
          description: integer value that defines the CSUB interbed number associated with the specified
            PACKAGEDATA data on the line. CSUBNO must be greater than zero and less than or equal to NINTERBEDS.  CSUB
            information must be specified for every CSUB cell or the program will terminate with an error.  The
            program will also terminate with an error if information for a CSUB interbed number is specified
            more than once.
          tagged: false
          in_record: true
          numeric_index: true
        cellid:
          block: period
          type: integer
          shape: (ncelldim)
          reader: urword
          longname: cell identifier
          description: is the cell identifier, and depends on the type of grid that is used for the simulation.  For
            a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For
            a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model
            uses the unstructured discretization (DISU) input file, CELLID is the node number for the
            cell.
          tagged: false
          in_record: true
        cdelay:
          block: packagedata
          type: string
          reader: urword
          longname: delay type
          description: 'character string that defines the subsidence delay type for the interbed. Possible
            subsidence package CDELAY strings include: NODELAY--character keyword to indicate that delay
            will not be simulated in the interbed.  DELAY--character keyword to indicate that delay will
            be simulated in the interbed.'
          tagged: false
          in_record: true
        pcs0:
          block: packagedata
          type: double precision
          reader: urword
          longname: initial stress
          description: is the initial offset from the calculated initial effective stress or initial preconsolidation
            stress in the interbed, in units of height of a column of water. PCS0 is the initial preconsolidation
            stress if SPECIFIED_INITIAL_INTERBED_STATE or SPECIFIED_INITIAL_PRECONSOLIDATION_STRESS are
            specified in the OPTIONS block. If HEAD_BASED is specified in the OPTIONS block, PCS0 is the
            initial offset from the calculated initial head or initial preconsolidation head in the CSUB
            interbed and the initial preconsolidation stress is calculated from the calculated initial
            effective stress or calculated initial geostatic stress, respectively. When PCS0 is a relative
            offset, the sign depends on the formulation. For the default effective-stress formulation,
            specify a positive PCS0 for an overconsolidated interbed since the preconsolidation stress
            is greater than the initial effective stress. If HEAD_BASED is specified, specify a negative
            PCS0 for an overconsolidated interbed since the preconsolidation head is less than the initial
            head. A PCS0 of zero is normally consolidated in both formulations.
          tagged: false
          in_record: true
        thick_frac:
          block: packagedata
          type: double precision
          reader: urword
          longname: interbed thickness or cell fraction
          description: is the interbed thickness or cell fraction of the interbed. Interbed thickness
            is specified as a fraction of the cell thickness if CELL_FRACTION is specified in the OPTIONS
            block.
          tagged: false
          in_record: true
        rnb:
          block: packagedata
          type: double precision
          reader: urword
          longname: delay interbed material factor
          description: is the interbed material factor equivalent number of interbeds in the interbed
            system represented by the interbed. RNB must be greater than or equal to 1 if CDELAY is DELAY.
            Otherwise, RNB can be any value.
          tagged: false
          in_record: true
        ssv_cc:
          block: packagedata
          type: double precision
          reader: urword
          longname: initial interbed inelastic specific storage
          description: is the initial inelastic specific storage or compression index of the interbed.
            The compression index is specified if COMPRESSION_INDICES is specified in the OPTIONS block.
            Specified or calculated interbed inelastic specific storage values are not adjusted from initial
            values if HEAD_BASED is specified in the OPTIONS block.
          tagged: false
          in_record: true
        sse_cr:
          block: packagedata
          type: double precision
          reader: urword
          longname: initial interbed elastic specific storage
          description: is the initial elastic coarse-grained material specific storage or recompression
            index of the interbed. The recompression index is specified if COMPRESSION_INDICES is specified
            in the OPTIONS block. Specified or calculated interbed elastic specific storage values are
            not adjusted from initial values if HEAD_BASED is specified in the OPTIONS block.
          tagged: false
          in_record: true
        theta:
          block: packagedata
          type: double precision
          default: 0.2
          reader: urword
          longname: initial interbed porosity
          description: is the initial porosity of the interbed.
          tagged: false
          in_record: true
        kv:
          block: packagedata
          type: double precision
          reader: urword
          longname: delay interbed vertical hydraulic conductivity
          description: is the vertical hydraulic conductivity of the delay interbed. KV must be greater
            than 0 if CDELAY is DELAY. Otherwise, KV can be any value.
          tagged: false
          in_record: true
        h0:
          block: packagedata
          type: double precision
          reader: urword
          longname: initial delay interbed head
          description: is the initial offset from the head in cell cellid or the initial head in the delay
            interbed. H0 is the initial head in the delay bed if SPECIFIED_INITIAL_INTERBED_STATE or SPECIFIED_INITIAL_DELAY_HEAD
            are specified in the OPTIONS block. H0 can be any value if CDELAY is NODELAY.
          tagged: false
          in_record: true
        boundname:
          block: packagedata
          type: string
          reader: urword
          optional: true
          longname: interbed name
          description: name of the CSUB cell.  BOUNDNAME is an ASCII character variable that can contain
            as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be
            enclosed within single quotes.
          tagged: false
          in_record: true
period:
  transient_block: true
  stress_period_data:
    block: period
    type: recarray
    shape: (maxsig0)
    reader: urword
    mf6internal: spd
    item:
      type: record
      block: period
      reader: urword
      mf6internal: spd
      fields:
        cellid:
          block: period
          type: integer
          shape: (ncelldim)
          reader: urword
          longname: cell identifier
          description: is the cell identifier, and depends on the type of grid that is used for the simulation.  For
            a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For
            a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model
            uses the unstructured discretization (DISU) input file, CELLID is the node number for the
            cell.
          tagged: false
          in_record: true
        sig0:
          block: period
          type: double precision
          reader: urword
          longname: geostatic stress offset
          description: is the stress offset for the cell. SIG0 is added to the calculated geostatic stress
            for the cell. SIG0 is specified only if MAXSIG0 is specified to be greater than 0 in the DIMENSIONS
            block. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input'
            section), values can be obtained from a time series by entering the time-series name in place
            of a numeric value.
          tagged: false
          in_record: true
          time_series: true
