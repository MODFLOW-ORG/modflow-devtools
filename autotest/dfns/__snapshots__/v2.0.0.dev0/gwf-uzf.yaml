name: gwf-uzf
advanced: true
multi: true
schema_version: 2.0.0.dev0
fkeys:
  ts_filerecord:
    parent: parent_package
    key: ts_filerecord
    val: timeseries
    abbr: ts
    param: timeseries
    description: xxx
  obs_filerecord:
    parent: parent_model_or_package
    key: obs_filerecord
    val: observations
    abbr: obs
    param: continuous
options:
  auxiliary:
    block: options
    type: string
    shape: (naux)
    reader: urword
    optional: true
    longname: keyword to specify aux variables
    description: defines an array of one or more auxiliary variable names.  There is no limit on the number
      of auxiliary variables that can be provided on this line; however, lists of information provided
      in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The
      number of auxiliary variables detected on this line determines the value for naux.  Comments cannot
      be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
      variables may not be used by the package, but they will be available for use by other parts of the
      program.  The program will terminate with an error if auxiliary variables are specified on more
      than one line in the options block.
  auxmultname:
    block: options
    type: string
    reader: urword
    optional: true
    longname: name of auxiliary variable for multiplier
    description: name of auxiliary variable to be used as multiplier of GWF cell area used by UZF cell.
  boundnames:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that boundary names may be provided with the list of UZF cells.
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that the list of UZF information will be written to the listing file
      immediately after it is read.
    mf6internal: iprpak
  print_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated flows to listing file
    description: keyword to indicate that the list of UZF flow rates will be printed to the listing file
      for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If there
      is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for the
      last time step of each stress period.
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: save well flows to budget file
    description: keyword to indicate that UZF flow terms will be written to the file specified with 'BUDGET
      FILEOUT' in Output Control.
    mf6internal: ipakcb
  wc_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    fields:
      water_content:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: water_content keyword
        description: keyword to specify that record corresponds to unsaturated zone water contents.
        in_record: true
        tagged: true
      wcfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the binary output file to write water content information.
        preserve_case: true
        in_record: true
        tagged: false
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
  budget_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: budfilerec
    fields:
      budget:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget.
        in_record: true
        tagged: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the binary output file to write budget information.
        preserve_case: true
        in_record: true
        tagged: false
  budgetcsv_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: budcsvfilerec
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetcsv:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget CSV.
        in_record: true
        tagged: true
      budgetcsvfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma-separated value (CSV) output file to write budget summary information.  A
          budget summary record will be written to this file for each time step of the simulation.
        preserve_case: true
        in_record: true
        tagged: false
  package_convergence_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: pkgconvfilerec
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      package_convergence:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: package_convergence keyword
        description: keyword to specify that record corresponds to the package convergence comma spaced
          values file.
        in_record: true
        tagged: true
        mf6internal: pkgconv
      package_convergence_filename:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma spaced values output file to write package convergence information.
        in_record: true
        tagged: false
        mf6internal: pkgconvfname
  timeseries:
    block: options
    type: record ts6 filein ts6_filename
    reader: urword
    optional: true
    description: Contains data for the ts package. Data can be passed as a dictionary to the ts package
      with variable names as keys and package data as values. Data for the timeseries variable is also
      acceptable. See ts package documentation for more information.
    tagged: true
    ref:
      parent: parent_package
      key: ts_filerecord
      val: timeseries
      abbr: ts
      param: timeseries
      description: xxx
  observations:
    block: options
    type: record obs6 filein obs6_filename
    reader: urword
    optional: true
    description: Contains data for the obs package. Data can be passed as a dictionary to the obs package
      with variable names as keys and package data as values. Data for the observations variable is also
      acceptable. See obs package documentation for more information.
    tagged: true
    ref:
      parent: parent_model_or_package
      key: obs_filerecord
      val: observations
      abbr: obs
      param: continuous
  mover:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that this instance of the UZF Package can be used with the Water
      Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within
      the package to store the available, provided, and received water.
    tagged: true
  dev_no_final_check:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: do not check final convergence
    description: keyword that deactivates the final convergence check of the change in UZF recharge.  This
      development option is not supported.
    mf6internal: iconvchk
  simulate_et:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword specifying that ET in the unsaturated (UZF) and saturated zones (GWF) will be
      simulated. ET can be simulated in the UZF cell and not the GWF cell by omitting keywords LINEAR_GWET
      and SQUARE_GWET.
    tagged: true
  linear_gwet:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: use linear evapotranspiration
    description: keyword specifying that groundwater ET will be simulated using the original ET formulation
      of MODFLOW-2005.
    tagged: true
  square_gwet:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: use square evapotranspiration
    description: keyword specifying that groundwater ET will be simulated by assuming a constant ET rate
      for groundwater levels between land surface (TOP) and land surface minus the ET extinction depth
      (TOP-EXTDP). Groundwater ET is smoothly reduced from the PET rate to zero over a nominal interval
      at TOP-EXTDP.
    tagged: true
  simulate_gwseep:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: activate seepage
    description: keyword specifying that groundwater discharge (GWSEEP) to land surface will be simulated.
      Groundwater discharge is nonzero when groundwater head is greater than land surface.  This option
      is no longer recommended; a better approach is to use the Drain Package with discharge scaling as
      a way to handle seepage to land surface.  The Drain Package with discharge scaling is described
      in Chapter 3 of the Supplemental Technical Information.
    tagged: true
    deprecated: 6.5.0
  unsat_etwc:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: use PET for theta greater than extwc
    description: keyword specifying that ET in the unsaturated zone will be simulated as a function of
      the specified PET rate while the water content (THETA) is greater than the ET extinction water content
      (EXTWC).
    tagged: true
  unsat_etae:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: use root potential
    description: keyword specifying that ET in the unsaturated zone will be simulated using a capillary
      pressure based formulation. Capillary pressure is calculated using the Brooks-Corey retention function.
    tagged: true
dimensions:
  nuzfcells:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of UZF cells
    description: is the number of UZF cells.  More than one UZF cell can be assigned to a GWF cell; however,
      only one GWF cell can be assigned to a single UZF cell. If more than one UZF cell is assigned to
      a GWF cell, then an auxiliary variable should be used to reduce the surface area of the UZF cell
      with the AUXMULTNAME option.
    mf6internal: maxbound
  ntrailwaves:
    block: dimensions
    type: integer
    default: 7
    reader: urword
    optional: false
    longname: number of trailing waves
    description: is the number of trailing waves.  A recommended value of 7 can be used for NTRAILWAVES.  This
      value can be increased to lower mass balance error in the unsaturated zone.
  nwavesets:
    block: dimensions
    type: integer
    default: 40
    reader: urword
    optional: false
    longname: number of wave sets
    description: is the number of wave sets.  A recommended value of 40 can be used for NWAVESETS.  This
      value can be increased if more waves are required to resolve variations in water content within
      the unsaturated zone.
packagedata:
  packagedata:
    block: packagedata
    type: recarray
    shape: (nuzfcells)
    reader: urword
    item:
      type: record
      block: packagedata
      reader: urword
      fields:
        ifno:
          block: period
          type: integer
          reader: urword
          longname: UZF id number
          description: integer value that defines the feature (UZF object) number associated with the
            specified PERIOD data on the line.
          tagged: false
          in_record: true
          numeric_index: true
        cellid:
          block: packagedata
          type: integer
          shape: (ncelldim)
          reader: urword
          longname: cell identifier
          description: is the cell identifier, and depends on the type of grid that is used for the simulation.  For
            a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For
            a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model
            uses the unstructured discretization (DISU) input file, CELLID is the node number for the
            cell.
          tagged: false
          in_record: true
        landflag:
          block: packagedata
          type: integer
          reader: urword
          longname: land flag
          description: integer value set to one for land surface cells indicating that boundary conditions
            can be applied and data can be specified in the PERIOD block. A value of 0 specifies a non-land
            surface cell.
          tagged: false
          in_record: true
        ivertcon:
          block: packagedata
          type: integer
          reader: urword
          longname: vertical connection flag
          description: integer value set to specify underlying UZF cell that receives water flowing to
            bottom of cell. If unsaturated zone flow reaches the water table before the cell bottom, then
            water is added to the GWF cell instead of flowing to the underlying UZF cell. A value of 0
            indicates the UZF cell is not connected to an underlying UZF cell.
          tagged: false
          in_record: true
          numeric_index: true
        surfdep:
          block: packagedata
          type: double precision
          reader: urword
          longname: surface depression depth
          description: is the surface depression depth of the UZF cell.
          tagged: false
          in_record: true
        vks:
          block: packagedata
          type: double precision
          reader: urword
          longname: vertical saturated hydraulic conductivity
          description: is the saturated vertical hydraulic conductivity of the UZF cell.  This value is
            used with the Brooks-Corey function and the simulated water content to calculate the partially
            saturated hydraulic conductivity.
          tagged: false
          in_record: true
        thtr:
          block: packagedata
          type: double precision
          reader: urword
          longname: residual water content
          description: is the residual (irreducible) water content of the UZF cell.  This residual water
            is not available to plants and will not drain into underlying aquifer cells.
          tagged: false
          in_record: true
        thts:
          block: packagedata
          type: double precision
          reader: urword
          longname: saturated water content
          description: is the saturated water content of the UZF cell.  The values for saturated and residual
            water content should be set in a manner that is consistent with the specific yield value specified
            in the Storage Package.  The saturated water content must be greater than the residual content.
          tagged: false
          in_record: true
        thti:
          block: packagedata
          type: double precision
          reader: urword
          longname: initial water content
          description: is the initial water content of the UZF cell.  The value must be greater than or
            equal to the residual water content and less than or equal to the saturated water content.
          tagged: false
          in_record: true
        eps:
          block: packagedata
          type: double precision
          reader: urword
          longname: Brooks-Corey exponent
          description: is the exponent used in the Brooks-Corey function.  The Brooks-Corey function is
            used by UZF to calculated hydraulic conductivity under partially saturated conditions as a
            function of water content and the user-specified saturated hydraulic conductivity.
          tagged: false
          in_record: true
        boundname:
          block: packagedata
          type: string
          reader: urword
          optional: true
          longname: well name
          description: name of the UZF cell cell.  BOUNDNAME is an ASCII character variable that can contain
            as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be
            enclosed within single quotes.
          tagged: false
          in_record: true
period:
  transient_block: true
  perioddata:
    block: period
    type: recarray
    reader: urword
    item:
      type: record
      block: period
      reader: urword
      fields:
        ifno:
          block: period
          type: integer
          reader: urword
          longname: UZF id number
          description: integer value that defines the feature (UZF object) number associated with the
            specified PERIOD data on the line.
          tagged: false
          in_record: true
          numeric_index: true
        finf:
          block: period
          type: double precision
          reader: urword
          longname: infiltration rate
          description: real or character value that defines the applied infiltration rate of the UZF cell
            ($LT^{-1}$). If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          tagged: false
          in_record: true
          time_series: true
        pet:
          block: period
          type: double precision
          reader: urword
          longname: potential ET rate
          description: real or character value that defines the potential evapotranspiration rate of the
            UZF cell and specified GWF cell. Evapotranspiration is first removed from the unsaturated
            zone and any remaining potential evapotranspiration is applied to the saturated zone. If IVERTCON
            is greater than zero then residual potential evapotranspiration not satisfied in the UZF cell
            is applied to the underlying UZF and GWF cells. PET is always specified, but is only used
            if SIMULATE_ET is specified in the OPTIONS block. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          tagged: false
          in_record: true
          time_series: true
        extdp:
          block: period
          type: double precision
          reader: urword
          longname: extinction depth
          description: real or character value that defines the evapotranspiration extinction depth of
            the UZF cell. If IVERTCON is greater than zero and EXTDP extends below the GWF cell bottom
            then remaining potential evapotranspiration is applied to the underlying UZF and GWF cells.
            EXTDP is always specified, but is only used if SIMULATE_ET is specified in the OPTIONS block.
            If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          tagged: false
          in_record: true
          time_series: true
        extwc:
          block: period
          type: double precision
          reader: urword
          longname: extinction water content
          description: real or character value that defines the evapotranspiration extinction water content
            of the UZF cell. EXTWC is always specified, but is only used if SIMULATE_ET and UNSAT_ETWC
            are specified in the OPTIONS block. The evapotranspiration rate from the unsaturated zone
            will be set to zero when the calculated water content is at or less than this value.  The
            value for EXTWC cannot be less than the residual water content, and if it is specified as
            being less than the residual water content it is set to the residual water content. If the
            Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values
            can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          tagged: false
          in_record: true
          time_series: true
        ha:
          block: period
          type: double precision
          reader: urword
          longname: air entry potential
          description: real or character value that defines the air entry potential (head) of the UZF
            cell. HA is always specified, but is only used if SIMULATE_ET and UNSAT_ETAE are specified
            in the OPTIONS block. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          tagged: false
          in_record: true
          time_series: true
        hroot:
          block: period
          type: double precision
          reader: urword
          longname: root potential
          description: real or character value that defines the root potential (head) of the UZF cell.
            HROOT is always specified, but is only used if SIMULATE_ET and UNSAT_ETAE are specified in
            the OPTIONS block. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          tagged: false
          in_record: true
          time_series: true
        rootact:
          block: period
          type: double precision
          reader: urword
          longname: root activity function
          description: real or character value that defines the root activity function of the UZF cell.
            ROOTACT is the length of roots in a given volume of soil divided by that volume. Values range
            from 0 to about 3 $cm^{-2}$, depending on the plant community and its stage of development.
            ROOTACT is always specified, but is only used if SIMULATE_ET and UNSAT_ETAE are specified
            in the OPTIONS block. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          tagged: false
          in_record: true
          time_series: true
        aux:
          block: period
          type: double precision
          shape: (naux)
          reader: urword
          optional: true
          longname: auxiliary variables
          description: represents the values of the auxiliary variables for each UZF. The values of auxiliary
            variables must be present for each UZF. The values must be specified in the order of the auxiliary
            variables specified in the OPTIONS block.  If the package supports time series and the Options
            block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can
            be obtained from a time series by entering the time-series name in place of a numeric value.
          in_record: true
          tagged: false
          time_series: true
