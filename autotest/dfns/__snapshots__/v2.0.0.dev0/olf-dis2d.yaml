name: olf-dis2d
advanced: false
multi: false
schema_version: 2.0.0.dev0
options:
  length_units:
    block: options
    type: string
    reader: urword
    optional: true
    longname: model length units
    description: is the length units used for this model.  Values can be 'FEET', 'METERS', or 'CENTIMETERS'.  If
      not specified, the default is 'UNKNOWN'.
  nogrb:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: do not write binary grid file
    description: keyword to deactivate writing of the binary grid file.
  grb_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    fields:
      grb6:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: grb keyword
        description: keyword to specify that record corresponds to a binary grid file.
        in_record: true
        tagged: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      grb6_filename:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file name of GRB information
        description: defines a binary grid output file. If this option is not provided, the output file
          will have the same name as the discretization input file, plus extension '.grb'.
        preserve_case: true
        in_record: true
        tagged: false
  xorigin:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: x-position of the model grid origin
    description: x-position of the lower-left corner of the model grid.  A default value of zero is assigned
      if not specified.  The value for XORIGIN does not affect the model simulation, but it is written
      to the binary grid file so that postprocessors can locate the grid in space.
  yorigin:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: y-position of the model grid origin
    description: y-position of the lower-left corner of the model grid.  If not specified, then a default
      value equal to zero is used.  The value for YORIGIN does not affect the model simulation, but it
      is written to the binary grid file so that postprocessors can locate the grid in space.
  angrot:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: rotation angle
    description: counter-clockwise rotation angle (in degrees) of the lower-left corner of the model grid.  If
      not specified, then a default value of 0.0 is assigned.  The value for ANGROT does not affect the
      model simulation, but it is written to the binary grid file so that postprocessors can locate the
      grid in space.
  export_array_ascii:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: export array variables to layered ascii files.
    description: keyword that specifies input griddata arrays should be written to layered ascii output
      files.
    mf6internal: export_ascii
  crs:
    block: options
    type: string
    shape: lenbigline
    reader: urword
    optional: true
    longname: CRS user input string
    description: is a real-world coordinate reference system (CRS) for the model, for example, an EPSG
      integer code (e.g. 26915), authority string (i.e. epsg:26915), or Open Geospatial Consortium Well-Known
      Text (WKT) specification. Limited to 5000 characters. The entry for CRS does not affect the model
      simulation, but it is written to the binary grid file so that postprocessors can locate the grid
      in space.
    preserve_case: true
dimensions:
  nrow:
    block: dimensions
    type: integer
    default: 2
    reader: urword
    optional: false
    longname: number of rows
    description: is the number of rows in the model grid.
  ncol:
    block: dimensions
    type: integer
    default: 2
    reader: urword
    optional: false
    longname: number of columns
    description: is the number of columns in the model grid.
griddata:
  delr:
    block: griddata
    type: double precision
    shape: (ncol)
    default: 1.0
    reader: readarray
    longname: spacing along a row
    description: is the column spacing in the row direction.
  delc:
    block: griddata
    type: double precision
    shape: (nrow)
    default: 1.0
    reader: readarray
    longname: spacing along a column
    description: is the row spacing in the column direction.
  bottom:
    block: griddata
    type: double precision
    shape: (ncol, nrow)
    default: 0.0
    reader: readarray
    longname: cell bottom elevation
    description: is the bottom elevation for each cell.
    layered: false
  idomain:
    block: griddata
    type: integer
    shape: (ncol, nrow)
    reader: readarray
    optional: true
    longname: idomain existence array
    description: is an optional array that characterizes the existence status of a cell.  If the IDOMAIN
      array is not specified, then all model cells exist within the solution.  If the IDOMAIN value for
      a cell is 0, the cell does not exist in the simulation.  Input and output values will be read and
      written for the cell, but internal to the program, the cell is excluded from the solution.  If the
      IDOMAIN value for a cell is 1, the cell exists in the simulation.  If the IDOMAIN value for a cell
      is -1, the cell does not exist in the simulation.  Furthermore, the first existing cell above will
      be connected to the first existing cell below.  This type of cell is referred to as a 'vertical
      pass through' cell.
    layered: false
