name = "gwt-mwt"
advanced = true
multi = true
schema_version = "2.0.0.dev0"

[fkeys.ts_filerecord]
parent = "parent_package"
key = "ts_filerecord"
val = "timeseries"
abbr = "ts"
param = "timeseries"
description = "xxx"

[fkeys.obs_filerecord]
parent = "parent_model_or_package"
key = "obs_filerecord"
val = "observations"
abbr = "obs"
param = "continuous"

[options.flow_package_name]
block = "options"
type = "string"
reader = "urword"
optional = true
longname = "keyword to specify name of corresponding flow package"
description = "keyword to specify the name of the corresponding flow package.  If not specified, then the corresponding flow package must have the same name as this advanced transport package (the name associated with this package in the GWT name file)."
mf6internal = "flow_pkg_name"

[options.auxiliary]
block = "options"
type = "string"
shape = "(naux)"
reader = "urword"
optional = true
longname = "keyword to specify aux variables"
description = "defines an array of one or more auxiliary variable names.  There is no limit on the number of auxiliary variables that can be provided on this line; however, lists of information provided in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary variables may not be used by the package, but they will be available for use by other parts of the program.  The program will terminate with an error if auxiliary variables are specified on more than one line in the options block."

[options.flow_package_auxiliary_name]
block = "options"
type = "string"
reader = "urword"
optional = true
longname = "keyword to specify name of concentration auxiliary variable in flow package"
description = "keyword to specify the name of an auxiliary variable in the corresponding flow package.  If specified, then the simulated concentrations from this advanced transport package will be copied into the auxiliary variable specified with this name.  Note that the flow package must have an auxiliary variable with this name or the program will terminate with an error.  If the flows for this advanced transport package are read from a file, then this option will have no effect."
mf6internal = "fp_aux_name"

[options.boundnames]
block = "options"
type = "keyword"
reader = "urword"
optional = true
description = "keyword to indicate that boundary names may be provided with the list of well cells."

[options.print_input]
block = "options"
type = "keyword"
reader = "urword"
optional = true
longname = "print input to listing file"
description = "keyword to indicate that the list of well information will be written to the listing file immediately after it is read."
mf6internal = "iprpak"

[options.print_concentration]
block = "options"
type = "keyword"
reader = "urword"
optional = true
longname = "print calculated concentrations to listing file"
description = "keyword to indicate that the list of well {#2} will be printed to the listing file for every stress period in which 'CONCENTRATION PRINT' is specified in Output Control.  If there is no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last time step of each stress period."
mf6internal = "iprconc"

[options.print_flows]
block = "options"
type = "keyword"
reader = "urword"
optional = true
longname = "print calculated flows to listing file"
description = "keyword to indicate that the list of well flow rates will be printed to the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for the last time step of each stress period."
mf6internal = "iprflow"

[options.save_flows]
block = "options"
type = "keyword"
reader = "urword"
optional = true
longname = "save well flows to budget file"
description = "keyword to indicate that well flow terms will be written to the file specified with 'BUDGET FILEOUT' in Output Control."
mf6internal = "ipakcb"

[options.concentration_filerecord]
block = "options"
type = "record"
reader = "urword"
optional = true
tagged = true
mf6internal = "conc_filerec"

[options.concentration_filerecord.fields.concentration]
block = "period"
type = "double precision"
reader = "urword"
longname = "well concentration"
description = "real or character value that defines the concentration for the well. The specified CONCENTRATION is only applied if the well is a constant concentration well. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
tagged = true
in_record = true
time_series = true

[options.concentration_filerecord.fields.concfile]
block = "options"
type = "string"
reader = "urword"
optional = false
longname = "file keyword"
description = "name of the binary output file to write concentration information."
preserve_case = true
in_record = true
tagged = false

[options.concentration_filerecord.fields.fileout]
block = "options"
type = "keyword"
reader = "urword"
optional = false
longname = "file keyword"
description = "keyword to specify that an output filename is expected next."
in_record = true
tagged = true

[options.budget_filerecord]
block = "options"
type = "record"
reader = "urword"
optional = true
tagged = true
mf6internal = "budfilerec"

[options.budget_filerecord.fields.budget]
block = "options"
type = "keyword"
reader = "urword"
optional = false
longname = "budget keyword"
description = "keyword to specify that record corresponds to the budget."
in_record = true
tagged = true

[options.budget_filerecord.fields.fileout]
block = "options"
type = "keyword"
reader = "urword"
optional = false
longname = "file keyword"
description = "keyword to specify that an output filename is expected next."
in_record = true
tagged = true

[options.budget_filerecord.fields.budgetfile]
block = "options"
type = "string"
reader = "urword"
optional = false
longname = "file keyword"
description = "name of the binary output file to write budget information."
preserve_case = true
in_record = true
tagged = false

[options.budgetcsv_filerecord]
block = "options"
type = "record"
reader = "urword"
optional = true
tagged = true
mf6internal = "budcsvfilerec"

[options.budgetcsv_filerecord.fields.fileout]
block = "options"
type = "keyword"
reader = "urword"
optional = false
longname = "file keyword"
description = "keyword to specify that an output filename is expected next."
in_record = true
tagged = true

[options.budgetcsv_filerecord.fields.budgetcsv]
block = "options"
type = "keyword"
reader = "urword"
optional = false
longname = "budget keyword"
description = "keyword to specify that record corresponds to the budget CSV."
in_record = true
tagged = true

[options.budgetcsv_filerecord.fields.budgetcsvfile]
block = "options"
type = "string"
reader = "urword"
optional = false
longname = "file keyword"
description = "name of the comma-separated value (CSV) output file to write budget summary information.  A budget summary record will be written to this file for each time step of the simulation."
preserve_case = true
in_record = true
tagged = false

[options.timeseries]
block = "options"
type = "record ts6 filein ts6_filename"
reader = "urword"
optional = true
description = "Contains data for the ts package. Data can be passed as a dictionary to the ts package with variable names as keys and package data as values. Data for the timeseries variable is also acceptable. See ts package documentation for more information."
tagged = true

[options.timeseries.ref]
parent = "parent_package"
key = "ts_filerecord"
val = "timeseries"
abbr = "ts"
param = "timeseries"
description = "xxx"

[options.observations]
block = "options"
type = "record obs6 filein obs6_filename"
reader = "urword"
optional = true
description = "Contains data for the obs package. Data can be passed as a dictionary to the obs package with variable names as keys and package data as values. Data for the observations variable is also acceptable. See obs package documentation for more information."
tagged = true

[options.observations.ref]
parent = "parent_model_or_package"
key = "obs_filerecord"
val = "observations"
abbr = "obs"
param = "continuous"

[options.dev_nonexpanding_matrix]
block = "options"
type = "keyword"
reader = "urword"
optional = true
longname = "do not add rows to the solution matrix"
description = "keyword that solves the feature concentration with a general mixing equation and adds the result to the right-hand side of the GWT equations, instead of adding a row to the solution matrix for each feature.  This development option is not supported."
mf6internal = "dev_nonexpanding"

[packagedata.packagedata]
block = "packagedata"
type = "recarray"
shape = "(nmawwells)"
reader = "urword"

[packagedata.packagedata.item]
type = "record"
block = "packagedata"
reader = "urword"

[packagedata.packagedata.item.fields.ifno]
block = "period"
type = "integer"
reader = "urword"
longname = "well number for this entry"
description = "integer value that defines the feature (well) number associated with the specified PERIOD data on the line. IFNO must be greater than zero and less than or equal to NMAWWELLS."
tagged = false
in_record = true
numeric_index = true

[packagedata.packagedata.item.fields.strt]
block = "packagedata"
type = "double precision"
reader = "urword"
longname = "starting well concentration"
description = "real value that defines the starting concentration for the well."
tagged = false
in_record = true

[packagedata.packagedata.item.fields.aux]
block = "packagedata"
type = "double precision"
shape = "(naux)"
reader = "urword"
optional = true
longname = "auxiliary variables"
description = "represents the values of the auxiliary variables for each well. The values of auxiliary variables must be present for each well. The values must be specified in the order of the auxiliary variables specified in the OPTIONS block.  If the package supports time series and the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
in_record = true
tagged = false
time_series = true

[packagedata.packagedata.item.fields.boundname]
block = "packagedata"
type = "string"
reader = "urword"
optional = true
longname = "well name"
description = "name of the well cell.  BOUNDNAME is an ASCII character variable that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be enclosed within single quotes."
tagged = false
in_record = true

[period]
transient_block = true

[period.mwtperioddata]
block = "period"
type = "recarray"
reader = "urword"

[period.mwtperioddata.item]
type = "record"
block = "period"
reader = "urword"

[period.mwtperioddata.item.fields.ifno]
block = "period"
type = "integer"
reader = "urword"
longname = "well number for this entry"
description = "integer value that defines the feature (well) number associated with the specified PERIOD data on the line. IFNO must be greater than zero and less than or equal to NMAWWELLS."
tagged = false
in_record = true
numeric_index = true

[period.mwtperioddata.item.fields.mwtsetting]
block = "period"
type = "keystring"
reader = "urword"
description = "line of information that is parsed into a keyword and values.  Keyword values that can be used to start the MWTSETTING string include: STATUS, CONCENTRATION, RATE, and AUXILIARY.  These settings are used to assign the concentration associated with the corresponding flow terms.  Concentrations cannot be specified for all flow terms.  For example, the Multi-Aquifer Well Package supports a 'WITHDRAWAL' flow term.  If this withdrawal term is active, then water will be withdrawn from the well at the calculated concentration of the well."
tagged = false
in_record = true

[period.mwtperioddata.item.fields.mwtsetting.choices.concentration]
block = "period"
type = "double precision"
reader = "urword"
longname = "well concentration"
description = "real or character value that defines the concentration for the well. The specified CONCENTRATION is only applied if the well is a constant concentration well. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
tagged = true
in_record = true
time_series = true

[period.mwtperioddata.item.fields.mwtsetting.choices.status]
block = "period"
type = "string"
reader = "urword"
longname = "well concentration status"
description = "keyword option to define well status.  STATUS can be ACTIVE, INACTIVE, or CONSTANT. By default, STATUS is ACTIVE, which means that concentration will be calculated for the well.  If a well is inactive, then there will be no solute mass fluxes into or out of the well and the inactive value will be written for the well concentration.  If a well is constant, then the concentration for the well will be fixed at the user specified value."
tagged = true
in_record = true

[period.mwtperioddata.item.fields.mwtsetting.choices.rate]
block = "period"
type = "double precision"
reader = "urword"
longname = "well injection concentration"
description = "real or character value that defines the injection solute concentration $(ML^{-3})$ for the well. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
tagged = true
in_record = true
time_series = true

[period.mwtperioddata.item.fields.mwtsetting.choices.auxiliaryrecord]
block = "period"
type = "record"
reader = "urword"
in_record = true

[period.mwtperioddata.item.fields.mwtsetting.choices.auxiliaryrecord.fields.auxiliary]
block = "period"
type = "keyword"
reader = "urword"
description = "keyword for specifying auxiliary variable."
in_record = true
mf6internal = "period_auxiliary"

[period.mwtperioddata.item.fields.mwtsetting.choices.auxiliaryrecord.fields.auxname]
block = "period"
type = "string"
reader = "urword"
description = "name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does not match one of the auxiliary variable names defined in the OPTIONS block the data are ignored."
tagged = false
in_record = true

[period.mwtperioddata.item.fields.mwtsetting.choices.auxiliaryrecord.fields.auxval]
block = "period"
type = "double precision"
reader = "urword"
longname = "auxiliary variable value"
description = "value for the auxiliary variable. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained from a time series by entering the time-series name in place of a numeric value."
tagged = false
in_record = true
time_series = true
