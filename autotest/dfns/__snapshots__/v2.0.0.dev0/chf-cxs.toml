name = "chf-cxs"
advanced = false
multi = false
schema_version = "2.0.0.dev0"

[options.print_input]
block = "options"
type = "keyword"
reader = "urword"
optional = true
longname = "print input to listing file"
description = "keyword to indicate that the list of stream reach information will be written to the listing file immediately after it is read."
mf6internal = "iprpak"

[dimensions.nsections]
block = "dimensions"
type = "integer"
reader = "urword"
optional = false
longname = "number of reaches"
description = "integer value specifying the number of cross sections that will be defined.  There must be NSECTIONS entries in the PACKAGEDATA block."

[dimensions.npoints]
block = "dimensions"
type = "integer"
reader = "urword"
optional = false
longname = "total number of points defined for all reaches"
description = "integer value specifying the total number of cross-section points defined for all reaches.  There must be NPOINTS entries in the CROSSSECTIONDATA block."

[packagedata.packagedata]
block = "packagedata"
type = "recarray"
shape = "(nsections)"
reader = "urword"

[packagedata.packagedata.item]
type = "record"
block = "packagedata"
reader = "urword"

[packagedata.packagedata.item.fields.ifno]
block = "crosssectiondata"
type = "integer"
reader = "urword"
longname = "cross section number for this entry"
description = "integer value that defines the feature (cross section) number associated with the specified CROSSSECTIONDATA data on the line. IFNO must be greater than zero and less than or equal to NSECTIONS. IFNO must be the same for consecutive entries corresponding to the same cross section, and there must be NXSPOINTS consecutive entries, as specified in PACKAGEDATA, for each cross section."
tagged = false
in_record = true
numeric_index = true

[packagedata.packagedata.item.fields.nxspoints]
block = "packagedata"
type = "integer"
reader = "urword"
longname = "number of points used to define cross section"
description = "integer value that defines the number of points used to define the define the shape of a section.  NXSPOINTS must be greater than 1 or the program will terminate with an error.  NXSPOINTS defines the number of points that must be entered for the reach in the CROSSSECTIONDATA block.  The sum of NXSPOINTS for all sections must equal the NPOINTS dimension."
tagged = false
in_record = true

[crosssectiondata.crosssectiondata]
block = "crosssectiondata"
type = "recarray"
shape = "(npoints)"
reader = "urword"

[crosssectiondata.crosssectiondata.item]
type = "record"
block = "crosssectiondata"
reader = "urword"

[crosssectiondata.crosssectiondata.item.fields.ifno]
block = "crosssectiondata"
type = "integer"
reader = "urword"
longname = "cross section number for this entry"
description = "integer value that defines the feature (cross section) number associated with the specified CROSSSECTIONDATA data on the line. IFNO must be greater than zero and less than or equal to NSECTIONS. IFNO must be the same for consecutive entries corresponding to the same cross section, and there must be NXSPOINTS consecutive entries, as specified in PACKAGEDATA, for each cross section."
tagged = false
in_record = true
numeric_index = true

[crosssectiondata.crosssectiondata.item.fields.xfraction]
block = "crosssectiondata"
type = "double precision"
reader = "urword"
longname = "fractional width"
description = "real value that defines the station (x) data for the cross-section as a fraction of the width (WIDTH) of the reach. XFRACTION must be greater than or equal to zero but can be greater than one. XFRACTION values can be used to decrease or increase the width of a reach from the specified reach width (WIDTH)."
tagged = false
in_record = true

[crosssectiondata.crosssectiondata.item.fields.height]
block = "crosssectiondata"
type = "double precision"
reader = "urword"
longname = "depth"
description = "real value that is the height relative to the top of the lowest elevation of the streambed (ELEVATION) and corresponding to the station data on the same line. HEIGHT must be greater than or equal to zero and at least one cross-section height must be equal to zero."
tagged = false
in_record = true

[crosssectiondata.crosssectiondata.item.fields.manfraction]
block = "crosssectiondata"
type = "double precision"
reader = "urword"
optional = false
longname = "Manning's roughness coefficient"
description = "real value that defines the Manning's roughness coefficient data for the cross-section as a fraction of the Manning's roughness coefficient for the reach (MANNINGSN) and corresponding to the station data on the same line. MANFRACTION must be greater than zero. MANFRACTION is applied from the XFRACTION value on the same line to the XFRACTION value on the next line."
tagged = false
in_record = true
