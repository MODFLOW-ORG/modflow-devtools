name: gwf-disv
advanced: false
multi: false
schema_version: 2.0.0.dev0
fkeys:
  ncf_filerecord:
    parent: parent_package
    key: ncf_filerecord
    val: packagedata
    abbr: ncf
    param: packagedata
subcomponents:
  - utl-ncf
options:
  length_units:
    block: options
    type: string
    reader: urword
    optional: true
    longname: model length units
    description: is the length units used for this model.  Values can be 'FEET', 'METERS', or 'CENTIMETERS'.  If
      not specified, the default is 'UNKNOWN'.
  nogrb:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: do not write binary grid file
    description: keyword to deactivate writing of the binary grid file.
  grb_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    fields:
      grb6:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: grb keyword
        description: keyword to specify that record corresponds to a binary grid file.
        in_record: true
        tagged: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      grb6_filename:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file name of GRB information
        description: defines a binary grid output file. If this option is not provided, the output file
          will have the same name as the discretization input file, plus extension '.grb'.
        preserve_case: true
        in_record: true
        tagged: false
  xorigin:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: x-position origin of the model grid coordinate system
    description: x-position of the origin used for model grid vertices.  This value should be provided
      in a real-world coordinate system.  A default value of zero is assigned if not specified.  The value
      for XORIGIN does not affect the model simulation, but it is written to the binary grid file so that
      postprocessors can locate the grid in space.
  yorigin:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: y-position origin of the model grid coordinate system
    description: y-position of the origin used for model grid vertices.  This value should be provided
      in a real-world coordinate system.  If not specified, then a default value equal to zero is used.  The
      value for YORIGIN does not affect the model simulation, but it is written to the binary grid file
      so that postprocessors can locate the grid in space.
  angrot:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: rotation angle
    description: counter-clockwise rotation angle (in degrees) of the model grid coordinate system relative
      to a real-world coordinate system.  If not specified, then a default value of 0.0 is assigned.  The
      value for ANGROT does not affect the model simulation, but it is written to the binary grid file
      so that postprocessors can locate the grid in space.
  export_array_ascii:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: export array variables to layered ascii files.
    description: keyword that specifies input griddata arrays should be written to layered ascii output
      files.
    mf6internal: export_ascii
  export_array_netcdf:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: export array variables to netcdf output files.
    description: keyword that specifies input gridded arrays should be written to the model output NetCDF
      file with attributes that support using the generated file as a MODFLOW 6 simulation input.  This
      option only has an effect when an output model NetCDF file is configured and the simulation is run
      in VALIDATE mode, otherwise it is ignored.
    mf6internal: export_nc
    extended: true
  crs:
    block: options
    type: string
    shape: lenbigline
    reader: urword
    optional: true
    longname: CRS user input string
    description: is a real-world coordinate reference system (CRS) for the model, for example, an EPSG
      integer code (e.g. 26915), authority string (i.e. epsg:26915), or Open Geospatial Consortium Well-Known
      Text (WKT) specification. Limited to 5000 characters. The entry for CRS does not affect the model
      simulation, but it is written to the binary grid file so that postprocessors can locate the grid
      in space.
    preserve_case: true
  packagedata:
    block: options
    type: record ncf6 filein ncf6_filename
    reader: urword
    optional: true
    description: Contains data for the ncf package. Data can be passed as a dictionary to the ncf package
      with variable names as keys and package data as values. Data for the packagedata variable is also
      acceptable. See ncf package documentation for more information.
    tagged: true
    ref:
      parent: parent_package
      key: ncf_filerecord
      val: packagedata
      abbr: ncf
      param: packagedata
dimensions:
  nlay:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of layers
    description: is the number of layers in the model grid.
  ncpl:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of cells per layer
    description: is the number of cells per layer.  This is a constant value for the grid and it applies
      to all layers.
  nvert:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of vertices
    description: is the total number of (x, y) vertex pairs used to characterize the horizontal configuration
      of the model grid.
griddata:
  top:
    block: griddata
    type: double precision
    shape: (ncpl)
    reader: readarray
    longname: model top elevation
    description: is the top elevation for each cell in the top model layer.
    netcdf: true
  botm:
    block: griddata
    type: double precision
    shape: (ncpl, nlay)
    reader: readarray
    longname: model bottom elevation
    description: is the bottom elevation for each cell.
    layered: true
    netcdf: true
  idomain:
    block: griddata
    type: integer
    shape: (ncpl, nlay)
    reader: readarray
    optional: true
    longname: idomain existence array
    description: is an optional array that characterizes the existence status of a cell.  If the IDOMAIN
      array is not specified, then all model cells exist within the solution.  If the IDOMAIN value for
      a cell is 0, the cell does not exist in the simulation.  Input and output values will be read and
      written for the cell, but internal to the program, the cell is excluded from the solution.  If the
      IDOMAIN value for a cell is 1 or greater, the cell exists in the simulation.  If the IDOMAIN value
      for a cell is -1, the cell does not exist in the simulation.  Furthermore, the first existing cell
      above will be connected to the first existing cell below.  This type of cell is referred to as a
      'vertical pass through' cell.
    layered: true
    netcdf: true
vertices:
  vertices:
    block: vertices
    type: recarray
    shape: (nvert)
    reader: urword
    optional: false
    longname: vertices data
    item:
      type: record
      block: vertices
      reader: urword
      optional: false
      longname: vertices data
      fields:
        iv:
          block: vertices
          type: integer
          reader: urword
          optional: false
          longname: vertex number
          description: is the vertex number.  Records in the VERTICES block must be listed in consecutive
            order from 1 to NVERT.
          in_record: true
          tagged: false
          numeric_index: true
        xv:
          block: vertices
          type: double precision
          reader: urword
          optional: false
          longname: x-coordinate for vertex
          description: is the x-coordinate for the vertex.
          in_record: true
          tagged: false
        yv:
          block: vertices
          type: double precision
          reader: urword
          optional: false
          longname: y-coordinate for vertex
          description: is the y-coordinate for the vertex.
          in_record: true
          tagged: false
cell2d:
  cell2d:
    block: cell2d
    type: recarray
    shape: (ncpl)
    reader: urword
    optional: false
    longname: cell2d data
    item:
      type: record
      block: cell2d
      reader: urword
      optional: false
      longname: cell2d data
      fields:
        icell2d:
          block: cell2d
          type: integer
          reader: urword
          optional: false
          longname: cell2d number
          description: is the CELL2D number.  Records in the CELL2D block must be listed in consecutive
            order from the first to the last.
          in_record: true
          tagged: false
          numeric_index: true
        xc:
          block: cell2d
          type: double precision
          reader: urword
          optional: false
          longname: x-coordinate for cell center
          description: is the x-coordinate for the cell center.
          in_record: true
          tagged: false
        yc:
          block: cell2d
          type: double precision
          reader: urword
          optional: false
          longname: y-coordinate for cell center
          description: is the y-coordinate for the cell center.
          in_record: true
          tagged: false
        ncvert:
          block: cell2d
          type: integer
          reader: urword
          optional: false
          longname: number of cell vertices
          description: is the number of vertices required to define the cell.  There may be a different
            number of vertices for each cell.
          in_record: true
          tagged: false
        icvert:
          block: cell2d
          type: integer
          shape: (ncvert)
          reader: urword
          optional: false
          longname: array of vertex numbers
          description: is an array of integer values containing vertex numbers (in the VERTICES block)
            used to define the cell.  Vertices must be listed in clockwise order.  Cells that are connected
            must share vertices.
          in_record: true
          tagged: false
          numeric_index: true
