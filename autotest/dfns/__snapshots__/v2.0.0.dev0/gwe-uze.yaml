name: gwe-uze
advanced: true
multi: true
schema_version: 2.0.0.dev0
fkeys:
  ts_filerecord:
    parent: parent_package
    key: ts_filerecord
    val: timeseries
    abbr: ts
    param: timeseries
    description: xxx
  obs_filerecord:
    parent: parent_model_or_package
    key: obs_filerecord
    val: observations
    abbr: obs
    param: continuous
options:
  flow_package_name:
    block: options
    type: string
    reader: urword
    optional: true
    longname: keyword to specify name of corresponding flow package
    description: keyword to specify the name of the corresponding flow package.  If not specified, then
      the corresponding flow package must have the same name as this advanced transport package (the name
      associated with this package in the GWE name file).
    mf6internal: flow_pkg_name
  auxiliary:
    block: options
    type: string
    shape: (naux)
    reader: urword
    optional: true
    longname: keyword to specify aux variables
    description: defines an array of one or more auxiliary variable names.  There is no limit on the number
      of auxiliary variables that can be provided on this line; however, lists of information provided
      in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The
      number of auxiliary variables detected on this line determines the value for naux.  Comments cannot
      be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
      variables may not be used by the package, but they will be available for use by other parts of the
      program.  The program will terminate with an error if auxiliary variables are specified on more
      than one line in the options block.
  flow_package_auxiliary_name:
    block: options
    type: string
    reader: urword
    optional: true
    longname: keyword to specify name of concentration auxiliary variable in flow package
    description: keyword to specify the name of an auxiliary variable in the corresponding flow package.  If
      specified, then the simulated temperatures from this advanced transport package will be copied into
      the auxiliary variable specified with this name.  Note that the flow package must have an auxiliary
      variable with this name or the program will terminate with an error.  If the flows for this advanced
      transport package are read from a file, then this option will have no effect.
    mf6internal: fp_aux_name
  boundnames:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that boundary names may be provided with the list of unsaturated
      zone flow cells.
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that the list of unsaturated zone flow information will be written
      to the listing file immediately after it is read.
    mf6internal: iprpak
  print_temperature:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated temperatures to listing file
    description: keyword to indicate that the list of UZF cell {#2} will be printed to the listing file
      for every stress period in which 'TEMPERATURE PRINT' is specified in Output Control.  If there is
      no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last time step
      of each stress period.
    mf6internal: iprconc
  print_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated flows to listing file
    description: keyword to indicate that the list of unsaturated zone flow rates will be printed to the
      listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If
      there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for
      the last time step of each stress period.
    mf6internal: iprflow
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: save UZE cell flows to budget file
    description: keyword to indicate that unsaturated zone flow terms will be written to the file specified
      with 'BUDGET FILEOUT' in Output Control.
    mf6internal: ipakcb
  temperature_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: temp_filerec
    fields:
      temperature:
        block: period
        type: double precision
        reader: urword
        longname: unsaturated zone flow cell temperature
        description: real or character value that defines the temperature for the unsaturated zone flow
          cell. The specified TEMPERATURE is only applied if the unsaturated zone flow cell is a constant
          temperature cell. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
          Input' section), values can be obtained from a time series by entering the time-series name
          in place of a numeric value.
        tagged: true
        in_record: true
        time_series: true
      tempfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the binary output file to write temperature information.
        preserve_case: true
        in_record: true
        tagged: false
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
  budget_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: budfilerec
    fields:
      budget:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget.
        in_record: true
        tagged: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the binary output file to write budget information.
        preserve_case: true
        in_record: true
        tagged: false
  budgetcsv_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: budcsvfilerec
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetcsv:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget CSV.
        in_record: true
        tagged: true
      budgetcsvfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma-separated value (CSV) output file to write budget summary information.  A
          budget summary record will be written to this file for each time step of the simulation.
        preserve_case: true
        in_record: true
        tagged: false
  timeseries:
    block: options
    type: record ts6 filein ts6_filename
    reader: urword
    optional: true
    description: Contains data for the ts package. Data can be passed as a dictionary to the ts package
      with variable names as keys and package data as values. Data for the timeseries variable is also
      acceptable. See ts package documentation for more information.
    tagged: true
    ref:
      parent: parent_package
      key: ts_filerecord
      val: timeseries
      abbr: ts
      param: timeseries
      description: xxx
  observations:
    block: options
    type: record obs6 filein obs6_filename
    reader: urword
    optional: true
    description: Contains data for the obs package. Data can be passed as a dictionary to the obs package
      with variable names as keys and package data as values. Data for the observations variable is also
      acceptable. See obs package documentation for more information.
    tagged: true
    ref:
      parent: parent_model_or_package
      key: obs_filerecord
      val: observations
      abbr: obs
      param: continuous
  dev_nonexpanding_matrix:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: do not add rows to the solution matrix
    description: keyword that solves the feature temperature with a general mixing equation and adds the
      result to the right-hand side of the GWE equations, instead of adding a row to the solution matrix
      for each feature.  This development option is not supported.
    mf6internal: dev_nonexpanding
packagedata:
  packagedata:
    block: packagedata
    type: recarray
    shape: (nuzfcells)
    reader: urword
    item:
      type: record
      block: packagedata
      reader: urword
      fields:
        uzfno:
          block: period
          type: integer
          reader: urword
          longname: unsaturated zone flow cell number for this entry
          description: integer value that defines the UZF cell number associated with the specified PERIOD
            data on the line. UZFNO must be greater than zero and less than or equal to NUZFCELLS.
          mf6internal: ifno
          tagged: false
          in_record: true
          numeric_index: true
        strt:
          block: packagedata
          type: double precision
          reader: urword
          longname: starting UZF cell temperature
          description: real value that defines the starting temperature for the unsaturated zone flow
            cell.
          tagged: false
          in_record: true
        aux:
          block: packagedata
          type: double precision
          shape: (naux)
          reader: urword
          optional: true
          longname: auxiliary variables
          description: represents the values of the auxiliary variables for each unsaturated zone flow.
            The values of auxiliary variables must be present for each unsaturated zone flow. The values
            must be specified in the order of the auxiliary variables specified in the OPTIONS block.  If
            the package supports time series and the Options block includes a TIMESERIESFILE entry (see
            the 'Time-Variable Input' section), values can be obtained from a time series by entering
            the time-series name in place of a numeric value.
          in_record: true
          tagged: false
          time_series: true
        boundname:
          block: packagedata
          type: string
          reader: urword
          optional: true
          longname: UZF cell name
          description: name of the unsaturated zone flow cell.  BOUNDNAME is an ASCII character variable
            that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire
            name must be enclosed within single quotes.
          tagged: false
          in_record: true
period:
  transient_block: true
  uzeperioddata:
    block: period
    type: recarray
    reader: urword
    item:
      type: record
      block: period
      reader: urword
      fields:
        uzfno:
          block: period
          type: integer
          reader: urword
          longname: unsaturated zone flow cell number for this entry
          description: integer value that defines the UZF cell number associated with the specified PERIOD
            data on the line. UZFNO must be greater than zero and less than or equal to NUZFCELLS.
          mf6internal: ifno
          tagged: false
          in_record: true
          numeric_index: true
        uzesetting:
          block: period
          type: keystring
          reader: urword
          description: 'line of information that is parsed into a keyword and values.  Keyword values
            that can be used to start the UZESETTING string include: STATUS, TEMPERATURE, INFILTRATION,
            UZET, and AUXILIARY.  These settings are used to assign the temperature associated with the
            corresponding flow terms.  Temperatures cannot be specified for all flow terms.'
          tagged: false
          in_record: true
          choices:
            temperature:
              block: period
              type: double precision
              reader: urword
              longname: unsaturated zone flow cell temperature
              description: real or character value that defines the temperature for the unsaturated zone
                flow cell. The specified TEMPERATURE is only applied if the unsaturated zone flow cell
                is a constant temperature cell. If the Options block includes a TIMESERIESFILE entry (see
                the 'Time-Variable Input' section), values can be obtained from a time series by entering
                the time-series name in place of a numeric value.
              tagged: true
              in_record: true
              time_series: true
            status:
              block: period
              type: string
              reader: urword
              longname: unsaturated zone flow cell temperature status
              description: keyword option to define UZF cell status.  STATUS can be ACTIVE, INACTIVE,
                or CONSTANT. By default, STATUS is ACTIVE, which means that temperature will be calculated
                for the UZF cell.  If a UZF cell is inactive, then there will be no energy fluxes into
                or out of the UZF cell and the inactive value will be written for the UZF cell temperature.  If
                a UZF cell is constant, then the temperature for the UZF cell will be fixed at the user
                specified value.
              tagged: true
              in_record: true
            infiltration:
              block: period
              type: double precision
              reader: urword
              longname: infiltration temperature
              description: real or character value that defines the temperature of the infiltration $(e.g.,:^{circ}C:or:^{circ}F)$
                for the UZF cell. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              tagged: true
              in_record: true
              time_series: true
            uzet:
              block: period
              type: double precision
              reader: urword
              longname: unsaturated zone et temperature
              description: real or character value that states what fraction of the simulated unsaturated
                zone evapotranspiration is associated with evaporation.  The evaporative losses from the
                unsaturated zone moisture content will have an evaporative cooling effect on the GWE cell
                from which the evaporation originated. If this value is larger than 1, then it will be
                reset to 1.  If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              tagged: true
              in_record: true
              time_series: true
            auxiliaryrecord:
              block: period
              type: record
              reader: urword
              in_record: true
              fields:
                auxiliary:
                  block: period
                  type: keyword
                  reader: urword
                  description: keyword for specifying auxiliary variable.
                  in_record: true
                  mf6internal: period_auxiliary
                auxname:
                  block: period
                  type: string
                  reader: urword
                  description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match
                    one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does
                    not match one of the auxiliary variable names defined in the OPTIONS block the data
                    are ignored.
                  tagged: false
                  in_record: true
                auxval:
                  block: period
                  type: double precision
                  reader: urword
                  longname: auxiliary variable value
                  description: value for the auxiliary variable. If the Options block includes a TIMESERIESFILE
                    entry (see the 'Time-Variable Input' section), values can be obtained from a time
                    series by entering the time-series name in place of a numeric value.
                  tagged: false
                  in_record: true
                  time_series: true
