name: gwf-lak
advanced: true
multi: true
schema_version: 2.0.0.dev0
fkeys:
  ts_filerecord:
    parent: parent_package
    key: ts_filerecord
    val: timeseries
    abbr: ts
    param: timeseries
    description: xxx
  obs_filerecord:
    parent: parent_model_or_package
    key: obs_filerecord
    val: observations
    abbr: obs
    param: continuous
subcomponents:
  - utl-laktab
options:
  auxiliary:
    block: options
    type: string
    shape: (naux)
    reader: urword
    optional: true
    longname: keyword to specify aux variables
    description: defines an array of one or more auxiliary variable names.  There is no limit on the number
      of auxiliary variables that can be provided on this line; however, lists of information provided
      in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The
      number of auxiliary variables detected on this line determines the value for naux.  Comments cannot
      be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
      variables may not be used by the package, but they will be available for use by other parts of the
      program.  The program will terminate with an error if auxiliary variables are specified on more
      than one line in the options block.
  boundnames:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that boundary names may be provided with the list of lake cells.
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that the list of lake information will be written to the listing
      file immediately after it is read.
    mf6internal: iprpak
  print_stage:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated stages to listing file
    description: keyword to indicate that the list of lake {#2} will be printed to the listing file for
      every stress period in which 'HEAD PRINT' is specified in Output Control.  If there is no Output
      Control option and PRINT_{#3} is specified, then {#2} are printed for the last time step of each
      stress period.
  print_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated flows to listing file
    description: keyword to indicate that the list of lake flow rates will be printed to the listing file
      for every stress period time step in which 'BUDGET PRINT' is specified in Output Control.  If there
      is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are printed for the
      last time step of each stress period.
    mf6internal: iprflow
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: save lake flows to budget file
    description: keyword to indicate that lake flow terms will be written to the file specified with 'BUDGET
      FILEOUT' in Output Control.
    mf6internal: ipakcb
  stage_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    fields:
      stage:
        block: period
        type: double precision
        reader: urword
        longname: lake stage
        description: real or character value that defines the stage for the lake. The specified STAGE
          is only applied if the lake is a constant stage lake. If the Options block includes a TIMESERIESFILE
          entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
          entering the time-series name in place of a numeric value.
        mf6dimension: (nlakes)
        tagged: true
        in_record: true
        time_series: true
      stagefile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the binary output file to write stage information.
        preserve_case: true
        in_record: true
        tagged: false
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
  budget_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    mf6internal: budfilerec
    tagged: true
    fields:
      budget:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget.
        in_record: true
        tagged: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the binary output file to write budget information.
        preserve_case: true
        in_record: true
        tagged: false
  budgetcsv_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    mf6internal: budcsvfilerec
    tagged: true
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetcsv:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget CSV.
        in_record: true
        tagged: true
      budgetcsvfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma-separated value (CSV) output file to write budget summary information.  A
          budget summary record will be written to this file for each time step of the simulation.
        preserve_case: true
        in_record: true
        tagged: false
  package_convergence_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    mf6internal: pkgconvfilerec
    tagged: true
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      package_convergence:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: package_convergence keyword
        description: keyword to specify that record corresponds to the package convergence comma spaced
          values file. A warning message will be issued if package convergence data is requested but the
          IMPLICIT option is specified. In that case the lake stage is included in the Iterative Model
          Solution (IMS) convergence check and the package convergence file is not written.
        in_record: true
        tagged: true
        mf6internal: pkgconv
      package_convergence_filename:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma spaced values output file to write package convergence information.
        in_record: true
        tagged: false
        mf6internal: pkgconvfname
  timeseries:
    block: options
    type: record ts6 filein ts6_filename
    reader: urword
    optional: true
    description: Contains data for the ts package. Data can be passed as a dictionary to the ts package
      with variable names as keys and package data as values. Data for the timeseries variable is also
      acceptable. See ts package documentation for more information.
    tagged: true
    ref:
      parent: parent_package
      key: ts_filerecord
      val: timeseries
      abbr: ts
      param: timeseries
      description: xxx
  observations:
    block: options
    type: record obs6 filein obs6_filename
    reader: urword
    optional: true
    description: Contains data for the obs package. Data can be passed as a dictionary to the obs package
      with variable names as keys and package data as values. Data for the observations variable is also
      acceptable. See obs package documentation for more information.
    tagged: true
    ref:
      parent: parent_model_or_package
      key: obs_filerecord
      val: observations
      abbr: obs
      param: continuous
  mover:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that this instance of the LAK Package can be used with the Water
      Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within
      the package to store the available, provided, and received water.
    tagged: true
  dev_force_legacy:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: force the legacy solution for every lake
    description: keyword that solves every active lake with the default (legacy) substitution solver under
      the implicit formulation, instead of only those lakes that are too poorly conditioned to solve as
      a matrix unknown.  Cannot be specified with DEV_FORCE_LEGACY_LAKE.  This development option exists
      to test that path and is not supported.
    mf6internal: iforceleg
  dev_force_legacy_lake:
    block: options
    type: integer
    reader: urword
    optional: true
    longname: force the legacy solution for one lake
    description: integer lake number that is solved with the default (legacy) substitution solver under
      the implicit formulation, while the other lakes are solved as matrix unknowns.  Cannot be specified
      with DEV_FORCE_LEGACY.  This development option exists to test that path and is not supported.
    mf6internal: iforceleglak
  dev_groundwater_head_conductance:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: use the groundwater head to calculate horizontal conductance
    description: keyword that calculates the conductance for horizontal connections using the groundwater
      head instead of the lake stage.  This development option is not supported.
    mf6internal: igwhcopt
  dev_maximum_outlet_depth:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: maximum outlet depth
    description: real number value that defines the maximum depth used to calculate outlet flow.  This
      development option is not supported.
    mf6internal: outdmax
  surfdep:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: surface depression depth
    description: real value that defines the surface depression depth for VERTICAL lake-GWF connections.
      If specified, SURFDEP must be greater than or equal to zero. If SURFDEP is not specified, a default
      value of zero is used for all vertical lake-GWF connections.
    mf6internal: surfdep
  implicit:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: solve lake stage in the groundwater flow matrix
    description: keyword that activates the implicit formulation. With this option each lake stage is
      solved as an additional unknown in the groundwater flow matrix, instead of by the default substitution-iteration
      solver. The implicit formulation typically converges in far fewer outer iterations for steady-state
      and strongly coupled lakes and can solve problems for which the default formulation fails to converge.
      Converged results are equivalent to the default formulation. The implicit formulation makes the
      coefficient matrix asymmetric and therefore requires the BICGSTAB linear acceleration in the Iterative
      Model Solution (IMS). Each lake must have at least one groundwater connection when the IMPLICIT
      option is active because the implicit formulation solves the lake stage through its lakebed seepage;
      the program will terminate with an error if a lake with no groundwater connections is specified
      with the IMPLICIT option. The implicit formulation does not yet include the density terms of the
      Buoyancy (BUY) Package, and the program will terminate with an error if the IMPLICIT option is specified
      and the BUY Package is active. If a lake stage becomes too poorly conditioned to solve as a matrix
      unknown, which can happen for a weakly connected or disconnected lake, that lake is solved automatically
      by the default substitution solver instead, so the implicit formulation remains as robust as the
      default formulation. The Newton formulation is recommended for lakes that may become perched (disconnected
      from the aquifer), because results obtained with the standard rewetting (REWET) capability can otherwise
      differ between the two approaches.
    mf6internal: iimplicit
  maximum_iterations:
    block: options
    type: integer
    reader: urword
    optional: true
    longname: LAK Newton-Raphson iterations
    description: integer value that defines the maximum number of Newton-Raphson iterations allowed for
      a lake. By default, MAXIMUM_ITERATIONS is equal to 100. MAXIMUM_ITERATIONS would only need to be
      increased from the default value if one or more lakes in a simulation has a large water budget error.
      This option applies only to the default substitution-iteration solver; when the IMPLICIT option
      is active the lake stage is solved within the groundwater flow matrix and its convergence is controlled
      by the Iterative Model Solution (IMS) settings instead.
    mf6internal: maxlakit
  maximum_stage_change:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: stage closure tolerance
    description: real value that defines the lake stage closure tolerance. By default, MAXIMUM_STAGE_CHANGE
      is equal to $1 times 10^{-5}$. The MAXIMUM_STAGE_CHANGE would only need to be increased or decreased
      from the default value if the water budget error for one or more lakes is too small or too large,
      respectively. This option applies only to the default substitution-iteration solver; when the IMPLICIT
      option is active the lake stage is solved within the groundwater flow matrix and its convergence
      is controlled by the Iterative Model Solution (IMS) settings instead.
    mf6internal: dmaxchg
  time_conversion:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: time conversion factor
    description: real value that is used to convert user-specified Manning's roughness coefficients or
      gravitational acceleration used to calculate outlet flows from seconds to model time units. TIME_CONVERSION
      should be set to 1.0, 60.0, 3,600.0, 86,400.0, and 31,557,600.0 when using time units (TIME_UNITS)
      of seconds, minutes, hours, days, or years in the simulation, respectively. TIME_CONVERSION does
      not need to be specified if no lake outlets are specified or TIME_UNITS are seconds.
    mf6internal: convtime
  length_conversion:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: length conversion factor
    description: real value that is used to convert outlet user-specified Manning's roughness coefficients
      or gravitational acceleration used to calculate outlet flows from meters to model length units.
      LENGTH_CONVERSION should be set to 3.28081, 1.0, and 100.0 when using length units (LENGTH_UNITS)
      of feet, meters, or centimeters in the simulation, respectively. LENGTH_CONVERSION does not need
      to be specified if no lake outlets are specified or LENGTH_UNITS are meters.
    mf6internal: convlength
  dev_no_final_check:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: disable final convergence check for lake stages
    description: flag disabling the final convergence check of the change in lake stages. By default this
      check is enabled.
    mf6internal: iconvchk
dimensions:
  nlakes:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of lakes
    description: value specifying the number of lakes that will be simulated for all stress periods.
  noutlets:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of outlets
    description: value specifying the number of outlets that will be simulated for all stress periods.
      If NOUTLETS is not specified, a default value of zero is used.
  ntables:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of tables
    description: value specifying the number of lakes tables that will be used to define the lake stage,
      volume relation, and surface area. If NTABLES is not specified, a default value of zero is used.
packagedata:
  packagedata:
    block: packagedata
    type: recarray
    shape: (nlakes)
    reader: urword
    item:
      type: record
      block: packagedata
      reader: urword
      fields:
        ifno:
          block: tables
          type: integer
          reader: urword
          longname: lake number for this entry
          description: integer value that defines the feature (lake) number associated with the specified
            TABLES data on the line. IFNO must be greater than zero and less than or equal to NLAKES.
            The program will terminate with an error if table information for a lake is specified more
            than once or the number of specified tables is less than NTABLES.
          tagged: false
          in_record: true
          numeric_index: true
          mf6internal: tables_ifno
        strt:
          block: packagedata
          type: double precision
          reader: urword
          longname: starting lake stage
          description: real value that defines the starting stage for the lake.
          tagged: false
          in_record: true
        nlakeconn:
          block: packagedata
          type: integer
          reader: urword
          longname: number of lake connections
          description: integer value that defines the number of GWF cells connected to this (IFNO) lake.
            There can only be one vertical lake connection to each GWF cell. NLAKECONN must be greater
            than zero.
          tagged: false
          in_record: true
        aux:
          block: packagedata
          type: double precision
          shape: (naux)
          reader: urword
          optional: true
          longname: auxiliary variables
          description: represents the values of the auxiliary variables for each lake. The values of auxiliary
            variables must be present for each lake. The values must be specified in the order of the
            auxiliary variables specified in the OPTIONS block.  If the package supports time series and
            the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          in_record: true
          tagged: false
          time_series: true
        boundname:
          block: packagedata
          type: string
          reader: urword
          optional: true
          longname: well name
          description: name of the lake cell.  BOUNDNAME is an ASCII character variable that can contain
            as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must be
            enclosed within single quotes.
          tagged: false
          in_record: true
connectiondata:
  connectiondata:
    block: connectiondata
    type: recarray
    shape: (sum(nlakeconn))
    reader: urword
    item:
      type: record
      block: connectiondata
      reader: urword
      fields:
        ifno:
          block: tables
          type: integer
          reader: urword
          longname: lake number for this entry
          description: integer value that defines the feature (lake) number associated with the specified
            TABLES data on the line. IFNO must be greater than zero and less than or equal to NLAKES.
            The program will terminate with an error if table information for a lake is specified more
            than once or the number of specified tables is less than NTABLES.
          tagged: false
          in_record: true
          numeric_index: true
          mf6internal: tables_ifno
        iconn:
          block: connectiondata
          type: integer
          reader: urword
          longname: connection number for this entry
          description: integer value that defines the GWF connection number for this lake connection entry.
            ICONN must be greater than zero and less than or equal to NLAKECONN for lake IFNO.
          tagged: false
          in_record: true
          numeric_index: true
        cellid:
          block: connectiondata
          type: integer
          shape: (ncelldim)
          reader: urword
          longname: cell identifier
          description: is the cell identifier, and depends on the type of grid that is used for the simulation.  For
            a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For
            a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model
            uses the unstructured discretization (DISU) input file, CELLID is the node number for the
            cell.
          tagged: false
          in_record: true
        claktype:
          block: connectiondata
          type: string
          reader: urword
          longname: lake connection type
          description: 'character string that defines the lake-GWF connection type for the lake connection.
            Possible lake-GWF connection type strings include:  VERTICAL--character keyword to indicate
            the lake-GWF connection is vertical  and connection conductance calculations use the hydraulic
            conductivity corresponding to the $K_{33}$ tensor component defined for CELLID in the NPF
            package. HORIZONTAL--character keyword to indicate the lake-GWF connection is horizontal and
            connection conductance calculations use the hydraulic conductivity corresponding to the $K_{11}$
            tensor component defined for CELLID in the NPF package. EMBEDDEDH--character keyword to indicate
            the lake-GWF connection is embedded in a single cell and connection conductance calculations
            use the hydraulic conductivity corresponding to the $K_{11}$ tensor component defined for
            CELLID in the NPF package. EMBEDDEDV--character keyword to indicate the lake-GWF connection
            is embedded in a single cell and connection conductance calculations use the hydraulic conductivity
            corresponding to the $K_{33}$ tensor component defined for CELLID in the NPF package. Embedded
            lakes can only be connected to a single cell (NLAKECONN = 1) and there must be a lake table
            associated with each embedded lake.'
          tagged: false
          in_record: true
        bedleak:
          block: connectiondata
          type: string
          reader: urword
          longname: bed leakance
          description: real value or character string that defines the bed leakance for the lake-GWF connection.
            BEDLEAK must be greater than or equal to zero, equal to the DNODATA value (3.0E+30), or specified
            to be NONE. If DNODATA or NONE is specified for BEDLEAK, the lake-GWF connection conductance
            is solely a function of aquifer properties in the connected GWF cell and lakebed sediments
            are assumed to be absent. Warning messages will be issued if NONE is specified. Eventually
            the ability to specify NONE will be deprecated and cause MODFLOW 6 to terminate with an error.
          tagged: false
          in_record: true
        belev:
          block: connectiondata
          type: double precision
          reader: urword
          longname: bottom elevation
          description: real value that defines the bottom elevation for a HORIZONTAL lake-GWF connection.
            Any value can be specified if CLAKTYPE is VERTICAL, EMBEDDEDH, or EMBEDDEDV. If CLAKTYPE is
            HORIZONTAL and BELEV is not equal to TELEV, BELEV must be greater than or equal to the bottom
            of the GWF cell CELLID. If BELEV is equal to TELEV, BELEV is reset to the bottom of the GWF
            cell CELLID.
          tagged: false
          in_record: true
        telev:
          block: connectiondata
          type: double precision
          reader: urword
          longname: top elevation
          description: real value that defines the top elevation for a HORIZONTAL lake-GWF connection.
            Any value can be specified if CLAKTYPE is VERTICAL, EMBEDDEDH, or EMBEDDEDV. If CLAKTYPE is
            HORIZONTAL and TELEV is not equal to BELEV, TELEV must be less than or equal to the top of
            the GWF cell CELLID. If TELEV is equal to BELEV, TELEV is reset to the top of the GWF cell
            CELLID.
          tagged: false
          in_record: true
        connlen:
          block: connectiondata
          type: double precision
          reader: urword
          longname: connection length
          description: real value that defines the distance between the connected GWF CELLID node and
            the lake for a HORIZONTAL, EMBEDDEDH, or EMBEDDEDV lake-GWF connection. CONLENN must be greater
            than zero for a HORIZONTAL, EMBEDDEDH, or EMBEDDEDV lake-GWF connection. Any value can be
            specified if CLAKTYPE is VERTICAL.
          tagged: false
          in_record: true
        connwidth:
          block: connectiondata
          type: double precision
          reader: urword
          longname: connection width
          description: real value that defines the connection face width for a HORIZONTAL lake-GWF connection.
            CONNWIDTH must be greater than zero for a HORIZONTAL lake-GWF connection. Any value can be
            specified if CLAKTYPE is VERTICAL, EMBEDDEDH, or EMBEDDEDV.
          tagged: false
          in_record: true
tables:
  tables:
    block: tables
    type: recarray
    shape: (ntables)
    reader: urword
    optional: true
    item:
      type: record
      block: tables
      reader: urword
      optional: true
      fields:
        filein:
          block: tables
          type: keyword
          reader: urword
          optional: false
          longname: file keyword
          description: keyword to specify that an input filename is expected next.
          mf6internal: tables_filein
          in_record: true
          tagged: true
        ifno:
          block: tables
          type: integer
          reader: urword
          longname: lake number for this entry
          description: integer value that defines the feature (lake) number associated with the specified
            TABLES data on the line. IFNO must be greater than zero and less than or equal to NLAKES.
            The program will terminate with an error if table information for a lake is specified more
            than once or the number of specified tables is less than NTABLES.
          tagged: false
          in_record: true
          numeric_index: true
          mf6internal: tables_ifno
        tab6:
          block: tables
          type: keyword
          reader: urword
          optional: false
          longname: head keyword
          description: keyword to specify that record corresponds to a table file.
          in_record: true
          tagged: true
        tab6_filename:
          block: tables
          type: string
          reader: urword
          optional: false
          longname: table file name
          description: character string that defines the path and filename for the file containing lake
            table data for the lake connection. The TAB6_FILENAME file includes the number of entries
            in the file and the relation between stage, volume, and surface area for each entry in the
            file. Lake table files for EMBEDDEDH and EMBEDDEDV lake-GWF connections also include lake-GWF
            exchange area data for each entry in the file. Instructions for creating the TAB6_FILENAME
            input file are provided in Lake Table Input File section.
          mf6internal: laktab6_filename
          preserve_case: true
          in_record: true
          tagged: false
outlets:
  outlets:
    block: outlets
    type: recarray
    shape: (noutlets)
    reader: urword
    optional: true
    item:
      type: record
      block: outlets
      reader: urword
      optional: true
      fields:
        outletno:
          block: outlets
          type: integer
          reader: urword
          longname: outlet number for this entry
          description: integer value that defines the outlet number associated with the specified OUTLETS
            data on the line. OUTLETNO must be greater than zero and less than or equal to NOUTLETS. Outlet
            information must be specified for every outlet or the program will terminate with an error.
            The program will also terminate with an error if information for a outlet is specified more
            than once.
          tagged: false
          in_record: true
          numeric_index: true
          mf6internal: outlets_outletno
        lakein:
          block: outlets
          type: integer
          reader: urword
          longname: lake number for upstream lake
          description: integer value that defines the lake number that outlet is connected to. LAKEIN
            must be greater than zero and less than or equal to NLAKES.
          tagged: false
          in_record: true
          numeric_index: true
        lakeout:
          block: outlets
          type: integer
          reader: urword
          longname: lake number for downstream lake
          description: integer value that defines the lake number that outlet discharge from lake outlet
            OUTLETNO is routed to. LAKEOUT must be greater than or equal to zero and less than or equal
            to NLAKES. If LAKEOUT is zero, outlet discharge from lake outlet OUTLETNO is discharged to
            an external boundary.
          tagged: false
          in_record: true
          numeric_index: true
        couttype:
          block: outlets
          type: string
          reader: urword
          longname: outlet type
          description: 'character string that defines the outlet type for the outlet OUTLETNO. Possible
            COUTTYPE strings include: SPECIFIED--character keyword to indicate the outlet is defined as
            a specified flow.  MANNING--character keyword to indicate the outlet is defined using Manning''s
            equation. WEIR--character keyword to indicate the outlet is defined using a sharp weir equation.'
          tagged: false
          in_record: true
        invert:
          block: period
          type: double precision
          reader: urword
          longname: invert elevation
          description: real or character value that defines the invert elevation for the lake outlet.
            A specified INVERT value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO
            is not SPECIFIED. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
            Input' section), values can be obtained from a time series by entering the time-series name
            in place of a numeric value.
          mf6dimension: (noutlets)
          tagged: true
          in_record: true
          time_series: true
        width:
          block: period
          type: double precision
          reader: urword
          longname: outlet width
          description: real or character value that defines the width of the lake outlet. A specified
            WIDTH value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO is not SPECIFIED.
            If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          mf6dimension: (noutlets)
          tagged: true
          in_record: true
          time_series: true
        rough:
          block: period
          type: double precision
          reader: urword
          longname: roughness coefficient
          description: real value that defines the roughness coefficient for the lake outlet. Any value
            can be specified if COUTTYPE is not MANNING. If the Options block includes a TIMESERIESFILE
            entry (see the 'Time-Variable Input' section), values can be obtained from a time series by
            entering the time-series name in place of a numeric value.
          mf6dimension: (noutlets)
          tagged: true
          in_record: true
          time_series: true
        slope:
          block: period
          type: double precision
          reader: urword
          longname: bed slope
          description: real or character value that defines the bed slope for the lake outlet. A specified
            SLOPE value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO is MANNING.
            If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
            values can be obtained from a time series by entering the time-series name in place of a numeric
            value.
          mf6dimension: (noutlets)
          tagged: true
          in_record: true
          time_series: true
period:
  transient_block: true
  perioddata:
    block: period
    type: recarray
    reader: urword
    item:
      type: record
      block: period
      reader: urword
      fields:
        number:
          block: period
          type: integer
          reader: urword
          longname: lake or outlet number for this entry
          description: integer value that defines the lake or outlet number associated with the specified
            PERIOD data on the line.  NUMBER must be greater than zero and less than or equal to NLAKES
            for a lake number and less than or equal to NOUTLETS for an outlet number.
          tagged: false
          in_record: true
          numeric_index: true
          mf6internal: ifno
        laksetting:
          block: period
          type: keystring
          reader: urword
          description: 'line of information that is parsed into a keyword and values.  Keyword values
            that can be used to start the LAKSETTING string include both keywords for lake settings and
            keywords for outlet settings.  Keywords for lake settings include: STATUS, STAGE, RAINFALL,
            EVAPORATION, RUNOFF, INFLOW, WITHDRAWAL, and AUXILIARY.  Keywords for outlet settings include
            RATE, INVERT, WIDTH, SLOPE, and ROUGH.'
          tagged: false
          in_record: true
          choices:
            stage:
              block: period
              type: double precision
              reader: urword
              longname: lake stage
              description: real or character value that defines the stage for the lake. The specified
                STAGE is only applied if the lake is a constant stage lake. If the Options block includes
                a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained
                from a time series by entering the time-series name in place of a numeric value.
              mf6dimension: (nlakes)
              tagged: true
              in_record: true
              time_series: true
            invert:
              block: period
              type: double precision
              reader: urword
              longname: invert elevation
              description: real or character value that defines the invert elevation for the lake outlet.
                A specified INVERT value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO
                is not SPECIFIED. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              mf6dimension: (noutlets)
              tagged: true
              in_record: true
              time_series: true
            width:
              block: period
              type: double precision
              reader: urword
              longname: outlet width
              description: real or character value that defines the width of the lake outlet. A specified
                WIDTH value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO is not
                SPECIFIED. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              mf6dimension: (noutlets)
              tagged: true
              in_record: true
              time_series: true
            rough:
              block: period
              type: double precision
              reader: urword
              longname: roughness coefficient
              description: real value that defines the roughness coefficient for the lake outlet. Any
                value can be specified if COUTTYPE is not MANNING. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              mf6dimension: (noutlets)
              tagged: true
              in_record: true
              time_series: true
            slope:
              block: period
              type: double precision
              reader: urword
              longname: bed slope
              description: real or character value that defines the bed slope for the lake outlet. A specified
                SLOPE value is only used for active lakes if COUTTYPE for lake outlet OUTLETNO is MANNING.
                If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
                values can be obtained from a time series by entering the time-series name in place of
                a numeric value.
              mf6dimension: (noutlets)
              tagged: true
              in_record: true
              time_series: true
            status:
              block: period
              type: string
              reader: urword
              longname: lake status
              description: keyword option to define lake status.  STATUS can be ACTIVE, INACTIVE, or CONSTANT.
                By default, STATUS is ACTIVE.
              tagged: true
              in_record: true
            rainfall:
              block: period
              type: double precision
              reader: urword
              longname: rainfall rate
              description: real or character value that defines the rainfall rate $(LT^{-1})$ for the
                lake. Value must be greater than or equal to zero. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              mf6dimension: (nlakes)
              tagged: true
              in_record: true
              time_series: true
            evaporation:
              block: period
              type: double precision
              reader: urword
              longname: evaporation rate
              description: real or character value that defines the maximum evaporation rate $(LT^{-1})$
                for the lake. Value must be greater than or equal to zero. If the Options block includes
                a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained
                from a time series by entering the time-series name in place of a numeric value.
              mf6dimension: (nlakes)
              tagged: true
              in_record: true
              time_series: true
            runoff:
              block: period
              type: double precision
              reader: urword
              longname: runoff rate
              description: real or character value that defines the runoff rate $(L^3 T^{-1})$ for the
                lake. Value must be greater than or equal to zero. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              mf6dimension: (nlakes)
              tagged: true
              in_record: true
              time_series: true
            inflow:
              block: period
              type: double precision
              reader: urword
              longname: inflow rate
              description: real or character value that defines the volumetric inflow rate $(L^3 T^{-1})$
                for the lake. Value must be greater than or equal to zero. If the Options block includes
                a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained
                from a time series by entering the time-series name in place of a numeric value. By default,
                inflow rates are zero for each lake.
              mf6dimension: (nlakes)
              tagged: true
              in_record: true
              time_series: true
            withdrawal:
              block: period
              type: double precision
              reader: urword
              longname: maximum withdrawal rate
              description: real or character value that defines the maximum withdrawal rate $(L^3 T^{-1})$
                for the lake. Value must be greater than or equal to zero. If the Options block includes
                a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained
                from a time series by entering the time-series name in place of a numeric value.
              mf6dimension: (nlakes)
              tagged: true
              in_record: true
              time_series: true
            rate:
              block: period
              type: double precision
              reader: urword
              longname: extraction rate
              description: real or character value that defines the extraction rate for the lake outflow.
                A positive value indicates inflow and a negative value indicates outflow from the lake.
                RATE only applies to outlets associated with active lakes (STATUS is ACTIVE). A specified
                RATE is only applied if COUTTYPE for the OUTLETNO is SPECIFIED. If the Options block includes
                a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained
                from a time series by entering the time-series name in place of a numeric value. By default,
                the RATE for each SPECIFIED lake outlet is zero.
              mf6dimension: (noutlets)
              tagged: true
              in_record: true
              time_series: true
            auxiliaryrecord:
              block: period
              type: record
              reader: urword
              mf6internal: auxrecord
              in_record: true
              fields:
                auxiliary:
                  block: period
                  type: keyword
                  reader: urword
                  description: keyword for specifying auxiliary variable.
                  in_record: true
                  mf6internal: period_auxiliary
                auxname:
                  block: period
                  type: string
                  reader: urword
                  description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match
                    one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does
                    not match one of the auxiliary variable names defined in the OPTIONS block the data
                    are ignored.
                  tagged: false
                  in_record: true
                auxval:
                  block: period
                  type: double precision
                  reader: urword
                  longname: auxiliary variable value
                  description: value for the auxiliary variable. If the Options block includes a TIMESERIESFILE
                    entry (see the 'Time-Variable Input' section), values can be obtained from a time
                    series by entering the time-series name in place of a numeric value.
                  tagged: false
                  in_record: true
                  time_series: true
