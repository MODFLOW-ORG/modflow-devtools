name: gwf-oc
advanced: false
multi: false
schema_version: 2.0.0.dev0
options:
  budget_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: budfilerec
    fields:
      budget:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget.
        in_record: true
        tagged: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the output file to write budget information. Data are written to this file
          only for time steps in which SAVE BUDGET is specified in a PERIOD block. If SAVE BUDGET is specified
          in a PERIOD block and this file is not specified, MODFLOW 6 will terminate with an error.
        preserve_case: true
        in_record: true
        tagged: false
  budgetcsv_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: budcsvfilerec
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetcsv:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget CSV.
        in_record: true
        tagged: true
      budgetcsvfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma-separated value (CSV) output file to write budget summary information.
          If specified, a budget summary record will be written to this file for every time step of the
          simulation.
        preserve_case: true
        in_record: true
        tagged: false
  head_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    mf6internal: headfilerec
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      head:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: head keyword
        description: keyword to specify that record corresponds to head.
        in_record: true
        tagged: true
      headfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the output file to write head information.
        preserve_case: true
        in_record: true
        tagged: false
  headprintrecord:
    block: options
    type: record
    reader: urword
    optional: true
    mf6internal: headprintrec
    fields:
      head:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: head keyword
        description: keyword to specify that record corresponds to head.
        in_record: true
        tagged: true
      print_format:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: keyword to indicate that a print format follows
        description: keyword to specify format for printing to the listing file.
        in_record: true
        tagged: true
period:
  transient_block: true
  saverecord:
    block: period
    type: record
    reader: urword
    optional: true
    tagged: false
    fields:
      save:
        block: period
        type: keyword
        reader: urword
        optional: false
        longname: keyword to save
        description: keyword to indicate that information will be saved this stress period.
        in_record: true
        tagged: true
      rtype:
        block: period
        type: string
        reader: urword
        optional: false
        longname: record type
        description: type of information to save or print.  Can be BUDGET or HEAD.
        in_record: true
        tagged: false
      ocsetting:
        block: period
        type: keystring
        reader: urword
        description: specifies the steps for which the data will be saved.
        tagged: false
        in_record: true
        choices:
          all:
            block: period
            type: keyword
            reader: urword
            description: keyword to indicate save for all time steps in period.
            in_record: true
          first:
            block: period
            type: keyword
            reader: urword
            description: keyword to indicate save for first step in period. This keyword may be used in
              conjunction with other keywords to print or save results for multiple time steps.
            in_record: true
          last:
            block: period
            type: keyword
            reader: urword
            description: keyword to indicate save for last step in period. This keyword may be used in
              conjunction with other keywords to print or save results for multiple time steps.
            in_record: true
          frequency:
            block: period
            type: integer
            reader: urword
            description: save at the specified time step frequency. This keyword may be used in conjunction
              with other keywords to print or save results for multiple time steps.
            tagged: true
            in_record: true
          steps:
            block: period
            type: integer
            shape: (<nstp)
            reader: urword
            description: save for each step specified in STEPS. This keyword may be used in conjunction
              with other keywords to print or save results for multiple time steps.
            tagged: true
            in_record: true
  printrecord:
    block: period
    type: record
    reader: urword
    optional: true
    tagged: false
    fields:
      print:
        block: period
        type: keyword
        reader: urword
        optional: false
        longname: keyword to save
        description: keyword to indicate that information will be printed this stress period.
        in_record: true
        tagged: true
      rtype:
        block: period
        type: string
        reader: urword
        optional: false
        longname: record type
        description: type of information to save or print.  Can be BUDGET or HEAD.
        in_record: true
        tagged: false
      ocsetting:
        block: period
        type: keystring
        reader: urword
        description: specifies the steps for which the data will be saved.
        tagged: false
        in_record: true
        choices:
          all:
            block: period
            type: keyword
            reader: urword
            description: keyword to indicate save for all time steps in period.
            in_record: true
          first:
            block: period
            type: keyword
            reader: urword
            description: keyword to indicate save for first step in period. This keyword may be used in
              conjunction with other keywords to print or save results for multiple time steps.
            in_record: true
          last:
            block: period
            type: keyword
            reader: urword
            description: keyword to indicate save for last step in period. This keyword may be used in
              conjunction with other keywords to print or save results for multiple time steps.
            in_record: true
          frequency:
            block: period
            type: integer
            reader: urword
            description: save at the specified time step frequency. This keyword may be used in conjunction
              with other keywords to print or save results for multiple time steps.
            tagged: true
            in_record: true
          steps:
            block: period
            type: integer
            shape: (<nstp)
            reader: urword
            description: save for each step specified in STEPS. This keyword may be used in conjunction
              with other keywords to print or save results for multiple time steps.
            tagged: true
            in_record: true
