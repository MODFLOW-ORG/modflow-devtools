name: gwf-maw
advanced: true
multi: true
schema_version: 2.0.0.dev0
fkeys:
  ts_filerecord:
    parent: parent_package
    key: ts_filerecord
    val: timeseries
    abbr: ts
    param: timeseries
    description: xxx
  obs_filerecord:
    parent: parent_model_or_package
    key: obs_filerecord
    val: observations
    abbr: obs
    param: continuous
options:
  auxiliary:
    block: options
    type: string
    shape: (naux)
    reader: urword
    optional: true
    longname: keyword to specify aux variables
    description: defines an array of one or more auxiliary variable names.  There is no limit on the number
      of auxiliary variables that can be provided on this line; however, lists of information provided
      in subsequent blocks must have a column of data for each auxiliary variable name defined here.   The
      number of auxiliary variables detected on this line determines the value for naux.  Comments cannot
      be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
      variables may not be used by the package, but they will be available for use by other parts of the
      program.  The program will terminate with an error if auxiliary variables are specified on more
      than one line in the options block.
  boundnames:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that boundary names may be provided with the list of multi-aquifer
      well cells.
  print_input:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print input to listing file
    description: keyword to indicate that the list of multi-aquifer well information will be written to
      the listing file immediately after it is read.
    mf6internal: iprpak
  print_head:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated heads to listing file
    description: keyword to indicate that the list of multi-aquifer well {#2} will be printed to the listing
      file for every stress period in which 'HEAD PRINT' is specified in Output Control.  If there is
      no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last time step
      of each stress period.
  print_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: print calculated flows to listing file
    description: keyword to indicate that the list of multi-aquifer well flow rates will be printed to
      the listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output
      Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates are
      printed for the last time step of each stress period.
    mf6internal: iprflow
  save_flows:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: save well flows to budget file
    description: keyword to indicate that multi-aquifer well flow terms will be written to the file specified
      with 'BUDGET FILEOUT' in Output Control.
    mf6internal: ipakcb
  head_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    tagged: true
    fields:
      head:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: head keyword
        description: keyword to specify that record corresponds to head.
        in_record: true
        tagged: true
      headfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the binary output file to write head information.
        preserve_case: true
        in_record: true
        tagged: false
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
  budget_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    mf6internal: budfilerec
    tagged: true
    fields:
      budget:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget.
        in_record: true
        tagged: true
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the binary output file to write budget information.
        preserve_case: true
        in_record: true
        tagged: false
  budgetcsv_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    mf6internal: budcsvfilerec
    tagged: true
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      budgetcsv:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the budget CSV.
        in_record: true
        tagged: true
      budgetcsvfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma-separated value (CSV) output file to write budget summary information.  A
          budget summary record will be written to this file for each time step of the simulation.
        preserve_case: true
        in_record: true
        tagged: false
  no_well_storage:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: deactivate well storage
    description: keyword that deactivates inclusion of well storage contributions to the multi-aquifer
      well package continuity equation.
  flow_correction:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: activate flow correction
    description: keyword that activates flow corrections in cases where the head in a multi-aquifer well
      is below the bottom of the screen for a connection or the head in a convertible cell connected to
      a multi-aquifer well is below the cell bottom. When flow corrections are activated, unit head gradients
      are used to calculate the flow between a multi-aquifer well and a connected GWF cell. By default,
      flow corrections are not made.
  non_vertical_wells:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: activate non-vertical well connections
    description: keyword that activates support for non-vertical (slanted) multi-aquifer well connections.  When
      this option is specified, an ANGLEDATA block can be used to assign a tilt angle (deviation from
      vertical) to individual multi-aquifer well connections.  The saturated conductance for a connection
      listed in the ANGLEDATA block is scaled by the in-cell screen length, which is calculated from the
      screen top, screen bottom, and tilt angle (or specified directly), instead of the vertical screen
      thickness.  By default, all multi-aquifer well connections are assumed to be vertical.  The tilt
      angle and connection length scale the conductance for a single connection only and do not route
      flow through intervening cells; a well that passes through more than one cell (a slanted well or
      a horizontal lateral) must have a separate connection to each cell that it penetrates.  For a connection
      that uses the SPECIFIED conductance equation, the saturated conductance is used unchanged (the length
      correction is not applied because the conductance is provided by the user), but the screen top and
      bottom are honored so that the connection saturation is calculated over the correct interval rather
      than over the full cell.
    mf6internal: inonvert
  flowing_wells:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: activate flowing wells
    description: keyword that activates the flowing wells option for the multi-aquifer well package.
  shutdown_theta:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: shutdown theta
    description: value that defines the weight applied to discharge rate for wells that limit the water
      level in a discharging well (defined using the HEAD_LIMIT keyword in the stress period data). SHUTDOWN_THETA
      is used to control discharge rate oscillations when the flow rate from the aquifer is less than
      the specified flow rate from the aquifer to the well. Values range between 0.0 and 1.0, and larger
      values increase the weight (decrease under-relaxation) applied to the well discharge rate. The HEAD_LIMIT
      option has been included to facilitate backward compatibility with previous versions of MODFLOW
      but use of the RATE_SCALING option instead of the HEAD_LIMIT option is recommended. By default,
      SHUTDOWN_THETA is 0.7.
  shutdown_kappa:
    block: options
    type: double precision
    reader: urword
    optional: true
    longname: shutdown kappa
    description: value that defines the weight applied to discharge rate for wells that limit the water
      level in a discharging well (defined using the HEAD_LIMIT keyword in the stress period data). SHUTDOWN_KAPPA
      is used to control discharge rate oscillations when the flow rate from the aquifer is less than
      the specified flow rate from the aquifer to the well. Values range between 0.0 and 1.0, and larger
      values increase the weight applied to the well discharge rate. The HEAD_LIMIT option has been included
      to facilitate backward compatibility with previous versions of MODFLOW but use of the RATE_SCALING
      option instead of the HEAD_LIMIT option is recommended. By default, SHUTDOWN_KAPPA is 0.0001.
  mfrcsv_filerecord:
    block: options
    type: record
    reader: urword
    optional: true
    mf6internal: mfrcsvfilerec
    tagged: true
    fields:
      fileout:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: file keyword
        description: keyword to specify that an output filename is expected next.
        in_record: true
        tagged: true
      maw_flow_reduce_csv:
        block: options
        type: keyword
        reader: urword
        optional: false
        longname: budget keyword
        description: keyword to specify that record corresponds to the output option in which a new record
          is written for each multi-aquifer well and for each time step in which the user-requested extraction
          or injection rate is reduced by the program.
        mf6internal: maw_flw_red_csv
        in_record: true
        tagged: true
      mfrcsvfile:
        block: options
        type: string
        reader: urword
        optional: false
        longname: file keyword
        description: name of the comma-separated value (CSV) output file to write information about multi-aquifer
          well extraction or injection rates that have been reduced by the program. Entries are only written
          if the extraction or injection rates are reduced.
        preserve_case: true
        in_record: true
        tagged: false
  timeseries:
    block: options
    type: record ts6 filein ts6_filename
    reader: urword
    optional: true
    description: Contains data for the ts package. Data can be passed as a dictionary to the ts package
      with variable names as keys and package data as values. Data for the timeseries variable is also
      acceptable. See ts package documentation for more information.
    tagged: true
    ref:
      parent: parent_package
      key: ts_filerecord
      val: timeseries
      abbr: ts
      param: timeseries
      description: xxx
  observations:
    block: options
    type: record obs6 filein obs6_filename
    reader: urword
    optional: true
    description: Contains data for the obs package. Data can be passed as a dictionary to the obs package
      with variable names as keys and package data as values. Data for the observations variable is also
      acceptable. See obs package documentation for more information.
    tagged: true
    ref:
      parent: parent_model_or_package
      key: obs_filerecord
      val: observations
      abbr: obs
      param: continuous
  mover:
    block: options
    type: keyword
    reader: urword
    optional: true
    description: keyword to indicate that this instance of the MAW Package can be used with the Water
      Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within
      the package to store the available, provided, and received water.
    tagged: true
  dev_peaceman_effective_radius:
    block: options
    type: keyword
    reader: urword
    optional: true
    longname: use the Peaceman effective radius
    description: keyword that calculates the effective radius for structured grids using the approach
      of Peaceman (1983) instead of the default approach.  This development option is not supported.
    mf6internal: ieffradopt
dimensions:
  nmawwells:
    block: dimensions
    type: integer
    reader: urword
    optional: false
    longname: number of MAW wells
    description: integer value specifying the number of multi-aquifer wells that will be simulated for
      all stress periods.
    mf6internal: maxbound
packagedata:
  packagedata:
    block: packagedata
    type: recarray
    shape: (nmawwells)
    reader: urword
    item:
      type: record
      block: packagedata
      reader: urword
      fields:
        ifno:
          block: period
          type: integer
          reader: urword
          longname: well number for this entry
          description: integer value that defines the well number associated with the specified PERIOD
            data on the line. IFNO must be greater than zero and less than or equal to NMAWWELLS.
          tagged: false
          in_record: true
          numeric_index: true
        radius:
          block: packagedata
          type: double precision
          reader: urword
          longname: well radius
          description: radius for the multi-aquifer well. The program will terminate with an error if
            the radius is less than or equal to zero.
          tagged: false
          in_record: true
        bottom:
          block: packagedata
          type: double precision
          reader: urword
          longname: well bottom
          description: bottom elevation of the multi-aquifer well. If CONDEQN is SPECIFIED, THIEM, SKIN,
            or CUMULATIVE, BOTTOM is set to the cell bottom in the lowermost GWF cell connection in cases
            where the specified well bottom is above the bottom of this GWF cell. If CONDEQN is MEAN,
            BOTTOM is set to the lowermost GWF cell connection screen bottom in cases where the specified
            well bottom is above this value. The bottom elevation defines the lowest well head that will
            be simulated when the NEWTON UNDER_RELAXATION option is specified in the GWF model name file.
            The bottom elevation is also used to calculate volumetric storage in the well.
          tagged: false
          in_record: true
        strt:
          block: packagedata
          type: double precision
          reader: urword
          longname: starting head
          description: starting head for the multi-aquifer well. The program will terminate with an error
            if the starting head is less than the specified well bottom.
          tagged: false
          in_record: true
          time_series: true
        condeqn:
          block: packagedata
          type: string
          reader: urword
          longname: conductance equation
          description: 'character string that defines the conductance equation that is used to calculate
            the saturated conductance for the multi-aquifer well. Possible multi-aquifer well CONDEQN
            strings include: SPECIFIED--character keyword to indicate the multi-aquifer well saturated
            conductance will be specified.  THIEM--character keyword to indicate the multi-aquifer well
            saturated conductance will be calculated using the Thiem equation, which considers the cell
            top and bottom, aquifer hydraulic conductivity, and effective cell and well radius.  SKIN--character
            keyword to indicate that the multi-aquifer well saturated conductance will be calculated using
            the cell top and bottom, aquifer and screen hydraulic conductivity, and well and skin radius.  CUMULATIVE--character
            keyword to indicate that the multi-aquifer well saturated conductance will be calculated using
            a combination of the Thiem and SKIN equations.  MEAN--character keyword to indicate the multi-aquifer
            well saturated conductance will be calculated using the aquifer and screen top and bottom,
            aquifer and screen hydraulic conductivity, and well and skin radius. The CUMULATIVE conductance
            equation is identical to the SKIN LOSSTYPE in the Multi-Node Well (MNW2) package for MODFLOW-2005.
            The program will terminate with an error condition if CONDEQN is SKIN or CUMULATIVE and the
            calculated saturated conductance is less than zero; if an error condition occurs, it is suggested
            that the THIEM or MEAN conductance equations be used for these multi-aquifer wells.'
          tagged: false
          in_record: true
        ngwfnodes:
          block: packagedata
          type: integer
          reader: urword
          longname: number of connected GWF cells
          description: integer value that defines the number of GWF nodes connected to this (IFNO) multi-aquifer
            well. NGWFNODES must be greater than zero.
          tagged: false
          in_record: true
        aux:
          block: packagedata
          type: double precision
          shape: (naux)
          reader: urword
          optional: true
          longname: auxiliary variables
          description: represents the values of the auxiliary variables for each multi-aquifer well. The
            values of auxiliary variables must be present for each multi-aquifer well. The values must
            be specified in the order of the auxiliary variables specified in the OPTIONS block.  If the
            package supports time series and the Options block includes a TIMESERIESFILE entry (see the
            'Time-Variable Input' section), values can be obtained from a time series by entering the
            time-series name in place of a numeric value.
          in_record: true
          tagged: false
          time_series: true
        boundname:
          block: packagedata
          type: string
          reader: urword
          optional: true
          longname: well name
          description: name of the multi-aquifer well cell.  BOUNDNAME is an ASCII character variable
            that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire
            name must be enclosed within single quotes.
          tagged: false
          in_record: true
connectiondata:
  connectiondata:
    block: connectiondata
    type: recarray
    reader: urword
    item:
      type: record
      block: connectiondata
      reader: urword
      fields:
        ifno:
          block: period
          type: integer
          reader: urword
          longname: well number for this entry
          description: integer value that defines the well number associated with the specified PERIOD
            data on the line. IFNO must be greater than zero and less than or equal to NMAWWELLS.
          tagged: false
          in_record: true
          numeric_index: true
        icon:
          block: angledata
          type: integer
          reader: urword
          longname: connection number
          description: integer value that defines the GWF connection number for this multi-aquifer well
            connection entry. ICON must be greater than zero and less than or equal to NGWFNODES for multi-aquifer
            well IFNO.
          tagged: false
          in_record: true
          mf6internal: angledata_icon
          numeric_index: true
        cellid:
          block: connectiondata
          type: integer
          shape: (ncelldim)
          reader: urword
          longname: cell identifier
          description: is the cell identifier, and depends on the type of grid that is used for the simulation.  For
            a structured grid that uses the DIS input file, CELLID is the layer, row, and column.   For
            a grid that uses the DISV input file, CELLID is the layer and CELL2D number.  If the model
            uses the unstructured discretization (DISU) input file, CELLID is the node number for the
            cell. One or more screened intervals can be connected to the same CELLID if CONDEQN for a
            well is MEAN. The program will terminate with an error if MAW wells using SPECIFIED, THIEM,
            SKIN, or CUMULATIVE conductance equations have more than one connection to the same CELLID.
          tagged: false
          in_record: true
        scrn_top:
          block: connectiondata
          type: double precision
          reader: urword
          longname: screen top
          description: value that defines the top elevation of the screen for the multi-aquifer well connection.
            If CONDEQN is SPECIFIED, THIEM, SKIN, or CUMULATIVE, SCRN_TOP can be any value and is set
            to the top of the cell. If CONDEQN is MEAN, SCRN_TOP is set to the multi-aquifer well connection
            cell top if the specified value is greater than the cell top. The program will terminate with
            an error if the screen top is less than the screen bottom.
          tagged: false
          in_record: true
        scrn_bot:
          block: connectiondata
          type: double precision
          reader: urword
          longname: screen bottom
          description: value that defines the bottom elevation of the screen for the multi-aquifer well
            connection. If CONDEQN is SPECIFIED, THIEM, SKIN, or CUMULATIVE, SCRN_BOT can be any value
            and is set to the bottom of the cell. If CONDEQN is MEAN, SCRN_BOT is set to the multi-aquifer
            well connection cell bottom if the specified value is less than the cell bottom. The program
            will terminate with an error if the screen bottom is greater than the screen top.
          tagged: false
          in_record: true
        hk_skin:
          block: connectiondata
          type: double precision
          reader: urword
          longname: skin data
          description: value that defines the skin (filter pack) hydraulic conductivity (if CONDEQN for
            the multi-aquifer well is SKIN, CUMULATIVE, or MEAN) or conductance (if CONDEQN for the multi-aquifer
            well is SPECIFIED) for each GWF node connected to the multi-aquifer well (NGWFNODES). If CONDEQN
            is SPECIFIED, HK_SKIN must be greater than or equal to zero.  HK_SKIN can be any value if
            CONDEQN is THIEM. Otherwise, HK_SKIN must be greater than zero. If CONDEQN is SKIN, the contrast
            between the cell transmissivity (the product of geometric mean horizontal hydraulic conductivity
            and the cell thickness) and the well transmissivity (the product of HK_SKIN and the screen
            thicknesses) must be greater than one in node CELLID or the program will terminate with an
            error condition; if an error condition occurs, it is suggested that the HK_SKIN be reduced
            to a value less than K11 and K22 in node CELLID or the THIEM or MEAN conductance equations
            be used for these multi-aquifer wells.
          tagged: false
          in_record: true
        radius_skin:
          block: connectiondata
          type: double precision
          reader: urword
          longname: skin radius
          description: real value that defines the skin radius (filter pack radius) for the multi-aquifer
            well. RADIUS_SKIN can be any value if CONDEQN is SPECIFIED or THIEM. If CONDEQN is SKIN, CUMULATIVE,
            or MEAN, the program will terminate with an error if  RADIUS_SKIN is less than or equal to
            the RADIUS for the multi-aquifer well.
          tagged: false
          in_record: true
angledata:
  angledata:
    block: angledata
    type: recarray
    reader: urword
    optional: true
    item:
      type: record
      block: angledata
      reader: urword
      optional: true
      fields:
        ifno:
          block: period
          type: integer
          reader: urword
          longname: well number for this entry
          description: integer value that defines the well number associated with the specified PERIOD
            data on the line. IFNO must be greater than zero and less than or equal to NMAWWELLS.
          tagged: false
          in_record: true
          numeric_index: true
        icon:
          block: angledata
          type: integer
          reader: urword
          longname: connection number
          description: integer value that defines the GWF connection number for this multi-aquifer well
            connection entry. ICON must be greater than zero and less than or equal to NGWFNODES for multi-aquifer
            well IFNO.
          tagged: false
          in_record: true
          mf6internal: angledata_icon
          numeric_index: true
        angle:
          block: angledata
          type: double precision
          reader: urword
          longname: tilt angle from vertical
          description: value that defines the tilt angle of the multi-aquifer well connection, in degrees
            measured as a deviation from vertical.  ANGLE must be greater than or equal to 0.0 (a vertical
            connection) and less than or equal to 90.0 (a horizontal connection) degrees.  The in-cell
            screen length used to calculate the saturated conductance is computed from the screen top,
            screen bottom, well radius, and ANGLE, unless CONN_LENGTH is specified.  The horizontal distance
            spanned by a connection grows rapidly as ANGLE approaches 90.0 degrees, and a warning is issued
            if it is greater than the maximum horizontal extent of the connected cell.  A connection that
            is intended to pass through more than one cell should be specified as a separate connection
            to each cell that it passes through.  If a connection passes through more than one cell unintentionally,
            ANGLE or CONN_LENGTH should be reduced.
          tagged: false
          in_record: true
          numeric_index: false
        conn_length:
          block: angledata
          type: double precision
          reader: urword
          optional: true
          longname: in-cell screen length
          description: optional value that defines the length of the multi-aquifer well screen within
            the connected GWF cell.  If CONN_LENGTH is specified (and greater than zero), it is used directly
            as the in-cell screen length; otherwise, the in-cell screen length is calculated from the
            screen top, screen bottom, well radius, and ANGLE.  CONN_LENGTH must be specified for horizontal
            connections (ANGLE equal to 90.0 degrees) because the in-cell screen length cannot be derived
            from the screen elevations for a horizontal connection.  A warning is issued if the horizontal
            distance spanned by the connection is greater than the maximum horizontal extent of the connected
            cell.  The MEAN conductance equation is recommended for horizontal connections.  For a horizontal
            connection using the MEAN conductance equation, SCRN_TOP and SCRN_BOT do not affect the magnitude
            of the saturated conductance but do determine the elevation range over which the connection
            saturates and dewaters; SCRN_TOP and SCRN_BOT should be set to the top and bottom of the horizontal
            borehole so that the vertical screen extent (SCRN_TOP $-$ SCRN_BOT) equals the well diameter
            (2 times RADIUS).  The program snaps SCRN_TOP to SCRN_BOT plus the well diameter when the
            specified extent is essentially equal to the well diameter, and otherwise issues a warning.
          tagged: false
          in_record: true
          mf6internal: connlen
period:
  transient_block: true
  perioddata:
    block: period
    type: recarray
    reader: urword
    item:
      type: record
      block: period
      reader: urword
      fields:
        ifno:
          block: period
          type: integer
          reader: urword
          longname: well number for this entry
          description: integer value that defines the well number associated with the specified PERIOD
            data on the line. IFNO must be greater than zero and less than or equal to NMAWWELLS.
          tagged: false
          in_record: true
          numeric_index: true
        mawsetting:
          block: period
          type: keystring
          reader: urword
          description: 'line of information that is parsed into a keyword and values.  Keyword values
            that can be used to start the MAWSETTING string include: STATUS, FLOWING_WELL, RATE, WELL_HEAD,
            HEAD_LIMIT, SHUT_OFF, RATE_SCALING, and AUXILIARY.'
          tagged: false
          in_record: true
          choices:
            status:
              block: period
              type: string
              reader: urword
              longname: well status
              description: keyword option to define well status.  STATUS can be ACTIVE, INACTIVE, or CONSTANT.
                By default, STATUS is ACTIVE.
              tagged: true
              in_record: true
            flowing_wellrecord:
              block: period
              type: record
              reader: urword
              mf6internal: flwwellrecord
              in_record: true
              fields:
                flowing_well:
                  block: period
                  type: keyword
                  reader: urword
                  longname: well is a flowing well
                  description: keyword to indicate the well is a flowing well.  The FLOWING_WELL option
                    can be used to simulate flowing wells when the simulated well head exceeds the specified
                    drainage elevation.
                  in_record: true
                fwelev:
                  block: period
                  type: double precision
                  reader: urword
                  longname: flowing well elevation
                  description: elevation used to determine whether or not the well is flowing.
                  tagged: false
                  in_record: true
                fwcond:
                  block: period
                  type: double precision
                  reader: urword
                  longname: well flowing well conductance
                  description: conductance used to calculate the discharge of a free flowing well.  Flow
                    occurs when the head in the well is above the well top elevation (FWELEV).
                  tagged: false
                  in_record: true
                fwrlen:
                  block: period
                  type: double precision
                  reader: urword
                  longname: flowing well reduction length
                  description: length used to reduce the conductance of the flowing well.  When the head
                    in the well drops below the well top plus the reduction length, then the conductance
                    is reduced.  This reduction length can be used to improve the stability of simulations
                    with flowing wells so that there is not an abrupt change in flowing well rates.
                  tagged: false
                  in_record: true
            rate:
              block: period
              type: double precision
              reader: urword
              longname: well pumping rate
              description: is the volumetric pumping rate for the multi-aquifer well. A positive value
                indicates recharge and a negative value indicates discharge (pumping). RATE only applies
                to active (STATUS is ACTIVE) multi-aquifer wells. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value. By default, the RATE for
                each multi-aquifer well is zero.
              tagged: true
              in_record: true
              time_series: true
            well_head:
              block: period
              type: double precision
              reader: urword
              longname: well head
              description: is the head in the multi-aquifer well. WELL_HEAD is only applied to constant
                head (STATUS is CONSTANT) and inactive (STATUS is INACTIVE) multi-aquifer wells. If the
                Options block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section),
                values can be obtained from a time series by entering the time-series name in place of
                a numeric value. The program will terminate with an error if WELL_HEAD is less than the
                bottom of the well.
              tagged: true
              in_record: true
              time_series: true
            head_limit:
              block: period
              type: string
              reader: urword
              longname: head limit
              description: is the limiting water level (head) in the well, which is the minimum of the
                well RATE or the well inflow rate from the aquifer. HEAD_LIMIT can be applied to extraction
                wells (RATE $<$ 0) or injection wells (RATE $>$ 0). HEAD_LIMIT can be deactivated by specifying
                the text string `OFF'. The HEAD_LIMIT option is based on the HEAD_LIMIT functionality
                available in the MNW2~citep{konikow2009} package for MODFLOW-2005. The HEAD_LIMIT option
                has been included to facilitate backward compatibility with previous versions of MODFLOW
                but use of the RATE_SCALING option instead of the HEAD_LIMIT option is recommended. By
                default, HEAD_LIMIT is `OFF'.
              tagged: true
              in_record: true
            shutoffrecord:
              block: period
              type: record
              reader: urword
              in_record: true
              fields:
                shut_off:
                  block: period
                  type: keyword
                  reader: urword
                  longname: shut off well
                  description: keyword for activating well shut off capability.  Subsequent values define
                    the minimum and maximum pumping rate that a well must exceed to shutoff or reactivate
                    a well, respectively, during a stress period. SHUT_OFF is only applied to injection
                    wells (RATE$<0$) and if HEAD_LIMIT is specified (not set to `OFF').  If HEAD_LIMIT
                    is specified, SHUT_OFF can be deactivated by specifying a minimum value equal to zero.
                    The SHUT_OFF option is based on the SHUT_OFF functionality available in the MNW2~citep{konikow2009}
                    package for MODFLOW-2005. The SHUT_OFF option has been included to facilitate backward
                    compatibility with previous versions of MODFLOW but use of the RATE_SCALING option
                    instead of the SHUT_OFF option is recommended. By default, SHUT_OFF is not used.
                  in_record: true
                minrate:
                  block: period
                  type: double precision
                  reader: urword
                  longname: minimum shutoff rate
                  description: is the minimum rate that a well must exceed to shutoff a well during a
                    stress period. The well will shut down during a time step if the flow rate to the
                    well from the aquifer is less than MINRATE. If a well is shut down during a time step,
                    reactivation of the well cannot occur until the next time step to reduce oscillations.
                    MINRATE must be less than maxrate.
                  tagged: false
                  in_record: true
                maxrate:
                  block: period
                  type: double precision
                  reader: urword
                  longname: maximum shutoff rate
                  description: is the maximum rate that a well must exceed to reactivate a well during
                    a stress period. The well will reactivate during a timestep if the well was shutdown
                    during the previous time step and the flow rate to the well from the aquifer exceeds
                    maxrate. Reactivation of the well cannot occur until the next time step if a well
                    is shutdown to reduce oscillations. maxrate must be greater than MINRATE.
                  tagged: false
                  in_record: true
            rate_scalingrecord:
              block: period
              type: record
              reader: urword
              mf6internal: ratescalingrec
              in_record: true
              fields:
                rate_scaling:
                  block: period
                  type: keyword
                  reader: urword
                  longname: rate scaling
                  description: activate rate scaling.  If RATE_SCALING is specified, both PUMP_ELEVATION
                    and SCALING_LENGTH must be specified. RATE_SCALING cannot be used with HEAD_LIMIT.  RATE_SCALING
                    can be used for extraction or injection wells.  For extraction wells, the extraction
                    rate will start to decrease once the head in the well lowers to a level equal to the
                    pump elevation plus the scaling length.  If the head in the well drops below the pump
                    elevation, then the extraction rate is calculated to be zero.  For an injection well,
                    the injection rate will begin to decrease once the head in the well rises above the
                    specified pump elevation.  If the head in the well rises above the pump elevation
                    plus the scaling length, then the injection rate will be set to zero.
                  in_record: true
                pump_elevation:
                  block: period
                  type: double precision
                  reader: urword
                  longname: pump elevation
                  description: is the elevation of the multi-aquifer well pump (PUMP_ELEVATION).  PUMP_ELEVATION
                    should not be less than the bottom elevation (BOTTOM) of the multi-aquifer well.
                  tagged: false
                  in_record: true
                scaling_length:
                  block: period
                  type: double precision
                  reader: urword
                  description: height above the pump elevation (SCALING_LENGTH).  If the simulated well
                    head is below this elevation (pump elevation plus the scaling length), then the pumping
                    rate is reduced.
                  tagged: false
                  in_record: true
            auxiliaryrecord:
              block: period
              type: record
              reader: urword
              in_record: true
              fields:
                auxiliary:
                  block: period
                  type: keyword
                  reader: urword
                  description: keyword for specifying auxiliary variable.
                  in_record: true
                  mf6internal: period_auxiliary
                auxname:
                  block: period
                  type: string
                  reader: urword
                  description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must match
                    one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME does
                    not match one of the auxiliary variable names defined in the OPTIONS block the data
                    are ignored.
                  tagged: false
                  in_record: true
                auxval:
                  block: period
                  type: double precision
                  reader: urword
                  longname: auxiliary variable value
                  description: value for the auxiliary variable. If the Options block includes a TIMESERIESFILE
                    entry (see the 'Time-Variable Input' section), values can be obtained from a time
                    series by entering the time-series name in place of a numeric value.
                  tagged: false
                  in_record: true
                  time_series: true
