type: model
schema_version: 2.0.0.dev2
name: gwt-nam
parent: sim-nam
ftype: GWT6
dependent_variable: concentration
blocks:
  options:
    fields:
      list:
        type: string
        longname: name of listing file
        description: is name of the listing file to create for this GWT model.  If not specified, then
          the name of the list file will be the basename of the GWT model name file and the '.lst' extension.  For
          example, if the GWT name file is called 'my.model.nam' then the list file will be called 'my.model.lst'.
        optional: true
        case_sensitive: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to indicate that the list of all model stress package information will be
          written to the listing file immediately after it is read.
        optional: true
      print_flows:
        type: keyword
        longname: print calculated flows to listing file
        description: keyword to indicate that the list of all model package flow rates will be printed
          to the listing file for every stress period time step in which 'BUDGET PRINT' is specified in
          Output Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow
          rates are printed for the last time step of each stress period.
        optional: true
      save_flows:
        type: keyword
        longname: save flows for all packages to budget file
        description: keyword to indicate that all model package flow terms will be written to the file
          specified with 'BUDGET FILEOUT' in Output Control.
        optional: true
      dependent_variable_scaling:
        type: keyword
        longname: flag to scale X and RHS
        description: flag to scale X and RHS to avoid very large positive or negative dependent variable
          values
        optional: true
      nc_mesh2d_filerecord:
        type: record
        description: NetCDF layered mesh fileout record.
        optional: true
        fields:
          netcdf_mesh2d:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to a layered mesh NetCDF file.
          ncmesh2dfile:
            type: file
            longname: file keyword
            description: name of the NetCDF ugrid layered mesh output file.
            tagged: false
            direction: out
      nc_structured_filerecord:
        type: record
        description: NetCDF structured fileout record.
        optional: true
        fields:
          netcdf_structured:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to a structured NetCDF file.
          ncstructfile:
            type: file
            longname: file keyword
            description: name of the NetCDF structured output file.
            tagged: false
            direction: out
      nc_filerecord:
        type: record
        description: NetCDF filerecord
        optional: true
        fields:
          netcdf:
            type: keyword
            longname: netcdf keyword
            description: keyword to specify that record corresponds to a NetCDF input file.
          netcdf_filename:
            type: file
            longname: netcdf input filename
            description: defines a NetCDF input file.
            tagged: false
            direction: in
  packages:
    fields:
      packages:
        type: list
        longname: package list
        item:
          name: packages
          type: record
          fields:
            ftype:
              type: string
              longname: package type
              description: is the file type, which must be one of the following character values shown
                in table~ref{table:ftype-gwt}. Ftype may be entered in any combination of uppercase and
                lowercase.
              tagged: false
            fname:
              type: file
              longname: file name
              description: is the name of the file containing the package input.  The path to the file
                should be included if the file is not located in the folder where the program was run.
              tagged: false
              direction: in
              mode_keyword: false
              component: package
              component_ftype: ftype
            pname:
              type: string
              longname: user name for package
              description: is the user-defined name for the package. PNAME is restricted to 16 characters.  No
                spaces are allowed in PNAME.  PNAME character values are read and stored by the program
                for stress packages only.  These names may be useful for labeling purposes when multiple
                stress packages of the same type are located within a single GWT Model.  If PNAME is specified
                for a stress package, then PNAME will be used in the flow budget table in the listing
                file; it will also be used for the text entry in the cell-by-cell budget file.  PNAME
                is case insensitive and is stored in all upper case letters.
              optional: true
              tagged: false
