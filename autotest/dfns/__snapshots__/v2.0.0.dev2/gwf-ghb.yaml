type: package
schema_version: 2.0.0.dev2
name: gwf-ghb
parent: gwf-nam
multi: true
subtype: stress
dims:
  maxbound:
    value: maxbound
    scope: model
  auxiliary:
    value: len(auxiliary)
blocks:
  options:
    fields:
      auxiliary:
        type: array
        longname: keyword to specify aux variables
        description: defines an array of one or more auxiliary variable names.  There is no limit on the
          number of auxiliary variables that can be provided on this line; however, lists of information
          provided in subsequent blocks must have a column of data for each auxiliary variable name defined
          here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
          cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
          variables may not be used by the package, but they will be available for use by other parts
          of the program.  The program will terminate with an error if auxiliary variables are specified
          on more than one line in the options block.
        optional: true
        dtype: string
      auxmultname:
        type: string
        longname: name of auxiliary variable for multiplier
        description: name of auxiliary variable to be used as multiplier of general-head boundary conductance.
        optional: true
      boundnames:
        type: keyword
        description: keyword to indicate that boundary names may be provided with the list of general-head
          boundary cells.
        optional: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to indicate that the list of general-head boundary information will be written
          to the listing file immediately after it is read.
        optional: true
      print_flows:
        type: keyword
        longname: print calculated flows to listing file
        description: keyword to indicate that the list of general-head boundary flow rates will be printed
          to the listing file for every stress period time step in which 'BUDGET PRINT' is specified in
          Output Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow
          rates are printed for the last time step of each stress period.
        optional: true
      save_flows:
        type: keyword
        longname: save CHD flows to budget file
        description: keyword to indicate that general-head boundary flow terms will be written to the
          file specified with 'BUDGET FILEOUT' in Output Control.
        optional: true
      ts_filerecord:
        type: list
        optional: true
        item:
          type: record
          fields:
            ts6:
              type: keyword
              longname: head keyword
              description: keyword to specify that record corresponds to a time-series file.
            ts6_filename:
              type: file
              longname: file name of time series information
              description: defines a time-series file defining time series that can be used to assign
                time-varying values. See the 'Time-Variable Input' section for instructions on using the
                time-series capability.
              tagged: false
              direction: in
      obs_filerecord:
        type: record
        optional: true
        fields:
          obs6:
            type: keyword
            longname: obs keyword
            description: keyword to specify that record corresponds to an observations file.
          obs6_filename:
            type: file
            longname: obs6 input filename
            description: name of input file to define observations for the GHB package. See the 'Observation
              utility' section for instructions for preparing observation input files. Table {#2} lists
              observation type(s) supported by the GHB package.
            tagged: false
            direction: in
      mover:
        type: keyword
        description: keyword to indicate that this instance of the General-Head Boundary Package can be
          used with the Water Mover (MVR) Package.  When the MOVER option is specified, additional memory
          is allocated within the package to store the available, provided, and received water.
        optional: true
  dimensions:
    fields:
      maxbound:
        type: integer
        longname: maximum number of general-head boundaries
        description: integer value specifying the maximum number of general-head boundary cells that will
          be specified for use during any stress period.
  period:
    fields:
      stress_period_data:
        type: list
        item:
          type: record
          fields:
            cellid:
              type: array
              longname: cell identifier
              description: is the cell identifier, and depends on the type of grid that is used for the
                simulation.  For a structured grid that uses the DIS input file, CELLID is the layer,
                row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D
                number.  If the model uses the unstructured discretization (DISU) input file, CELLID is
                the node number for the cell.
              tagged: false
              dtype: integer
              shape:
                - ncelldim
            bhead:
              type: double
              longname: boundary head
              description: is the boundary head. If the Options block includes a TIMESERIESFILE entry
                (see the 'Time-Variable Input' section), values can be obtained from a time series by
                entering the time-series name in place of a numeric value.
              tagged: false
              time_series: true
            cond:
              type: double
              longname: boundary conductance
              description: is the hydraulic conductance of the interface between the aquifer cell and
                the boundary. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              tagged: false
              time_series: true
            aux:
              type: array
              longname: auxiliary variables
              description: represents the values of the auxiliary variables for each general-head boundary.
                The values of auxiliary variables must be present for each general-head boundary. The
                values must be specified in the order of the auxiliary variables specified in the OPTIONS
                block.  If the package supports time series and the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              optional: true
              tagged: false
              dtype: double
              time_series: true
              shape:
                - auxiliary
            boundname:
              type: string
              longname: general-head boundary name
              description: name of the general-head boundary cell.  BOUNDNAME is an ASCII character variable
                that can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the
                entire name must be enclosed within single quotes.
              optional: true
              tagged: false
        shape:
          - maxbound
    header:
      fill_forward: true
      field:
        name: iper
        type: integer
        longname: stress period number
        description: integer value specifying the starting stress period number for which the data specified
          in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and
          greater than zero.  The IPER value assigned to a stress period block must be greater than the
          IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD
          block will continue to apply for all subsequent stress periods, unless the program encounters
          another PERIOD block.
        tagged: false
