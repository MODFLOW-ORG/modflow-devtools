type = "package"
schema_version = "2.0.0.dev2"
name = "utl-spca"
parent = "package"
multi = true
subtype = "utility"

[blocks.options.fields.readasarrays]
type = "keyword"
longname = "use array-based input"
description = "indicates that array-based input will be used for the SPC Package.  This keyword must be specified to use array-based input.  When READASARRAYS is specified, values must be provided for every cell within a model layer, even those cells that have an IDOMAIN value less than one.  Values assigned to cells with IDOMAIN values less than one are not used and have no effect on simulation results."
default = true

[blocks.options.fields.print_input]
type = "keyword"
longname = "print input to listing file"
description = "keyword to indicate that the list of spc information will be written to the listing file immediately after it is read."
optional = true

[blocks.options.fields.tas_filerecord]
type = "record"
optional = true

[blocks.options.fields.tas_filerecord.fields.tas6]
type = "keyword"
longname = "head keyword"
description = "keyword to specify that record corresponds to a time-array-series file."

[blocks.options.fields.tas_filerecord.fields.tas6_filename]
type = "file"
longname = "file name of time series information"
description = "defines a time-array-series file defining a time-array series that can be used to assign time-varying values. See the Time-Variable Input section for instructions on using the time-array series capability."
tagged = false
direction = "in"

[blocks.period.fields.concentration]
type = "array"
longname = "concentration"
description = "is the concentration of the associated Recharge or Evapotranspiration stress package.  The concentration array may be defined by a time-array series (see the \"Using Time-Array Series in a Package\" section)."
optional = true
dtype = "double"
shape = [
    "ncpl",
]

[blocks.period.fields.temperature]
type = "array"
longname = "temperature"
description = "is the temperature of the associated Recharge or Evapotranspiration stress package.  The temperature array may be defined by a time-array series (see the \"Using Time-Array Series in a Package\" section)."
optional = true
dtype = "double"
shape = [
    "ncpl",
]

[blocks.period.header]
fill_forward = true

[blocks.period.header.field]
name = "iper"
type = "integer"
longname = "stress period number"
description = "integer value specifying the starting stress period number for which the data specified in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and greater than zero.  The IPER value assigned to a stress period block must be greater than the IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD block will continue to apply for all subsequent stress periods, unless the program encounters another PERIOD block."
tagged = false
