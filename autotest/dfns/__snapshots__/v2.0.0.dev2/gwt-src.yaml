type: package
schema_version: 2.0.0.dev2
name: gwt-src
parent: gwt-nam
multi: true
subtype: stress
dims:
  maxbound:
    value: maxbound
    scope: model
  auxiliary:
    value: len(auxiliary)
blocks:
  options:
    fields:
      auxiliary:
        type: array
        longname: keyword to specify aux variables
        description: defines an array of one or more auxiliary variable names.  There is no limit on the
          number of auxiliary variables that can be provided on this line; however, lists of information
          provided in subsequent blocks must have a column of data for each auxiliary variable name defined
          here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
          cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
          variables may not be used by the package, but they will be available for use by other parts
          of the program.  The program will terminate with an error if auxiliary variables are specified
          on more than one line in the options block.
        optional: true
        dtype: string
      auxmultname:
        type: string
        longname: name of auxiliary variable for multiplier
        description: name of auxiliary variable to be used as multiplier of mass loading rate.
        optional: true
      boundnames:
        type: keyword
        description: keyword to indicate that boundary names may be provided with the list of mass source
          cells.
        optional: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to indicate that the list of mass source information will be written to the
          listing file immediately after it is read.
        optional: true
      print_flows:
        type: keyword
        longname: print calculated flows to listing file
        description: keyword to indicate that the list of mass source flow rates will be printed to the
          listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output
          Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates
          are printed for the last time step of each stress period.
        optional: true
      save_flows:
        type: keyword
        longname: save well flows to budget file
        description: keyword to indicate that mass source flow terms will be written to the file specified
          with 'BUDGET FILEOUT' in Output Control.
        optional: true
      ts_filerecord:
        type: list
        optional: true
        item:
          type: record
          fields:
            ts6:
              type: keyword
              longname: head keyword
              description: keyword to specify that record corresponds to a time-series file.
            ts6_filename:
              type: file
              longname: file name of time series information
              description: defines a time-series file defining time series that can be used to assign
                time-varying values. See the 'Time-Variable Input' section for instructions on using the
                time-series capability.
              tagged: false
              direction: in
      obs_filerecord:
        type: record
        optional: true
        fields:
          obs6:
            type: keyword
            longname: obs keyword
            description: keyword to specify that record corresponds to an observations file.
          obs6_filename:
            type: file
            longname: obs6 input filename
            description: name of input file to define observations for the SRC package. See the 'Observation
              utility' section for instructions for preparing observation input files. Table {#2} lists
              observation type(s) supported by the SRC package.
            tagged: false
            direction: in
      highest_saturated:
        type: keyword
        longname: apply source to highest saturated cell
        description: Apply mass source loading rate to specified CELLID or highest underlying cell with
          a cell saturation greater than zero. The highest_saturated option has an additional complication
          for certain types of grids specified using the DISU Package. When the DISU Package is used,
          a cell may have more than one cell underlying it. If the overlying cell were to become inactive,
          there is no straightforward method for determining how to apportion the mass source loading
          rate to the underlying cells. In this case, the approach described by cite{modflowusg} is used.
          The mass source loading rate is assigned to the first active cell encountered (determined by
          searching through the underlying cell numbers from the lowest number to the highest number).
          In this manner, the total mass source loading rate is conserved; however, the spatial distribution
          of the applied mass source loading rate may not be maintained as layers become dry or wet during
          a simulation.
        optional: true
  dimensions:
    fields:
      maxbound:
        type: integer
        longname: maximum number of sources
        description: integer value specifying the maximum number of sources cells that will be specified
          for use during any stress period.
  period:
    fields:
      stress_period_data:
        type: list
        item:
          type: record
          fields:
            cellid:
              type: array
              longname: cell identifier
              description: is the cell identifier, and depends on the type of grid that is used for the
                simulation.  For a structured grid that uses the DIS input file, CELLID is the layer,
                row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D
                number.  If the model uses the unstructured discretization (DISU) input file, CELLID is
                the node number for the cell.
              tagged: false
              dtype: integer
              shape:
                - ncelldim
            smassrate:
              type: double
              longname: mass source loading rate
              description: is the mass source loading rate. A positive value indicates addition of solute
                mass and a negative value indicates removal of solute mass. If the Options block includes
                a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained
                from a time series by entering the time-series name in place of a numeric value.
              tagged: false
              time_series: true
            aux:
              type: array
              longname: auxiliary variables
              description: represents the values of the auxiliary variables for each mass source. The
                values of auxiliary variables must be present for each mass source. The values must be
                specified in the order of the auxiliary variables specified in the OPTIONS block.  If
                the package supports time series and the Options block includes a TIMESERIESFILE entry
                (see the 'Time-Variable Input' section), values can be obtained from a time series by
                entering the time-series name in place of a numeric value.
              optional: true
              tagged: false
              dtype: double
              time_series: true
              shape:
                - auxiliary
            boundname:
              type: string
              longname: well name
              description: name of the mass source cell.  BOUNDNAME is an ASCII character variable that
                can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire
                name must be enclosed within single quotes.
              optional: true
              tagged: false
        shape:
          - maxbound
    header:
      fill_forward: true
      field:
        name: iper
        type: integer
        longname: stress period number
        description: integer value specifying the starting stress period number for which the data specified
          in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and
          greater than zero.  The IPER value assigned to a stress period block must be greater than the
          IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD
          block will continue to apply for all subsequent stress periods, unless the program encounters
          another PERIOD block.
        tagged: false
