type: package
schema_version: 2.0.0.dev2
name: exg-olfgwf
parent: sim-nam
ftype: OLF6-GWF6
multi: true
subtype: exchange
dims:
  nexg:
    value: nexg
blocks:
  options:
    fields:
      print_input:
        type: keyword
        longname: keyword to print input to list file
        description: keyword to indicate that the list of exchange entries will be echoed to the listing
          file immediately after it is read.
        optional: true
      print_flows:
        type: keyword
        longname: keyword to print olfgwf flows to list file
        description: keyword to indicate that the list of exchange flow rates will be printed to the listing
          file for every stress period in which 'SAVE BUDGET' is specified in Output Control.
        optional: true
      fixed_conductance:
        type: keyword
        longname: keyword to indicate conductance is fixed
        description: keyword to indicate that the product of the bedleak and cfact input variables in
          the exchangedata block represents conductance.  This conductance is fixed and does not change
          as a function of head in the surface water and groundwater models.
        optional: true
      obs_filerecord:
        type: record
        optional: true
        fields:
          obs6:
            type: keyword
            longname: obs keyword
            description: keyword to specify that record corresponds to an observations file.
          obs6_filename:
            type: file
            longname: obs6 input filename
            description: is the file name of the observations input file for this exchange. See the 'Observation
              utility' section for instructions for preparing observation input files. Table ref{table:gwf-obstypetable}
              lists observation type(s) supported by the SWF-GWF package.
            tagged: false
            direction: in
            component: utl-obs
  dimensions:
    fields:
      nexg:
        type: integer
        longname: number of exchanges
        description: keyword and integer value specifying the number of SWF-GWF exchanges.
  exchangedata:
    fields:
      exchangedata:
        type: list
        longname: exchange data
        item:
          name: exchangedata
          type: record
          fields:
            cellidm1:
              type: array
              longname: cellid of cell in surface water model
              description: is the cellid of the cell in model 1, which must be the surface water model.
                For a structured grid that uses the DIS input file, CELLIDM1 is the layer, row, and column
                numbers of the cell.   For a grid that uses the DISV input file, CELLIDM1 is the layer
                number and CELL2D number for the two cells.  If the model uses the unstructured discretization
                (DISU) input file, then CELLIDM1 is the node number for the cell.
              tagged: false
              dtype: integer
              index: true
              cellid: '1'
              shape:
                - ncelldim
            cellidm2:
              type: array
              longname: cellid of cell in groundwater model
              description: is the cellid of the cell in model 2, which must be the groundwater model.
                For a structured grid that uses the DIS input file, CELLIDM2 is the layer, row, and column
                numbers of the cell.   For a grid that uses the DISV input file, CELLIDM2 is the layer
                number and CELL2D number for the two cells.  If the model uses the unstructured discretization
                (DISU) input file, then CELLIDM2 is the node number for the cell.
              tagged: false
              dtype: integer
              index: true
              cellid: '2'
              shape:
                - ncelldim
            bedleak:
              type: double
              longname: bed leakance
              description: is the leakance between the surface water and groundwater.  bedleak has dimensions
                of 1/T and is equal to the hydraulic conductivity of the bed sediments divided by the
                thickness of the bed sediments.
              tagged: false
            cfact:
              type: double
              longname: factor used for conductance calculation
              description: is the factor used for the conductance calculation.  The definition for this
                parameter depends the type of surface water model and whether or not the fixed_conductance
                option is specified.  If the fixed_conductance option is specified, then the hydraulic
                conductance is calculated as the product of bedleak and cfact.  In this case, the conductance
                is fixed and does not change as a function of the calculated surface water and groundwater
                head.  If the fixed_conductance option is not specified, then the definition of cfact
                depends on whether the surface water model represents one-dimensional channel flow or
                two-dimensional overland flow.  If the surface water model represents one-dimensional
                channel flow, then cfact is the length of the channel cell in the groundwater model cell.  If
                the surface water model represents two-dimensional overland flow, then cfact is the intersection
                area of the overland flow cell and the underlying groundwater model cell.
              tagged: false
        shape:
          - nexg
