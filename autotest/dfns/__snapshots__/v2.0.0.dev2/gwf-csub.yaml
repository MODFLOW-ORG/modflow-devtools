type: package
schema_version: 2.0.0.dev2
name: gwf-csub
parent: gwf-nam
dims:
  ninterbeds:
    value: ninterbeds
    scope: model
  maxsig0:
    value: maxsig0
    scope: model
blocks:
  options:
    fields:
      boundnames:
        type: keyword
        description: keyword to indicate that boundary names may be provided with the list of CSUB cells.
        optional: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to indicate that the list of CSUB information will be written to the listing
          file immediately after it is read.
        optional: true
      save_flows:
        type: keyword
        longname: keyword to save CSUB flows
        description: keyword to indicate that cell-by-cell flow terms will be written to the file specified
          with 'BUDGET SAVE FILE' in Output Control.
        optional: true
      gammaw:
        type: double
        longname: unit weight of water
        description: unit weight of water. For freshwater, GAMMAW is 9806.65 Newtons/cubic meters or 62.48
          lb/cubic foot in SI and English units, respectively. By default, GAMMAW is 9806.65 Newtons/cubic
          meters.
        optional: true
        default: 9806.65
      beta:
        type: double
        longname: compressibility of water
        description: compressibility of water. Typical values of BETA are 4.6512e-10 1/Pa or 2.2270e-8
          lb/square foot in SI and English units, respectively. By default, BETA is 4.6512e-10 1/Pa.
        optional: true
        default: 4.6512e-10
      head_based:
        type: keyword
        longname: keyword to indicate the head-based formulation will be used
        description: keyword to indicate the head-based formulation will be used to simulate coarse-grained
          aquifer materials and no-delay and delay interbeds. Specifying HEAD_BASED also specifies the
          INITIAL_PRECONSOLIDATION_HEAD option.
        optional: true
      initial_preconsolidation_head:
        type: keyword
        longname: keyword to indicate that preconsolidation heads will be specified
        description: keyword to indicate that preconsolidation heads will be specified for no-delay and
          delay interbeds in the PACKAGEDATA block. If the SPECIFIED_INITIAL_INTERBED_STATE option is
          specified in the OPTIONS block, user-specified preconsolidation heads in the PACKAGEDATA block
          are absolute values. Otherwise, user-specified preconsolidation heads in the PACKAGEDATA block
          are relative to steady-state or initial heads.
        optional: true
      ndelaycells:
        type: integer
        longname: number of interbed cell nodes
        description: number of nodes used to discretize delay interbeds. If not specified, then a default
          value of 19 is assigned.
        optional: true
      compression_indices:
        type: keyword
        longname: keyword to indicate CR and CC are read instead of SSE and SSV
        description: keyword to indicate that the recompression (CR) and compression (CC) indices are
          specified instead of the elastic specific storage (SSE) and inelastic specific storage (SSV)
          coefficients. If not specified, then elastic specific storage (SSE) and inelastic specific storage
          (SSV) coefficients must be specified.
        optional: true
      update_material_properties:
        type: keyword
        longname: keyword to indicate material properties can change during the simulations
        description: keyword to indicate that the thickness and void ratio of coarse-grained and interbed
          sediments (delay and no-delay) will vary during the simulation. If not specified, the thickness
          and void ratio of coarse-grained and interbed sediments will not vary during the simulation.
        optional: true
      cell_fraction:
        type: keyword
        longname: keyword to indicate cell fraction interbed thickness
        description: keyword to indicate that the thickness of interbeds will be specified in terms of
          the fraction of cell thickness. If not specified, interbed thicknness must be specified.
        optional: true
      specified_initial_interbed_state:
        type: keyword
        longname: keyword to indicate that absolute initial states will be specified
        description: keyword to indicate that absolute preconsolidation stresses (heads) and delay bed
          heads will be specified for interbeds defined in the PACKAGEDATA block. The SPECIFIED_INITIAL_INTERBED_STATE
          option is equivalent to specifying the SPECIFIED_INITIAL_PRECONSOLITATION_STRESS and SPECIFIED_INITIAL_DELAY_HEAD.
          If SPECIFIED_INITIAL_INTERBED_STATE is not specified then preconsolidation stress (head) and
          delay bed head values specified in the PACKAGEDATA block are relative to simulated values of
          the first stress period if steady-state or initial stresses and GWF heads if the first stress
          period is transient.
        optional: true
      specified_initial_preconsolidation_stress:
        type: keyword
        longname: keyword to indicate that absolute initial preconsolidation stresses (head) will be specified
        description: keyword to indicate that absolute preconsolidation stresses (heads) will be specified
          for interbeds defined in the PACKAGEDATA block. If SPECIFIED_INITIAL_PRECONSOLITATION_STRESS
          and SPECIFIED_INITIAL_INTERBED_STATE are not specified then preconsolidation stress (head) values
          specified in the PACKAGEDATA block are relative to simulated values if the first stress period
          is steady-state or initial stresses (heads) if the first stress period is transient.
        optional: true
      specified_initial_delay_head:
        type: keyword
        longname: keyword to indicate that absolute initial delay bed heads will be specified
        description: keyword to indicate that absolute initial delay bed head will be specified for interbeds
          defined in the PACKAGEDATA block. If SPECIFIED_INITIAL_DELAY_HEAD and SPECIFIED_INITIAL_INTERBED_STATE
          are not specified then delay bed head values specified in the PACKAGEDATA block are relative
          to simulated values if the first stress period is steady-state or initial GWF heads if the first
          stress period is transient.
        optional: true
      effective_stress_lag:
        type: keyword
        longname: keyword to indicate that specific storage will be calculate using the effective stress
          from the previous time step
        description: keyword to indicate the effective stress from the previous time step will be used
          to calculate specific storage values. This option can 1) help with convergence in models with
          thin cells and water table elevations close to land surface; 2) is identical to the approach
          used in the SUBWT package for MODFLOW-2005; and 3) is only used if the effective-stress formulation
          is being used. By default, current effective stress values are used to calculate specific storage
          values.
        optional: true
      strainib_filerecord:
        type: record
        optional: true
        fields:
          strain_csv_interbed:
            type: keyword
            longname: budget keyword
            description: keyword to specify the record that corresponds to final interbed strain output.
          interbedstrain_filename:
            type: file
            longname: file keyword
            description: name of the comma-separated-values output file to write final interbed strain
              information.
            tagged: false
            direction: out
      straincg_filerecord:
        type: record
        optional: true
        fields:
          strain_csv_coarse:
            type: keyword
            longname: budget keyword
            description: keyword to specify the record that corresponds to final coarse-grained material
              strain output.
          coarsestrain_filename:
            type: file
            longname: file keyword
            description: name of the comma-separated-values output file to write final coarse-grained
              material strain information.
            tagged: false
            direction: out
      compaction_filerecord:
        type: record
        optional: true
        fields:
          compaction:
            type: keyword
            longname: compaction keyword
            description: keyword to specify that record corresponds to the compaction.
          compaction_filename:
            type: file
            longname: file keyword
            description: name of the binary output file to write compaction information.
            tagged: false
            direction: out
      compaction_elastic_filerecord:
        type: record
        optional: true
        fields:
          compaction_elastic:
            type: keyword
            longname: elastic interbed compaction keyword
            description: keyword to specify that record corresponds to the elastic interbed compaction
              binary file.
          elastic_compaction_filename:
            type: file
            longname: file keyword
            description: name of the binary output file to write elastic interbed compaction information.
            tagged: false
            direction: out
      compaction_inelastic_filerecord:
        type: record
        optional: true
        fields:
          compaction_inelastic:
            type: keyword
            longname: inelastic interbed compaction keyword
            description: keyword to specify that record corresponds to the inelastic interbed compaction
              binary file.
          inelastic_compaction_filename:
            type: file
            longname: file keyword
            description: name of the binary output file to write inelastic interbed compaction information.
            tagged: false
            direction: out
      compaction_interbed_filerecord:
        type: record
        optional: true
        fields:
          compaction_interbed:
            type: keyword
            longname: interbed compaction keyword
            description: keyword to specify that record corresponds to the interbed compaction binary
              file.
          interbed_compaction_filename:
            type: file
            longname: file keyword
            description: name of the binary output file to write interbed compaction information.
            tagged: false
            direction: out
      compaction_coarse_filerecord:
        type: record
        optional: true
        fields:
          compaction_coarse:
            type: keyword
            longname: coarse compaction keyword
            description: keyword to specify that record corresponds to the elastic coarse-grained material
              compaction binary file.
          coarse_compaction_filename:
            type: file
            longname: file keyword
            description: name of the binary output file to write elastic coarse-grained material compaction
              information.
            tagged: false
            direction: out
      zdisplacement_filerecord:
        type: record
        optional: true
        fields:
          zdisplacement:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to the z-displacement binary file.
          zdisplacement_filename:
            type: file
            longname: file keyword
            description: name of the binary output file to write z-displacement information.
            tagged: false
            direction: out
      package_convergence_filerecord:
        type: record
        optional: true
        fields:
          package_convergence:
            type: keyword
            longname: package_convergence keyword
            description: keyword to specify that record corresponds to the package convergence comma spaced
              values file. Package convergence data is for delay interbeds. A warning message will be
              issued if package convergence data is requested but delay interbeds are not included in
              the package.
          package_convergence_filename:
            type: file
            longname: file keyword
            description: name of the comma spaced values output file to write package convergence information.
            tagged: false
            direction: out
      ts_filerecord:
        type: list
        optional: true
        item:
          type: record
          fields:
            ts6:
              type: keyword
              longname: head keyword
              description: keyword to specify that record corresponds to a time-series file.
            ts6_filename:
              type: file
              longname: file name of time series information
              description: defines a time-series file defining time series that can be used to assign
                time-varying values. See the 'Time-Variable Input' section for instructions on using the
                time-series capability.
              tagged: false
              direction: in
      obs_filerecord:
        type: record
        optional: true
        fields:
          obs6:
            type: keyword
            longname: obs keyword
            description: keyword to specify that record corresponds to an observations file.
          obs6_filename:
            type: file
            longname: obs6 input filename
            description: name of input file to define observations for the CSUB package. See the 'Observation
              utility' section for instructions for preparing observation input files. Table {#2} lists
              observation type(s) supported by the CSUB package.
            tagged: false
            direction: in
  dimensions:
    fields:
      ninterbeds:
        type: integer
        longname: number of CSUB interbed systems
        description: is the number of CSUB interbed systems.  More than 1 CSUB interbed systems can be
          assigned to a GWF cell; however, only 1 GWF cell can be assigned to a single CSUB interbed system.
      maxsig0:
        type: integer
        longname: maximum number of stress offset cells
        description: is the maximum number of cells that can have a specified stress offset.  More than
          1 stress offset can be assigned to a GWF cell. By default, MAXSIG0 is 0.
        optional: true
  griddata:
    fields:
      cg_ske_cr:
        type: array
        longname: elastic coarse specific storage
        description: is the initial elastic coarse-grained material specific storage or recompression
          index. The recompression index is specified if COMPRESSION_INDICES is specified in the OPTIONS
          block.  Specified or calculated elastic coarse-grained material specific storage values are
          not adjusted from initial values if HEAD_BASED is specified in the OPTIONS block.
        default: 1.0e-05
        netcdf: true
        dtype: double
        layered: true
        shape:
          - nodes
      cg_theta:
        type: array
        longname: initial coarse-grained material porosity
        description: is the initial porosity of coarse-grained materials.
        default: 0.2
        netcdf: true
        dtype: double
        layered: true
        shape:
          - nodes
      sgm:
        type: array
        longname: specific gravity of moist sediments
        description: is the specific gravity of moist or unsaturated sediments.  If not specified, then
          a default value of 1.7 is assigned.
        optional: true
        netcdf: true
        dtype: double
        layered: true
        shape:
          - nodes
      sgs:
        type: array
        longname: specific gravity of saturated sediments
        description: is the specific gravity of saturated sediments. If not specified, then a default
          value of 2.0 is assigned.
        optional: true
        netcdf: true
        dtype: double
        layered: true
        shape:
          - nodes
  packagedata:
    fields:
      packagedata:
        type: list
        optional: true
        item:
          type: record
          fields:
            icsubno:
              type: integer
              longname: CSUB id number for this entry
              description: integer value that defines the CSUB interbed number associated with the specified
                PACKAGEDATA data on the line. CSUBNO must be greater than zero and less than or equal
                to NINTERBEDS.  CSUB information must be specified for every CSUB cell or the program
                will terminate with an error.  The program will also terminate with an error if information
                for a CSUB interbed number is specified more than once.
              tagged: false
              index: true
              pk: true
            cellid:
              type: array
              longname: cell identifier
              description: is the cell identifier, and depends on the type of grid that is used for the
                simulation.  For a structured grid that uses the DIS input file, CELLID is the layer,
                row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D
                number.  If the model uses the unstructured discretization (DISU) input file, CELLID is
                the node number for the cell.
              tagged: false
              dtype: integer
              shape:
                - ncelldim
            cdelay:
              type: string
              longname: delay type
              description: 'character string that defines the subsidence delay type for the interbed.
                Possible subsidence package CDELAY strings include: NODELAY--character keyword to indicate
                that delay will not be simulated in the interbed.  DELAY--character keyword to indicate
                that delay will be simulated in the interbed.'
              tagged: false
            pcs0:
              type: double
              longname: initial stress
              description: is the initial offset from the calculated initial effective stress or initial
                preconsolidation stress in the interbed, in units of height of a column of water. PCS0
                is the initial preconsolidation stress if SPECIFIED_INITIAL_INTERBED_STATE or SPECIFIED_INITIAL_PRECONSOLIDATION_STRESS
                are specified in the OPTIONS block. If HEAD_BASED is specified in the OPTIONS block, PCS0
                is the initial offset from the calculated initial head or initial preconsolidation head
                in the CSUB interbed and the initial preconsolidation stress is calculated from the calculated
                initial effective stress or calculated initial geostatic stress, respectively.
              tagged: false
            thick_frac:
              type: double
              longname: interbed thickness or cell fraction
              description: is the interbed thickness or cell fraction of the interbed. Interbed thickness
                is specified as a fraction of the cell thickness if CELL_FRACTION is specified in the
                OPTIONS block.
              tagged: false
            rnb:
              type: double
              longname: delay interbed material factor
              description: is the interbed material factor equivalent number of interbeds in the interbed
                system represented by the interbed. RNB must be greater than or equal to 1 if CDELAY is
                DELAY. Otherwise, RNB can be any value.
              tagged: false
            ssv_cc:
              type: double
              longname: initial interbed inelastic specific storage
              description: is the initial inelastic specific storage or compression index of the interbed.
                The compression index is specified if COMPRESSION_INDICES is specified in the OPTIONS
                block. Specified or calculated interbed inelastic specific storage values are not adjusted
                from initial values if HEAD_BASED is specified in the OPTIONS block.
              tagged: false
            sse_cr:
              type: double
              longname: initial interbed elastic specific storage
              description: is the initial elastic coarse-grained material specific storage or recompression
                index of the interbed. The recompression index is specified if COMPRESSION_INDICES is
                specified in the OPTIONS block. Specified or calculated interbed elastic specific storage
                values are not adjusted from initial values if HEAD_BASED is specified in the OPTIONS
                block.
              tagged: false
            theta:
              type: double
              longname: initial interbed porosity
              description: is the initial porosity of the interbed.
              default: 0.2
              tagged: false
            kv:
              type: double
              longname: delay interbed vertical hydraulic conductivity
              description: is the vertical hydraulic conductivity of the delay interbed. KV must be greater
                than 0 if CDELAY is DELAY. Otherwise, KV can be any value.
              tagged: false
            h0:
              type: double
              longname: initial delay interbed head
              description: is the initial offset from the head in cell cellid or the initial head in the
                delay interbed. H0 is the initial head in the delay bed if SPECIFIED_INITIAL_INTERBED_STATE
                or SPECIFIED_INITIAL_DELAY_HEAD are specified in the OPTIONS block. H0 can be any value
                if CDELAY is NODELAY.
              tagged: false
            boundname:
              type: string
              longname: well name
              description: name of the CSUB cell.  BOUNDNAME is an ASCII character variable that can contain
                as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire name must
                be enclosed within single quotes.
              optional: true
              tagged: false
        shape:
          - ninterbeds
  period:
    fields:
      stress_period_data:
        type: list
        item:
          type: record
          fields:
            cellid:
              type: array
              longname: cell identifier
              description: is the cell identifier, and depends on the type of grid that is used for the
                simulation.  For a structured grid that uses the DIS input file, CELLID is the layer,
                row, and column.   For a grid that uses the DISV input file, CELLID is the layer and CELL2D
                number.  If the model uses the unstructured discretization (DISU) input file, CELLID is
                the node number for the cell.
              tagged: false
              dtype: integer
              shape:
                - ncelldim
            sig0:
              type: double
              longname: well stress offset
              description: is the stress offset for the cell. SIG0 is added to the calculated geostatic
                stress for the cell. SIG0 is specified only if MAXSIG0 is specified to be greater than
                0 in the DIMENSIONS block. If the Options block includes a TIMESERIESFILE entry (see the
                'Time-Variable Input' section), values can be obtained from a time series by entering
                the time-series name in place of a numeric value.
              tagged: false
              time_series: true
        shape:
          - maxsig0
    header:
      fill_forward: true
      field:
        name: iper
        type: integer
        longname: stress period number
        description: integer value specifying the starting stress period number for which the data specified
          in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and
          greater than zero.  The IPER value assigned to a stress period block must be greater than the
          IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD
          block will continue to apply for all subsequent stress periods, unless the program encounters
          another PERIOD block.
        tagged: false
