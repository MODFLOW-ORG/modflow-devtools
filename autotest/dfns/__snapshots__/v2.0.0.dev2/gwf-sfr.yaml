type: package
schema_version: 2.0.0.dev2
name: gwf-sfr
parent: gwf-nam
multi: true
subtype: advanced
dims:
  nreaches:
    value: nreaches
    scope: model
  auxiliary:
    value: len(auxiliary)
blocks:
  options:
    fields:
      storage:
        type: keyword
        longname: activate reach storage
        description: keyword that activates storage contributions to the stream-flow routing package continuity
          equation.
        optional: true
      auxiliary:
        type: array
        longname: keyword to specify aux variables
        description: defines an array of one or more auxiliary variable names.  There is no limit on the
          number of auxiliary variables that can be provided on this line; however, lists of information
          provided in subsequent blocks must have a column of data for each auxiliary variable name defined
          here.   The number of auxiliary variables detected on this line determines the value for naux.  Comments
          cannot be provided anywhere on this line as they will be interpreted as auxiliary variable names.  Auxiliary
          variables may not be used by the package, but they will be available for use by other parts
          of the program.  The program will terminate with an error if auxiliary variables are specified
          on more than one line in the options block.
        optional: true
        dtype: string
      boundnames:
        type: keyword
        description: keyword to indicate that boundary names may be provided with the list of stream reach
          cells.
        optional: true
      print_input:
        type: keyword
        longname: print input to listing file
        description: keyword to indicate that the list of stream reach information will be written to
          the listing file immediately after it is read.
        optional: true
      print_stage:
        type: keyword
        longname: print calculated stages to listing file
        description: keyword to indicate that the list of stream reach {#2} will be printed to the listing
          file for every stress period in which 'HEAD PRINT' is specified in Output Control.  If there
          is no Output Control option and PRINT_{#3} is specified, then {#2} are printed for the last
          time step of each stress period.
        optional: true
      print_flows:
        type: keyword
        longname: print calculated flows to listing file
        description: keyword to indicate that the list of stream reach flow rates will be printed to the
          listing file for every stress period time step in which 'BUDGET PRINT' is specified in Output
          Control.  If there is no Output Control option and 'PRINT_FLOWS' is specified, then flow rates
          are printed for the last time step of each stress period.
        optional: true
      save_flows:
        type: keyword
        longname: save stream reach flows to budget file
        description: keyword to indicate that stream reach flow terms will be written to the file specified
          with 'BUDGET FILEOUT' in Output Control.
        optional: true
      stage_filerecord:
        type: record
        optional: true
        fields:
          stage:
            type: keyword
            longname: stage keyword
            description: keyword to specify that record corresponds to stage.
          stagefile:
            type: file
            longname: file keyword
            description: name of the binary output file to write stage information.
            tagged: false
            direction: out
      budget_filerecord:
        type: record
        optional: true
        fields:
          budget:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to the budget.
          budgetfile:
            type: file
            longname: file keyword
            description: name of the binary output file to write budget information.
            tagged: false
            direction: out
      budgetcsv_filerecord:
        type: record
        optional: true
        fields:
          budgetcsv:
            type: keyword
            longname: budget keyword
            description: keyword to specify that record corresponds to the budget CSV.
          budgetcsvfile:
            type: file
            longname: file keyword
            description: name of the comma-separated value (CSV) output file to write budget summary information.  A
              budget summary record will be written to this file for each time step of the simulation.
            tagged: false
            direction: out
      package_convergence_filerecord:
        type: record
        optional: true
        fields:
          package_convergence:
            type: keyword
            longname: package_convergence keyword
            description: keyword to specify that record corresponds to the package convergence comma spaced
              values file.
          package_convergence_filename:
            type: file
            longname: file keyword
            description: name of the comma spaced values output file to write package convergence information.
            tagged: false
            direction: out
      ts_filerecord:
        type: record
        optional: true
        fields:
          ts6:
            type: keyword
            longname: head keyword
            description: keyword to specify that record corresponds to a time-series file.
          ts6_filename:
            type: file
            longname: file name of time series information
            description: defines a time-series file defining time series that can be used to assign time-varying
              values. See the 'Time-Variable Input' section for instructions on using the time-series
              capability.
            tagged: false
            direction: in
      obs_filerecord:
        type: record
        optional: true
        fields:
          obs6:
            type: keyword
            longname: obs keyword
            description: keyword to specify that record corresponds to an observations file.
          obs6_filename:
            type: file
            longname: obs6 input filename
            description: name of input file to define observations for the SFR package. See the 'Observation
              utility' section for instructions for preparing observation input files. Table {#2} lists
              observation type(s) supported by the SFR package.
            tagged: false
            direction: in
      mover:
        type: keyword
        description: keyword to indicate that this instance of the SFR Package can be used with the Water
          Mover (MVR) Package.  When the MOVER option is specified, additional memory is allocated within
          the package to store the available, provided, and received water.
        optional: true
      maximum_picard_iterations:
        type: integer
        longname: SFR picard iterations
        description: integer value that defines the maximum number of Streamflow Routing picard iterations
          allowed when solving for reach stages and flows as part of the GWF formulate step. Picard iterations
          are used to minimize differences in SFR package results between subsequent GWF picard (non-linear)
          iterations as a result of non-optimal reach numbering. If reaches are numbered in order, from
          upstream to downstream, MAXIMUM_PICARD_ITERATIONS can be set to 1 to reduce model run time.
          By default, MAXIMUM_PICARD_ITERATIONS is equal to 100.
        optional: true
      maximum_iterations:
        type: integer
        longname: SFR Newton-Raphson iterations
        description: integer value that defines the maximum number of Streamflow Routing Newton-Raphson
          iterations allowed for a reach. By default, MAXIMUM_ITERATIONS is equal to 100. MAXIMUM_ITERATIONS
          would only need to be increased from the default value if one or more reach in a simulation
          has a large water budget error.
        optional: true
      maximum_depth_change:
        type: double
        longname: depth closure tolerance
        description: real value that defines the depth closure tolerance. By default, MAXIMUM_DEPTH_CHANGE
          is equal to $1 times 10^{-5}$. The MAXIMUM_STAGE_CHANGE would only need to be increased or decreased
          from the default value if the water budget error for one or more reach is too small or too large,
          respectively.
        optional: true
      unit_conversion:
        type: double
        longname: conversion factor
        description: real value that is used to convert user-specified Manning's roughness coefficients
          from seconds per meters$^{1/3}$ to model length and time units. A constant of 1.486 is used
          for flow units of cubic feet per second, and a constant of 1.0 is used for units of cubic meters
          per second. The constant must be multiplied by 86,400 when using time units of days in the simulation.
        optional: true
        deprecated: 6.4.2
      length_conversion:
        type: double
        longname: length conversion factor
        description: real value that is used to convert user-specified Manning's roughness coefficients
          from meters to model length units. LENGTH_CONVERSION should be set to 3.28081, 1.0, and 100.0
          when using length units (LENGTH_UNITS) of feet, meters, or centimeters in the simulation, respectively.
          LENGTH_CONVERSION does not need to be specified if LENGTH_UNITS are meters.
        optional: true
      time_conversion:
        type: double
        longname: time conversion factor
        description: real value that is used to convert user-specified Manning's roughness coefficients
          from seconds to model time units. TIME_CONVERSION should be set to 1.0, 60.0, 3,600.0, 86,400.0,
          and 31,557,600.0 when using time units (TIME_UNITS) of seconds, minutes, hours, days, or years
          in the simulation, respectively. TIME_CONVERSION does not need to be specified if TIME_UNITS
          are seconds.
        optional: true
      dev_storage_weight:
        type: double
        longname: reach storage time weighting
        description: real number value that defines the time weighting factor used to calculate the change
          in channel storage. STORAGE_WEIGHT must have a value between 0.5 and 1. Default STORAGE_WEIGHT
          value is 1.
        optional: true
        developmode: true
  dimensions:
    fields:
      nreaches:
        type: integer
        longname: maximum number reaches
        description: integer value specifying the number of stream reaches.  There must be NREACHES entries
          in the PACKAGEDATA block.
  packagedata:
    fields:
      packagedata:
        type: list
        item:
          type: record
          fields:
            ifno:
              type: integer
              longname: reach number for this entry
              description: integer value that defines the feature (reach) number associated with the specified
                PACKAGEDATA data on the line. IFNO must be greater than zero and less than or equal to
                NREACHES. Reach information must be specified for every reach or the program will terminate
                with an error.  The program will also terminate with an error if information for a reach
                is specified more than once.
              tagged: false
              index: true
              pk: true
            cellid:
              type: array
              longname: cell identifier
              description: is the cell identifier, and depends on the type of grid that is used for the
                simulation. For a structured grid that uses the DIS input file, CELLID is the layer, row,
                and column. For a grid that uses the DISV input file, CELLID is the layer and CELL2D number.
                If the model uses the unstructured discretization (DISU) input file, CELLID is the node
                number for the cell. For reaches that are not connected to an underlying GWF cell, a zero
                should be specified for each grid dimension. For example, for a DIS grid a CELLID of 0
                0 0 should be specified. Reach-aquifer flow is not calculated for unconnected reaches.
                The keyword NONE can be still be specified to identify unconnected reaches for backward
                compatibility with previous versions of MODFLOW 6 but eventually NONE will be deprecated
                and will cause MODFLOW 6 to terminate with an error.
              tagged: false
              dtype: integer
              shape:
                - ncelldim
            rlen:
              type: double
              longname: reach length
              description: real value that defines the reach length. RLEN must be greater than zero.
              tagged: false
            rwid:
              type: double
              longname: reach width
              description: real value that defines the reach width. RWID must be greater than zero.
              tagged: false
            rgrd:
              type: double
              longname: stream gradient
              description: real value that defines the stream gradient (slope) across the reach. RGRD
                must be greater than zero.
              tagged: false
            rtp:
              type: double
              longname: reach streambed top elevation
              description: real value that defines the top elevation of the streambed of a reach.
              tagged: false
            rbth:
              type: double
              longname: streambed thickness
              description: real value that defines the thickness of the reach streambed. RBTH can be any
                value if the reach is not connected to an underlying GWF cell. Otherwise, RBTH must be
                greater than zero.
              tagged: false
            rhk:
              type: double
              longname: reach bed hydraulic conductivity
              description: real or character value that defines the hydraulic conductivity of the reach
                streambed. RHK can be any positive value if the reach is not connected to an underlying
                GWF cell. Otherwise, RHK must be greater than zero. If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              tagged: false
              time_series: true
            man:
              type: string
              longname: Manning's roughness coefficient
              description: real or character value that defines the Manning's roughness coefficient for
                the reach. MAN must be greater than zero.  If the Options block includes a TIMESERIESFILE
                entry (see the 'Time-Variable Input' section), values can be obtained from a time series
                by entering the time-series name in place of a numeric value.
              tagged: false
              time_series: true
            ncon:
              type: integer
              longname: number of connected reaches
              description: integer value that defines the number of reaches connected to the reach.  If
                a value of zero is specified for NCON an entry for IFNO is still required in the subsequent
                CONNECTIONDATA block.
              tagged: false
            ustrf:
              type: double
              longname: fraction of upstream flow
              description: real value that defines the fraction of upstream flow from each upstream reach
                that is applied as upstream inflow to the reach. The sum of all USTRF values for all reaches
                connected to the same upstream reach must be equal to one and USTRF must be greater than
                or equal to zero. If the Options block includes a TIMESERIESFILE entry (see the 'Time-Variable
                Input' section), values can be obtained from a time series by entering the time-series
                name in place of a numeric value.
              tagged: false
              time_series: true
            ndv:
              type: integer
              longname: number of downstream reaches
              description: integer value that defines the number of downstream diversions for the reach.
              tagged: false
            aux:
              type: array
              longname: auxiliary variables
              description: represents the values of the auxiliary variables for each stream reach. The
                values of auxiliary variables must be present for each stream reach. The values must be
                specified in the order of the auxiliary variables specified in the OPTIONS block.  If
                the package supports time series and the Options block includes a TIMESERIESFILE entry
                (see the 'Time-Variable Input' section), values can be obtained from a time series by
                entering the time-series name in place of a numeric value.
              optional: true
              tagged: false
              dtype: double
              time_series: true
              shape:
                - auxiliary
            boundname:
              type: string
              longname: well name
              description: name of the stream reach cell.  BOUNDNAME is an ASCII character variable that
                can contain as many as 40 characters.  If BOUNDNAME contains spaces in it, then the entire
                name must be enclosed within single quotes.
              optional: true
              tagged: false
        shape:
          - nreaches
  crosssections:
    fields:
      crosssections:
        type: list
        item:
          type: record
          fields:
            ifno:
              type: integer
              longname: reach number for this entry
              description: integer value that defines the feature (reach) number associated with the specified
                cross-section table file on the line. IFNO must be greater than zero and less than or
                equal to NREACHES. The program will also terminate with an error if table information
                for a reach is specified more than once.
              tagged: false
              index: true
              fk: packagedata.ifno
            tab6:
              type: keyword
              longname: head keyword
              description: keyword to specify that record corresponds to a cross-section table file.
            filein:
              type: keyword
              longname: file keyword
              description: keyword to specify that an input filename is expected next.
            tab6_filename:
              type: string
              longname: table file name
              description: character string that defines the path and filename for the file containing
                cross-section table data for the reach. The TAB6_FILENAME file includes the number of
                entries in the file and the station elevation data in terms of the fractional width and
                the reach depth. Instructions for creating the TAB6_FILENAME input file are provided in
                SFR Reach Cross-Section Table Input File section.
              tagged: false
              case_sensitive: true
  connectiondata:
    fields:
      connectiondata:
        type: list
        item:
          type: record
          fields:
            ifno:
              type: integer
              longname: reach number for this entry
              description: integer value that defines the feature (reach) number associated with the specified
                CONNECTIONDATA data on the line. IFNO must be greater than zero and less than or equal
                to NREACHES. Reach connection information must be specified for every reach or the program
                will terminate with an error.  The program will also terminate with an error if connection
                information for a reach is specified more than once.
              tagged: false
              index: true
              fk: packagedata.ifno
            ic:
              type: array
              longname: connected reach numbers
              description: integer value that defines the reach number of the reach connected to the current
                reach and whether it is connected to the upstream or downstream end of the reach. Negative
                IC numbers indicate connected reaches are connected to the downstream end of the current
                reach. Positive IC numbers indicate connected reaches are connected to the upstream end
                of the current reach. The absolute value of IC must be greater than zero and less than
                or equal to NREACHES. IC should not be specified when NCON is zero but must be specified
                otherwise.
              optional: true
              tagged: false
              dtype: integer
              index: true
              shape:
                - packagedata.ncon(ifno)
  diversions:
    fields:
      diversions:
        type: list
        item:
          type: record
          fields:
            ifno:
              type: integer
              longname: reach number for this entry
              description: integer value that defines the feature (reach) number associated with the specified
                DIVERSIONS data on the line. IFNO must be greater than zero and less than or equal to
                NREACHES.  Reach diversion information must be specified for every reach with a NDV value
                greater than 0 or the program will terminate with an error.  The program will also terminate
                with an error if diversion information for a given reach diversion is specified more than
                once.
              tagged: false
              index: true
              fk: packagedata.ifno
            idv:
              type: integer
              longname: downstream diversion number
              description: integer value that defines the downstream diversion number for the diversion
                for reach IFNO. IDV must be greater than zero and less than or equal to NDV for reach
                IFNO.
              tagged: false
              index: true
            iconr:
              type: integer
              longname: downstream reach number for diversion
              description: integer value that defines the downstream reach that will receive the diverted
                water. IDV must be greater than zero and less than or equal to NREACHES. Furthermore,
                reach  ICONR must be a downstream connection for reach IFNO.
              tagged: false
              index: true
              fk: packagedata.ifno
            cprior:
              type: string
              longname: iprior code
              description: 'character string value that defines the the prioritization system for the
                diversion, such as when insufficient water is available to meet all diversion stipulations,
                and is used in conjunction with the value of FLOW value specified in the STRESS_PERIOD_DATA
                section. Available diversion options include:  (1) CPRIOR = `FRACTION'', then the amount
                of the diversion is computed as a fraction of the streamflow leaving reach IFNO ($Q_{DS}$);
                in this case, 0.0 $le$ DIVFLOW $le$ 1.0.  (2) CPRIOR = `EXCESS'', a diversion is made
                only if $Q_{DS}$ for reach IFNO exceeds the value of DIVFLOW. If this occurs, then the
                quantity of water diverted is the excess flow ($Q_{DS} -$ DIVFLOW) and $Q_{DS}$ from reach
                IFNO is set equal to DIVFLOW. This represents a flood-control type of diversion, as described
                by Danskin and Hanson (2002). (3) CPRIOR = `THRESHOLD'', then if $Q_{DS}$ in reach IFNO
                is less than the specified diversion flow DIVFLOW, no water is diverted from reach IFNO.
                If $Q_{DS}$ in reach IFNO is greater than or equal to DIVFLOW, DIVFLOW is diverted and
                $Q_{DS}$ is set to the remainder ($Q_{DS} -$ DIVFLOW)). This approach assumes that once
                flow in the stream is sufficiently low, diversions from the stream cease, and is the `priority''
                algorithm that originally was programmed into the STR1 Package (Prudic, 1989).  (4) CPRIOR
                = `UPTO'' -- if $Q_{DS}$ in reach IFNO is greater than or equal to the specified diversion
                flow DIVFLOW, $Q_{DS}$ is reduced by DIVFLOW. If $Q_{DS}$ in reach IFNO is less than DIVFLOW,
                DIVFLOW is set to $Q_{DS}$ and there will be no flow available for reaches connected to
                downstream end of reach IFNO.'
              tagged: false
  initialstages:
    fields:
      initialstages:
        type: list
        item:
          type: record
          fields:
            ifno:
              type: integer
              longname: reach number for this entry
              description: integer value that defines the feature (reach) number associated with the specified
                initial stage. Initial stage data must be specified for every reach or the program will
                terminate with an error. The program will also terminate with a error if IFNO is less
                than one or greater than NREACHES.
              tagged: false
              index: true
              fk: packagedata.ifno
            initialstage:
              type: double
              longname: initial reach stage
              description: real value that defines the initial stage for the reach. The program will terminate
                with an error if INITIALSTAGE is less than the RTP value for reach IFNO defined in the
                PACKAGEDATA block.  INITIALSTAGE data are used only if STORAGE is specified in the Options
                block and the first stress period is transient or for reaches defined to use the SIMPLE
                STATUS in the Period block.
              tagged: false
  period:
    fields:
      perioddata:
        type: list
        item:
          type: record
          fields:
            ifno:
              type: integer
              longname: reach number for this entry
              description: integer value that defines the feature (reach) number associated with the specified
                PERIOD data on the line. IFNO must be greater than zero and less than or equal to NREACHES.
              tagged: false
              index: true
              fk: packagedata.ifno
            sfrsetting:
              type: union
              description: 'line of information that is parsed into a keyword and values.  Keyword values
                that can be used to start the SFRSETTING string include: STATUS, BEDK, MANNING, STAGE,
                INFLOW, RAINFALL, EVAPORATION, RUNOFF, DIVERSION, UPSTREAM_FRACTION, and AUXILIARY.'
              arms:
                status:
                  type: string
                  longname: reach status
                  description: keyword option to define stream reach status.  STATUS can be ACTIVE, INACTIVE,
                    or SIMPLE. The SIMPLE STATUS option simulates streamflow using a user-specified stage
                    for a reach or a stage set to the top of the reach (depth = 0). In cases where the
                    simulated leakage calculated using the specified stage exceeds the sum of inflows
                    to the reach, the stage is set to the top of the reach and leakage is set equal to
                    the sum of inflows. Upstream fractions should be changed using the UPSTREAM_FRACTION
                    SFRSETTING if the status for one or more reaches is changed to ACTIVE or INACTIVE.
                    For example, if one of two downstream connections for a reach is inactivated, the
                    upstream fraction for the active and inactive downstream reach should be changed to
                    1.0 and 0.0, respectively, to ensure that the active reach receives all of the downstream
                    outflow from the upstream reach. By default, STATUS is ACTIVE.
                bedk:
                  type: string
                  longname: reach bed hydraulic conductivity
                  description: real or character value that defines the hydraulic conductivity of the
                    reach streambed. BEDK can be any positive value if the reach is not connected to an
                    underlying GWF cell. Otherwise, BEDK must be greater than zero. If the Options block
                    includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can
                    be obtained from a time series by entering the time-series name in place of a numeric
                    value.
                  time_series: true
                manning:
                  type: string
                  longname: reach Manning's roughness coefficient
                  description: real or character value that defines the Manning's roughness coefficient
                    for the reach. MANNING must be greater than zero.  If the Options block includes a
                    TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained
                    from a time series by entering the time-series name in place of a numeric value.
                  time_series: true
                stage:
                  type: string
                  longname: reach stage
                  description: real or character value that defines the stage for the reach. The specified
                    STAGE is only applied if the reach uses the simple routing option. If STAGE is not
                    specified for reaches that use the simple routing option, the specified stage is set
                    to the top of the reach. If the Options block includes a TIMESERIESFILE entry (see
                    the 'Time-Variable Input' section), values can be obtained from a time series by entering
                    the time-series name in place of a numeric value.
                  time_series: true
                inflow:
                  type: string
                  longname: inflow rate
                  description: real or character value that defines the volumetric inflow rate for the
                    streamflow routing reach. If the Options block includes a TIMESERIESFILE entry (see
                    the 'Time-Variable Input' section), values can be obtained from a time series by entering
                    the time-series name in place of a numeric value. By default, inflow rates are zero
                    for each reach.
                  time_series: true
                rainfall:
                  type: string
                  longname: rainfall rate
                  description: real or character value that defines the  volumetric rate per unit area
                    of water added by precipitation directly on the streamflow routing reach. If the Options
                    block includes a TIMESERIESFILE entry (see the 'Time-Variable Input' section), values
                    can be obtained from a time series by entering the time-series name in place of a
                    numeric value. By default, rainfall  rates are zero for each reach.
                  time_series: true
                evaporation:
                  type: string
                  longname: evaporation rate
                  description: real or character value that defines the volumetric rate per unit area
                    of water subtracted by evaporation from the streamflow routing reach. A positive evaporation
                    rate should be provided. If the Options block includes a TIMESERIESFILE entry (see
                    the 'Time-Variable Input' section), values can be obtained from a time series by entering
                    the time-series name in place of a numeric value. If the volumetric evaporation rate
                    for a reach exceeds the sources of water to the reach (upstream and specified inflows,
                    rainfall, and runoff but excluding groundwater leakage into the reach) the volumetric
                    evaporation rate is limited to the sources of water to the reach. By default, evaporation
                    rates are zero for each reach.
                  time_series: true
                runoff:
                  type: string
                  longname: runoff rate
                  description: real or character value that defines the volumetric rate of diffuse overland
                    runoff that enters the streamflow routing reach. If the Options block includes a TIMESERIESFILE
                    entry (see the 'Time-Variable Input' section), values can be obtained from a time
                    series by entering the time-series name in place of a numeric value. If the volumetric
                    runoff rate for a reach is negative and exceeds inflows to the reach (upstream and
                    specified inflows, and rainfall but excluding groundwater leakage into the reach)
                    the volumetric runoff rate is limited to inflows to the reach and the volumetric evaporation
                    rate for the reach is set to zero. By default, runoff rates are zero for each reach.
                  time_series: true
                diversionrecord:
                  type: record
                  fields:
                    diversion:
                      type: keyword
                      longname: diversion keyword
                      description: keyword to indicate diversion record.
                    idv:
                      type: integer
                      longname: diversion number
                      description: an integer value specifying which diversion of reach IFNO that DIVFLOW
                        is being specified for.  Must be less or equal to ndv for the current reach (IFNO).
                      tagged: false
                      index: true
                    divflow:
                      type: double
                      longname: volumetric diversion flow rate
                      description: real or character value that defines the volumetric diversion (DIVFLOW)
                        rate for the streamflow routing reach. If the Options block includes a TIMESERIESFILE
                        entry (see the 'Time-Variable Input' section), values can be obtained from a time
                        series by entering the time-series name in place of a numeric value.
                      tagged: false
                      time_series: true
                upstream_fraction:
                  type: double
                  longname: fraction of upstream flow
                  description: real value that defines the fraction of upstream flow (USTRF) from each
                    upstream reach that is applied as upstream inflow to the reach. The sum of all USTRF
                    values for all reaches connected to the same upstream reach must be equal to one.
                cross_sectionrecord:
                  type: record
                  fields:
                    cross_section:
                      type: keyword
                      longname: cross_section keyword
                      description: keyword to specify that record corresponds to a reach cross-section.
                    tab6:
                      type: keyword
                      longname: head keyword
                      description: keyword to specify that record corresponds to a cross-section table
                        file.
                    tab6_filename:
                      type: file
                      longname: table file name
                      description: character string that defines the path and filename for the file containing
                        cross-section table data for the reach. The TAB6_FILENAME file includes the number
                        of entries in the file and the station elevation data in terms of the fractional
                        width and the reach depth. Instructions for creating the TAB6_FILENAME input file
                        are provided in SFR Reach Cross-Section Table Input File section.
                      tagged: false
                      direction: in
                auxiliaryrecord:
                  type: record
                  fields:
                    auxiliary:
                      type: keyword
                      description: keyword for specifying auxiliary variable.
                    auxname:
                      type: string
                      description: name for the auxiliary variable to be assigned AUXVAL.  AUXNAME must
                        match one of the auxiliary variable names defined in the OPTIONS block. If AUXNAME
                        does not match one of the auxiliary variable names defined in the OPTIONS block
                        the data are ignored.
                      tagged: false
                    auxval:
                      type: double
                      longname: auxiliary variable value
                      description: value for the auxiliary variable.  If the Options block includes a
                        TIMESERIESFILE entry (see the 'Time-Variable Input' section), values can be obtained
                        from a time series by entering the time-series name in place of a numeric value.
                      tagged: false
                      time_series: true
    header:
      fill_forward: true
      field:
        name: iper
        type: integer
        longname: stress period number
        description: integer value specifying the starting stress period number for which the data specified
          in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and
          greater than zero.  The IPER value assigned to a stress period block must be greater than the
          IPER value assigned for the previous PERIOD block.  The information specified in the PERIOD
          block will continue to apply for all subsequent stress periods, unless the program encounters
          another PERIOD block.
        tagged: false
