type = "package"
schema_version = "2.0.0.dev2"
name = "utl-tas"
parent = "package"
multi = true
subtype = "utility"

[dims.time_series_name]
value = "len(time_series_name)"

[blocks.attributes.fields.time_series_namerecord]
type = "record"
description = "xxx"

[blocks.attributes.fields.time_series_namerecord.fields.name]
type = "keyword"
description = "xxx"

[blocks.attributes.fields.time_series_namerecord.fields.time_series_name]
type = "array"
description = "Name by which a package references a particular time-array series. The name must be unique among all time-array series used in a package."
tagged = false
dtype = "string"

[blocks.attributes.fields.interpolation_methodrecord]
type = "record"
description = "xxx"
optional = true

[blocks.attributes.fields.interpolation_methodrecord.fields.method]
type = "keyword"
description = " xxx"

[blocks.attributes.fields.interpolation_methodrecord.fields.interpolation_method]
type = "string"
description = "Interpolation method, which is either STEPWISE or LINEAR."
tagged = false
valid = [
    "stepwise",
    "linear",
    "linearend",
]

[blocks.attributes.fields.sfacrecord]
type = "record"
description = "xxx"
optional = true

[blocks.attributes.fields.sfacrecord.fields.sfac]
type = "keyword"
description = " xxx"

[blocks.attributes.fields.sfacrecord.fields.sfacval]
type = "array"
description = "Scale factor, which will multiply all array values in time series. SFAC is an optional attribute; if omitted, SFAC = 1.0."
tagged = false
dtype = "double"
shape = [
    "time_series_name",
]

[blocks.time.fields.tas_array]
type = "array"
description = "An array of numeric, floating-point values, or a constant value, readable by the U2DREL array-reading utility."
tagged = false
dtype = "double"
shape = [
    "ncpl",
]

[blocks.time.header]
name = "time_from_model_start"
type = "double"
description = "A numeric time relative to the start of the simulation, in the time unit used in the simulation. Times must be strictly increasing."
tagged = false
